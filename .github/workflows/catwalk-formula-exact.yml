name: catwalk-formula-exact
on:
  push:
    branches: [feat/catwalk-formula-exact]
    paths:
      - 'catwalk-theory/formula-exact/**'
      - '.github/workflows/catwalk-formula-exact.yml'
  workflow_dispatch:
jobs:
  solve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - run: python catwalk-theory/formula-exact/solve_formula_exact_v4.py | tee formula_exact_v4_log.txt
      - name: Collect repaired results
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p /tmp/formula-exact-v4
          cp -f formula_exact_v4_log.txt /tmp/formula-exact-v4/
          cp -f catwalk-theory/formula-exact/results_v4/*.csv /tmp/formula-exact-v4/ || true
          cp -f catwalk-theory/formula-exact/results_v4/*.json /tmp/formula-exact-v4/ || true
          printf '%s\n' "${GITHUB_SHA}" > /tmp/formula-exact-v4/GITHUB_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catwalk-formula-exact-v4-results
          path: /tmp/formula-exact-v4/
          if-no-files-found: error
