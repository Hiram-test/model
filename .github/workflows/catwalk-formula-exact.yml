name: catwalk-formula-exact
on:
  push:
    branches: [feat/catwalk-formula-exact]
    paths:
      - 'catwalk-theory/formula-exact/**'
      - '.github/workflows/catwalk-formula-exact.yml'
  workflow_dispatch:
jobs:
  solve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - run: python catwalk-theory/formula-exact/solve_formula_exact.py | tee formula_exact_results.txt
      - name: Stamp boundary evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p /tmp/formula-exact-delivery
          cp -f formula_exact_results.txt /tmp/formula-exact-delivery/formula_exact_results.txt || true
          cp -f catwalk-theory/formula-exact/FORMULA_EXACT.bound.md /tmp/formula-exact-delivery/BOUND.md
          cp -f catwalk-theory/formula-exact/case.txt /tmp/formula-exact-delivery/case.txt
          printf '%s\n' "${GITHUB_SHA}" > /tmp/formula-exact-delivery/GITHUB_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catwalk-formula-exact-boundary
          path: /tmp/formula-exact-delivery/
          if-no-files-found: warn
