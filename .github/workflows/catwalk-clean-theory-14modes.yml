name: Clean Catwalk Fourteen Modes # Dedicated workflow for the clean theoretical catwalk solve.
on: # Define only branch-scoped triggers for this calculation.
  push: # Recompute when the dedicated solver or this workflow changes.
    branches: [feat/catwalk-clean-theory-14modes] # Restrict execution to the clean-theory branch.
    paths: # Restrict triggering paths to the isolated calculation package.
      - "catwalk-fem/clean-theory-14modes/**" # Trigger for solver and comparison changes.
      - ".github/workflows/catwalk-clean-theory-14modes.yml" # Trigger when this workflow is revised.
  workflow_dispatch: # Allow an explicit manual rerun without changing model inputs.
permissions: # Keep repository checkout read-only for the solve.
  contents: read # Grant only source checkout permission.
jobs: # Define the bounded calculation job.
  solve: # Run the clean theoretical inverse-statics and modal solve.
    runs-on: ubuntu-24.04 # Use a current GitHub-hosted Linux runner.
    timeout-minutes: 30 # Bound dependency installation and matrix solve time.
    steps: # Execute the full reproducible calculation chain.
      - name: Checkout # Fetch the exact triggering branch state.
        uses: actions/checkout@v4 # Use the maintained checkout action.
        with: # Configure a deterministic shallow checkout.
          fetch-depth: 1 # Fetch only the triggering commit.
          persist-credentials: false # Prevent later repository writes from the runner.
      - name: Set up Python # Install the Python runtime used by the solver.
        uses: actions/setup-python@v5 # Use the maintained Python setup action.
        with: # Freeze the interpreter major/minor version.
          python-version: "3.12" # Use Python 3.12 for SciPy compatibility.
      - name: Install numerical dependencies # Install only the libraries imported by the final solver.
        shell: bash # Use strict Bash for dependency installation.
        run: | # Execute one deterministic installation block.
          set -euxo pipefail # Fail immediately on any command or pipeline error.
          python -m pip install --upgrade pip # Use the current package installer.
          python -m pip install numpy scipy matplotlib # Install sparse eigensolver, optimization, and plotting dependencies.
      - name: Clean previous results # Guarantee the uploaded result directory belongs to this run only.
        shell: bash # Use Bash for filesystem cleanup.
        run: | # Remove any stale result directory before solving.
          set -euxo pipefail # Fail on unexpected filesystem errors.
          rm -rf catwalk-fem/clean-theory-14modes/results # Delete stale calculation outputs.
      - name: Run final clean inverse statics and modal solve # Execute the target-free calculation and corrected physical classification.
        shell: bash # Use strict Bash for the solver invocation.
        run: | # Run the final solver from its own directory.
          set -euxo pipefail # Fail immediately if the solver exits nonzero.
          python catwalk-fem/clean-theory-14modes/solve_v3.py # Rebuild prestress, solve K-M eigenpairs, and classify twin-catwalk global torsion from differential vertical motion.
      - name: Run post-freeze comparison # Load the fourteen external frequencies only after frozen_results.json exists.
        shell: bash # Use strict Bash for the comparison node.
        run: | # Execute the isolated comparison script.
          set -euxo pipefail # Fail on any comparison or file error.
          python catwalk-fem/clean-theory-14modes/compare_after_freeze.py # Generate external error statistics without changing the solve or classification.
      - name: Verify required outputs # Reject incomplete or silently truncated calculations.
        shell: bash # Use Bash for deterministic file and content checks.
        run: | # Verify all core outputs before artifact publication.
          set -euxo pipefail # Fail on the first missing or inconsistent output.
          test -s catwalk-fem/clean-theory-14modes/results/frozen_results.json # Require the target-free frozen result file.
          test -s catwalk-fem/clean-theory-14modes/results/raw_modes.csv # Require the raw global modal spectrum.
          test -s catwalk-fem/clean-theory-14modes/results/classified_14_modes.csv # Require the fourteen physical-family classification table.
          test -s catwalk-fem/clean-theory-14modes/results/comparison_after_freeze.csv # Require the post-freeze comparison table.
          test -s catwalk-fem/clean-theory-14modes/results/unstressed_lengths.json # Require recovered unstressed cable lengths.
          test -s catwalk-fem/clean-theory-14modes/results/mode_shape_TA1.png # Require the global torsion TA1 shape plot.
          test -s catwalk-fem/clean-theory-14modes/results/mode_shape_TS1.png # Require the global torsion TS1 shape plot.
          test -s catwalk-fem/clean-theory-14modes/results/mode_shape_TS2.png # Require the global torsion TS2 shape plot.
          sha256sum catwalk-fem/clean-theory-14modes/results/* > catwalk-fem/clean-theory-14modes/results/SHA256SUMS.txt # Freeze every result file for delivery.
          printf '%s\n' "$GITHUB_SHA" > catwalk-fem/clean-theory-14modes/results/GITHUB_COMMIT.txt # Record the exact source commit identity.
      - name: Stamp boundary evidence after success or residual reject
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p catwalk-fem/clean-theory-14modes/results
          cp -f catwalk-fem/clean-theory-14modes/CLEAN_THEORY_14MODES.bound.md catwalk-fem/clean-theory-14modes/results/BOUND.md
          cp -f catwalk-fem/clean-theory-14modes/case.txt catwalk-fem/clean-theory-14modes/results/CASE_BOUND.txt
          printf '%s\n' "${GITHUB_SHA}" > catwalk-fem/clean-theory-14modes/results/GITHUB_COMMIT.txt
          if [ ! -s catwalk-fem/clean-theory-14modes/results/frozen_results.json ]; then
            printf '%s\n' \
              'frequency_reproduced=false' \
              'not_attach_ta1=true' \
              'not_attach_fourteen_mode_table=true' \
              'inverse_equilibrium_rejected=true' \
              'note=A rejected inverse static is not a 14-mode table and not attach TA1.' \
              > catwalk-fem/clean-theory-14modes/results/INVERSE_RESIDUAL_REJECT.txt
          fi
      - name: Upload complete result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-catwalk-clean-theory-14modes-v3-boundary
          path: catwalk-fem/clean-theory-14modes/results/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
