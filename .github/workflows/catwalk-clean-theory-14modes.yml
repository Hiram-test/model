name: Clean catwalk 44-cable topology diagnostic  # Inspect-only until solve_clean_model.py exists; not a 14-mode table.
on:  # Define workflow activation conditions.
  push:  # Run whenever the clean-model source changes on its isolated branch.
    branches:  # Restrict execution to the isolated calculation branch.
      - feat/catwalk-clean-theory-14modes  # Select the dedicated clean-model branch.
    paths:  # Restrict push activation to calculation source files.
      - 'catwalk-theory/clean-44cable-modal/*.py'  # Watch Python calculation and diagnostic sources.
      - '.github/workflows/catwalk-clean-theory-14modes.yml'  # Watch this workflow definition.
  workflow_dispatch:  # Permit an explicit manual rerun without changing model inputs.
permissions:  # Declare the minimum repository permissions required by this workflow.
  contents: write  # Allow the workflow to commit deterministic calculation artifacts.
jobs:  # Define the workflow jobs.
  inspect:  # Topology diagnostic only; solver and comparison stay optional and separate.
    runs-on: ubuntu-24.04  # Use a current deterministic Linux runner.
    timeout-minutes: 60  # Bound the calculation runtime without changing the numerical model.
    steps:  # Define the ordered job steps.
      - name: Check out isolated calculation branch  # Retrieve the exact committed source state.
        uses: actions/checkout@v4  # Use the official repository checkout action.
        with:  # Configure the checkout action.
          ref: feat/catwalk-clean-theory-14modes  # Check out the dedicated clean-model branch.
          fetch-depth: 1  # Fetch only the committed state needed for this run.
      - name: Set up Python  # Install the requested Python runtime.
        uses: actions/setup-python@v5  # Use the official Python setup action.
        with:  # Configure the Python runtime.
          python-version: '3.12'  # Use Python 3.12 for the model scripts.
      - name: Install numerical and reporting dependencies  # Install only explicit open-source runtime dependencies.
        run: python -m pip install --upgrade pip numpy scipy matplotlib reportlab  # Install the sparse solver and deterministic report stack.
      - name: Inspect geometry-only MCT topology  # Verify cable chains, portal links, passages, and supports before solving.
        run: python catwalk-theory/clean-44cable-modal/inspect_clean_input.py  # Execute the hash-checked topology diagnostic.
      - name: Run clean 44-cable modal solver when present  # Execute the complete solver after it has been committed.
        run: |  # Start a conditional shell block.
          if [ -f catwalk-theory/clean-44cable-modal/solve_clean_model.py ]; then  # Check whether the solver source exists.
            python catwalk-theory/clean-44cable-modal/solve_clean_model.py  # Run geometry inversion, matrix assembly, eigenanalysis, and classification.
          fi  # End the solver-source condition.
      - name: Compare frozen modes with the external fourteen-mode table when present  # Keep benchmark comparison separate from model construction.
        run: |  # Start a conditional comparison block.
          if [ -f catwalk-theory/clean-44cable-modal/compare_after_freeze.py ]; then  # Check whether the post-freeze comparison source exists.
            python catwalk-theory/clean-44cable-modal/compare_after_freeze.py  # Run the benchmark-only comparison after freezing the calculated modes.
          fi  # End the comparison-source condition.
      - name: Commit deterministic artifacts  # Persist diagnostics and calculation products on the isolated branch.
        run: |  # Start the artifact commit shell block.
          git config user.name 'github-actions[bot]'  # Configure the standard Actions commit identity.
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'  # Configure the standard Actions email identity.
          git add catwalk-theory/clean-44cable-modal/artifacts  # Stage only deterministic calculation artifacts.
          if ! git diff --cached --quiet; then  # Check whether this run produced changed artifacts.
            git commit -m 'Record clean catwalk calculation artifacts [skip ci]'  # Commit outputs without recursively starting another run.
            git push origin HEAD:feat/catwalk-clean-theory-14modes  # Push the exact output commit to the isolated branch.
          fi  # End the changed-artifact condition.
      - name: Copy source and parser into the transient artifact directory  # After the git commit so copies are zip-only.
        run: |
          cp 'catwalk-fem/mct-from-zero/source/01_设计资料与规范/猫道 - 门架索合建模型2.mct' 'catwalk-theory/clean-44cable-modal/artifacts/source_geometry.mct'
          cp 'catwalk-fem/mct-from-zero/parse_mct.py' 'catwalk-theory/clean-44cable-modal/artifacts/parse_mct.py'
          python3 << 'PY'
          import hashlib
          want = {
              "source_geometry.mct": "0d18e3f7b009e0306fb4b9f3051b4a16d05fa24d9e966774e809b8942a4f22e1",
              "parse_mct.py": "919632663922fd86335c2434cac92b8d1127d2fb21d5d15c9f61cf85e1f7c69b",
          }
          base = "catwalk-theory/clean-44cable-modal/artifacts"
          for name, exp in want.items():
              digest = hashlib.sha256(open(f"{base}/{name}", "rb").read()).hexdigest()
              assert digest == exp, (name, digest)
              print(name, digest)
          PY
          echo 'kind=mct_topology_diagnostic_only' >> catwalk-theory/clean-44cable-modal/artifacts/case.txt
          echo 'source_geometry_sha256=0d18e3f7b009e0306fb4b9f3051b4a16d05fa24d9e966774e809b8942a4f22e1' >> catwalk-theory/clean-44cable-modal/artifacts/case.txt
          echo 'parse_mct_sha256=919632663922fd86335c2434cac92b8d1127d2fb21d5d15c9f61cf85e1f7c69b' >> catwalk-theory/clean-44cable-modal/artifacts/case.txt
          echo 'frequency_reproduced=false' >> catwalk-theory/clean-44cable-modal/artifacts/case.txt
      - name: Upload topology diagnostic package  # Preserve diagnostics, parser, and the exact geometry-only source for independent review.
        uses: actions/upload-artifact@v4  # Use the official artifact upload action.
        with:  # Configure the uploaded diagnostic package.
          name: clean-catwalk-44cable-topology-diagnostic-boundary  # Name the package as inspect-only.
          path: catwalk-theory/clean-44cable-modal/artifacts  # Upload the complete transient diagnostic directory.
          if-no-files-found: error  # Fail rather than silently publish an empty result package.
          compression-level: 6  # Use balanced deterministic ZIP compression.
