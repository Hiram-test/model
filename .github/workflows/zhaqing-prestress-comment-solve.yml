name: Zhaqing prestress reference perturbation command solve # Execute the balanced prestress-reference and second-order static verification on demand from PR9.
on: # Use the already proven issue-comment event on the default branch so the run is externally observable.
  issue_comment: # Listen to top-level issue and pull-request comments through the registered default-branch workflow.
    types: [created] # Start only when a new command comment is created.
permissions: # Grant only the permissions required to recover sources, read baseline artifacts, and report results.
  contents: read # Permit checkout of PR9 and fetch of the audited native-prestress source branch.
  actions: read # Permit retrieval of the immutable successful PR9 L2 baseline artifact.
  issues: write # Permit publication of the numerical verification receipt to the triggering PR conversation.
  pull-requests: write # Permit the workflow token to address the triggering pull request explicitly.
jobs: # Define one isolated CalculiX comparison job.
  verify: # Initialize two prestressed base states and compare their second-order tangent response.
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/run-zhaqing-reference') }} # Ignore every comment except the explicit balanced-reference verification command.
    runs-on: ubuntu-22.04 # Match the Linux family used by the validated PR9 CalculiX baseline.
    timeout-minutes: 35 # Bound package installation and two whole-bridge two-step solves.
    steps: # Execute checkout, audited-source recovery, baseline download, generation, solve, parse, artifact upload, and PR reporting.
      - name: Checkout PR9 experimental branch # Materialize the current perturbation-reference generator without changing the immutable mother model.
        uses: actions/checkout@v4 # Use GitHub's standard checkout action.
        with: # Select the PR9 branch explicitly while keeping this numerical runner read-only.
          ref: agent/zhaqing-freecad-cad003 # Read the current balanced-reference generator from the existing PR9 experimental branch.
          fetch-depth: 1 # Fetch only the branch head needed by this numerical run.
          persist-credentials: false # Prevent the solver job from mutating repository content.
      - name: Recover audited native prestress modules # Export the previously audited mechanics-derived force and balancing-load implementation.
        run: | # Fetch and materialize the isolated native-prestress source family into a temporary import directory.
          set -euxo pipefail # Fail immediately if audited source recovery is incomplete.
          git fetch --depth=1 origin agent/zhaqing-native-solve-only # Fetch the isolated branch containing the native initial-stress implementation.
          mkdir -p /tmp/zhaqing_native # Create a temporary import root outside the checked-out PR9 branch.
          git archive FETCH_HEAD automation/zhaqing_prestress | tar -x -C /tmp/zhaqing_native # Export the complete audited module family with relative paths preserved.
      - name: Install CalculiX # Install the same Ubuntu package family used by the successful PR9 static calculation.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends calculix-ccx # Install ccx plus its packaged sparse-solver dependencies.
      - name: Download validated PR9 baseline # Recover the exact successful LC01_G_DEAD mother model rather than regenerate bridge topology.
        env: # Limit GitHub token exposure to same-repository artifact retrieval.
          GH_TOKEN: ${{ github.token }} # Authenticate GitHub CLI for the immutable baseline artifact.
        run: mkdir -p baseline && gh run download 30068283053 --repo "$GITHUB_REPOSITORY" --name "verified-zhaqing-s4-static-shell-9531999012bd4a94bd937e59f74443c12bcb4b23" --dir baseline # Download the archived validated L2 bridge package.
      - name: Generate balanced prestress-reference models # Build half- and design-prestress equal-area T3D2 cable systems with exact free-DOF balancing loads and identical perturbation load.
        run: BASE="$(find baseline -type f -name 'LC01_G_DEAD.inp' -print -quit)" && test -s "$BASE" && python3 automation/zhaqing_calculix/prestress_reference_perturbation.py "$BASE" /tmp/zhaqing_native/automation/zhaqing_prestress build/reference # Generate both two-step comparison decks from the immutable mother model.
      - name: Solve both prestressed reference states # Run the linear prestress-reference initialization followed by second-order perturbation static response for each scale.
        run: | # Execute both CalculiX models while preserving native process status files for deterministic parsing.
          set +e # Capture each raw solver status without terminating before evidence can be parsed.
          cd build/reference # Enter the isolated numerical comparison directory.
          ccx -i ZQ_REF_LOW > ZQ_REF_LOW.stdout.log 2>&1 # Solve the half-prestress balanced reference and its one-kilonewton perturbation.
          echo $? > ZQ_REF_LOW.exit # Preserve the exact half-prestress CalculiX process status.
          ccx -i ZQ_REF_DESIGN > ZQ_REF_DESIGN.stdout.log 2>&1 # Solve the design-prestress balanced reference and identical perturbation.
          echo $? > ZQ_REF_DESIGN.exit # Preserve the exact design-prestress CalculiX process status.
          exit 0 # Continue to result parsing regardless of either raw solver outcome.
      - name: Parse numerical verification # Extract reference drift, perturbation response, solver status, and effective prestress stiffness change.
        env: # Pass immutable run metadata into the machine-readable result receipt.
          RUN_ID: ${{ github.run_id }} # Record the exact Actions run identifier for artifact retrieval.
          PR_NUMBER: ${{ github.event.issue.number }} # Record the triggering pull-request number in the result payload.
        run: | # Parse both DAT/log/exit sets and prepare the PR comment body.
          python3 - <<'PY' # Start the documented result parser.
          from pathlib import Path  # Resolve comparison evidence paths deterministically.
          import json  # Serialize the numerical verification receipt and PR comment payload.
          import os  # Read immutable run and pull-request metadata supplied through the environment.
          import re  # Parse standard CalculiX nodal displacement tables.
          root = Path('build/reference')  # Resolve the isolated half/design prestress comparison directory.
          def parse_case(stem):  # Parse one two-step model into solver status plus reference and perturbation node-291 responses.
              exit_code = int((root / f'{stem}.exit').read_text().strip()) if (root / f'{stem}.exit').exists() else 999  # Normalize the native process status to an explicit fallback.
              log = (root / f'{stem}.stdout.log').read_text(errors='ignore') if (root / f'{stem}.stdout.log').exists() else ''  # Load the complete solver trace for fatal-error screening.
              dat = root / f'{stem}.dat'  # Locate the requested text results containing outputs from both analysis steps.
              values = []  # Accumulate every node-291 vertical displacement in chronological order.
              if dat.exists():  # Parse response tables only when CalculiX generated the DAT file.
                  active = False  # Track whether current lines belong to a displacement table.
                  for line in dat.read_text(errors='ignore').splitlines():  # Scan all printed states chronologically.
                      if 'displacements (vx,vy,vz)' in line.lower():  # Detect the standard CalculiX displacement-table heading.
                          active = True  # Enable numeric row parsing after the heading.
                          continue  # Advance directly to the first possible displacement row.
                      if active and line.strip().lower().startswith('forces ('):  # Detect the following reaction-force table as the displacement-table terminator.
                          active = False  # Stop interpreting subsequent numeric rows as displacements.
                      if active:  # Parse only rows inside an active displacement table.
                          match = re.match(r'\s*(\d+)\s+([-+0-9.Ee]+)\s+([-+0-9.Ee]+)\s+([-+0-9.Ee]+)\s*$', line)  # Match one node identifier and three global displacement components.
                          if match and int(match.group(1)) == 291:  # Select the validated bridge-deck centerline midspan node.
                              values.append(float(match.group(4)))  # Preserve its vertical displacement for this printed state.
              clean = exit_code == 0 and '*ERROR' not in log.upper() and len(values) >= 2  # Require native process success, no fatal CalculiX diagnostic, and observable results from both analysis steps.
              return {'solverExitCode': exit_code, 'clean': clean, 'printedMidspanU3Mm': values, 'referenceU3Mm': values[0] if values else None, 'perturbationU3Mm': values[-1] if len(values) >= 2 else None, 'logTail': log.splitlines()[-25:]}  # Preserve scalar response evidence plus a compact diagnostic tail when a job fails.
          low = parse_case('ZQ_REF_LOW')  # Parse the half-prestress reference state and its perturbation response.
          design = parse_case('ZQ_REF_DESIGN')  # Parse the force-found design-prestress reference state and its perturbation response.
          stiffness_ratio = None  # Initialize the design-to-low tangent stiffness ratio until two clean perturbation responses exist.
          if low['clean'] and design['clean'] and abs(low['perturbationU3Mm']) > 1.0e-15 and abs(design['perturbationU3Mm']) > 1.0e-15:  # Compare equal-load responses only from two finite clean solutions.
              stiffness_ratio = abs(low['perturbationU3Mm'] / design['perturbationU3Mm'])  # Convert perturbation displacement change into an effective tangent stiffness ratio.
          reference_equilibrium = low['clean'] and design['clean'] and abs(low['referenceU3Mm']) <= 1.0e-3 and abs(design['referenceU3Mm']) <= 1.0e-3  # Require both balancing-load reference states to remain within one micron of the supplied completed geometry at midspan.
          stress_effect = stiffness_ratio is not None and abs(stiffness_ratio - 1.0) > 1.0e-4  # Require a measurable change in tangent response caused by the different base stress fields.
          physically_ordered = stiffness_ratio is not None and stiffness_ratio > 1.0  # Require the higher prestress state to be stiffer under the identical incremental load.
          result = {'marker': 'ZHAQING_REFERENCE_PERTURBATION_RESULT', 'runId': int(os.environ['RUN_ID']), 'pr': int(os.environ['PR_NUMBER']), 'status': 'PASS' if reference_equilibrium and stress_effect and physically_ordered else 'FAIL', 'lowPrestress': low, 'designPrestress': design, 'effectiveDesignToLowStiffnessRatio': stiffness_ratio, 'referenceEquilibriumWithin0p001mm': reference_equilibrium, 'stressStiffnessEffectDetected': stress_effect, 'higherPrestressIsStiffer': physically_ordered, 'analysisPath': 'linear balanced prestress reference then STEP PERTURBATION + STATIC', 'designScale': 1.0214524479201714, 'designMainCableHorizontalForceTargetN': 716150.2048515677, 'testNode': 291, 'testLoadN': -1000.0}  # Assemble the complete qualification payload.
          (root / 'verification_summary.json').write_text(json.dumps(result, indent=2))  # Persist the machine-readable receipt beside raw CalculiX evidence.
          body = 'ZHAQING_REFERENCE_PERTURBATION_RESULT\n```json\n' + json.dumps(result, indent=2) + '\n```\n'  # Format an unambiguous marker plus JSON payload for connector retrieval from the PR conversation.
          (root / 'result_comment.md').write_text(body)  # Persist the exact PR comment body before publication.
          print(json.dumps(result, indent=2))  # Mirror the complete result into the Actions log for redundant auditability.
          PY # End the documented result parser.
      - name: Upload full verification evidence # Preserve both generated INPs plus DAT/FRD/STA/log output and the parsed receipt.
        if: always() # Upload all available files after numerical success or failure.
        uses: actions/upload-artifact@v4 # Store the complete two-case directory as a downloadable immutable Actions artifact.
        with: # Configure deterministic artifact identity and retention.
          name: zhaqing-reference-perturbation-${{ github.run_id }} # Bind the evidence package to the run identifier published in the result comment.
          path: build/reference # Upload both model decks and every emitted numerical result file.
          if-no-files-found: error # Treat absence of generated numerical evidence as an infrastructure failure.
          retention-days: 30 # Retain the package for AFEM mother-model handoff and independent review.
          compression-level: 6 # Apply standard compression to mixed ASCII and FRD output.
      - name: Report verification to pull request # Publish the exact run identifier and numerical comparison where the connector can retrieve it synchronously.
        if: always() # Report both success and failure so the solver outcome cannot disappear behind CI infrastructure.
        env: # Expose the workflow token only to the GitHub CLI comment operation.
          GH_TOKEN: ${{ github.token }} # Authenticate the same-repository PR comment write.
        run: test -s build/reference/result_comment.md && gh pr comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file build/reference/result_comment.md # Return the exact numerical receipt to the triggering PR conversation.
