name: Zhaqing P0-P4 condensed stress coordination and VTK # Execute the PR9 repair plan with the validated P1/P2 core and condensed P3 retained-structure response.
on: # Register deterministic execution routes for this isolated PR9 qualification workflow.
  push: # Re-run automatically when the condensed adapter or this exact workflow changes.
    branches: # Restrict numerical qualification to the existing suspension-bridge PR head branch.
      - agent/zhaqing-freecad-cad003 # Keep repository main isolated while the engineering release remains blocked by G3-G6 evidence.
    paths: # Trigger only on the condensed P3/P4 adapter or its dedicated workflow.
      - '.github/workflows/zhaqing-stress-coordination-condensed.yml' # Re-run when orchestration or final Gate logic changes.
      - 'automation/zhaqing_calculix/stress_coordination_condensed_adapter.part*' # Re-run when the exact P3/P4 condensation and stress-composition adapter changes.
  workflow_dispatch: # Permit an explicit independent rerun without modifying model source.
permissions: # Grant only the read access needed for source checkout and immutable baseline retrieval.
  contents: read # Read the exact PR implementation and source evidence without repository mutation.
  actions: read # Download the fixed successful L2 baseline artifact by immutable run and artifact identities.
jobs: # Define one fail-closed P0-P4 qualification job.
  coordinate-stress: # Reconstruct audited sources, recover baseline, execute P1-P4, archive evidence, and enforce VTK Gate.
    runs-on: ubuntu-22.04 # Match the operating-system family used by the successful verified CalculiX L2 baseline.
    timeout-minutes: 45 # Bound package installation, deterministic form finding, one retained-structure solve, and evidence upload.
    env: # Freeze immutable source and output identities for provenance.
      BASELINE_RUN_ID: '30068283053' # Use the already verified PR9 L2 static-shell run as the frozen mother model.
      BASELINE_ARTIFACT: 'verified-zhaqing-s4-static-shell-9531999012bd4a94bd937e59f74443c12bcb4b23' # Select the exact successful L2 artifact by immutable name.
      OUT: 'build/zhaqing-stress-coordination-condensed' # Keep every generated equilibrium, solver, Gate, and VTK artifact under one isolated root.
    steps: # Execute exact checkout, P0 compile, solver installation, baseline recovery, P1-P4 calculation, upload, and final Gate.
      - name: Checkout exact PR9 implementation # Materialize the precise branch revision under numerical qualification.
        uses: actions/checkout@v4 # Use GitHub's standard deterministic checkout action.
        with: # Configure a minimal immutable source checkout.
          fetch-depth: 1 # Fetch only the exact tested PR revision.
          persist-credentials: false # Prevent calculation code from mutating repository content during execution.
      - name: Reconstruct and compile audited sources # Rebuild the unchanged base pipeline and condensed adapter from repository fragments before any solver work.
        run: | # Compile both reconstructed Python programs and preserve their exact bytes under provenance.
          set -euxo pipefail # Fail immediately on source reconstruction, syntax, or import-preflight errors.
          mkdir -p "$OUT/provenance" "$OUT/logs" # Create deterministic provenance and log directories before calculation.
          cat automation/zhaqing_calculix/stress_coordination_pipeline.part* > "$OUT/provenance/stress_coordination_pipeline.py" # Reconstruct the already exercised P0-P2 base pipeline from ordered auditable fragments.
          cat automation/zhaqing_calculix/stress_coordination_condensed_adapter.part* > "$OUT/provenance/stress_coordination_condensed_adapter.py" # Reconstruct the third-round P3/P4 condensed-substructure adapter from ordered fragments.
          python3 -m py_compile "$OUT/provenance/stress_coordination_pipeline.py" "$OUT/provenance/stress_coordination_condensed_adapter.py" # Reject any syntax regression before retrieving or solving the engineering model.
          python3 "$OUT/provenance/stress_coordination_condensed_adapter.py" --help > "$OUT/logs/p0-condensed-adapter-help.txt" # Execute the harmless command-line import path to verify the adapter entry point.
          git rev-parse HEAD > "$OUT/provenance/source-commit.txt" # Bind every generated artifact to the exact tested PR commit.
          sha256sum "$OUT/provenance/stress_coordination_pipeline.py" "$OUT/provenance/stress_coordination_condensed_adapter.py" > "$OUT/provenance/calculation-source.sha256" # Freeze both exact calculation-source byte streams for independent audit.
      - name: Install pinned CalculiX family # Install the same Ubuntu CalculiX package family used by the verified L2 baseline.
        run: | # Install ccx and preserve its package identity before calculation.
          set -euxo pipefail # Stop immediately if the pinned solver family cannot be installed.
          sudo apt-get update # Refresh Ubuntu package metadata on the hosted runner.
          sudo apt-get install -y --no-install-recommends software-properties-common # Install repository management required by the Ubuntu runner image.
          sudo add-apt-repository -y universe # Enable the Ubuntu universe repository containing CalculiX.
          sudo apt-get update # Refresh package metadata after enabling universe.
          sudo apt-get install -y --no-install-recommends calculix-ccx # Install CalculiX and its sparse-solver runtime dependencies.
          command -v ccx > "$OUT/provenance/ccx-path.txt" # Record the exact solver executable resolved by the runner.
          dpkg-query -W calculix-ccx > "$OUT/provenance/calculix-package.txt" # Record the installed CalculiX package version for reproducibility.
      - name: Recover immutable verified L2 baseline # Download and hash the exact successful mother-model artifact used by all three repair rounds.
        env: # Scope the GitHub token solely to same-repository artifact retrieval.
          GH_TOKEN: ${{ github.token }} # Authenticate GitHub CLI to read the immutable verified baseline artifact.
        run: | # Download the exact run artifact and expose only the verified LC01 input to later steps.
          set -euxo pipefail # Fail closed when the expected run, artifact, or baseline input is unavailable.
          mkdir -p baseline # Create an isolated immutable baseline extraction root.
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASELINE_ARTIFACT" --dir baseline # Download only the fixed successful L2 artifact named above.
          BASE="$(find baseline -type f -name 'LC01_G_DEAD.inp' -print -quit)" # Locate the verified dead-load mother deck inside the artifact.
          test -s "$BASE" # Require a nonempty verified baseline input before form finding or model transformation.
          printf 'BASE=%s\n' "$BASE" >> "$GITHUB_ENV" # Publish the deterministic baseline path to the calculation step.
          sha256sum "$BASE" > "$OUT/provenance/baseline-input.sha256" # Freeze the exact L2 mother-deck bytes used by the condensed P3/P4 qualification.
          python3 automation/zhaqing_prestress/balanced_transfer_prestress.py "$BASE" | tee "$OUT/logs/p0-balanced-transfer-smoke.txt" # Re-exercise the corrected P0 real-baseline CLOAD parser before P1 form finding.
      - name: Execute unchanged P1-P2 and condensed P3-P4 # Produce the unique equilibrium state, retained detailed response, final stress composition, and mandatory VTK cloud.
        run: | # Preserve the complete calculation log while allowing diagnostics to upload after a physical Gate failure.
          set +e # Capture the adapter's fail-closed P4 status instead of terminating before evidence upload.
          python3 "$OUT/provenance/stress_coordination_condensed_adapter.py" --module "$OUT/provenance/stress_coordination_pipeline.py" --base "$BASE" --output "$OUT/calculation" --ccx "$(command -v ccx)" 2>&1 | tee "$OUT/logs/p1-p4-condensed-pipeline.log" # Execute the strict 5277838372 two-model workflow from frozen L2 input through final VTK.
          status=${PIPESTATUS[0]} # Preserve the native P4 Gate exit status independently of tee.
          set -e # Restore fail-fast shell behavior after calculation completes.
          printf '%s\n' "$status" > "$OUT/provenance/pipeline-exit-code.txt" # Record the physical/numerical Gate process status for audit.
          exit 0 # Continue to immutable evidence upload regardless of PASS or FAIL so diagnostics are never lost.
      - name: Upload complete condensed coordination evidence # Preserve source hashes, equilibrium state, solver input/results, logs, summary, and VTK before enforcing final status.
        if: always() # Archive complete evidence after both numerical success and failure.
        uses: actions/upload-artifact@v4 # Store the complete P0-P4 qualification package as immutable Actions evidence.
        with: # Configure deterministic artifact identity and bounded retention.
          name: zhaqing-stress-coordinated-condensed-vtk-${{ github.sha }} # Bind the numerical package to the exact PR implementation commit.
          path: build/zhaqing-stress-coordination-condensed # Upload every provenance, solver, Gate, and visualization file.
          if-no-files-found: error # Treat missing calculation evidence as workflow infrastructure failure.
          retention-days: 30 # Retain the package for independent engineering review and comparison.
          compression-level: 6 # Apply standard compression to mixed text, DAT, FRD, and VTK evidence.
      - name: Enforce P4 numerical and VTK Gate # Make workflow success follow the machine-readable coordination result and mandatory VTK artifact.
        if: always() # Evaluate final evidence even when the calculation reports a controlled Gate failure.
        run: | # Require the unique state contract, summary PASS, nonempty VTK, and explicit engineering-release boundary.
          set -euxo pipefail # Fail immediately when any mandatory final evidence is missing or rejected.
          test -s "$OUT/calculation/equilibrium_state.json" # Require the unique P2-to-P3 equilibrium-state contract.
          test -s "$OUT/calculation/summary.json" # Require the decisive machine-readable P4 Gate receipt.
          test -s "$OUT/calculation/stress-coordinated.vtk" # Require the exact final stress-cloud VTK filename requested by the task.
          test "$(stat -c%s "$OUT/calculation/stress-coordinated.vtk")" -gt 100000 # Reject placeholder VTK files that cannot contain the complete bridge grid and stress fields.
          python3 - "$OUT/calculation/equilibrium_state.json" "$OUT/calculation/summary.json" <<'PY' # Independently verify final semantic PASS conditions from persisted machine-readable evidence.
          import json  # Parse the unique equilibrium-state and final Gate receipts.
          import sys  # Receive deterministic evidence paths supplied by the workflow shell.
          from pathlib import Path  # Resolve persisted evidence files explicitly.
          equilibrium = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))  # Load the unchanged P1/P2 equilibrium-state contract.
          summary = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))  # Load the condensed P3/P4 machine-readable result.
          assert equilibrium["status"] == "PASS", equilibrium.get("gates")  # Require the isolated axial form-finding core to pass before accepting any detailed response.
          assert summary["status"] == "PASS", summary.get("gates")  # Require every mandatory numerical coordination Gate to pass simultaneously.
          assert summary["engineeringReleaseStatus"] == "BLOCKED", summary.get("engineeringReleaseStatus")  # Preserve the explicit boundary that unresolved G3-G6 evidence still blocks formal engineering release.
          assert summary["vtk"]["pointCount"] > 0 and summary["vtk"]["cellCount"] > 0, summary.get("vtk")  # Require a populated complete-bridge VTK finite-element grid and stress field.
          print(json.dumps({"status": summary["status"], "engineeringReleaseStatus": summary["engineeringReleaseStatus"], "vtkSha256": summary["vtkSha256"], "minimumSuspensionStressMPa": summary["minimumSuspensionAxialStressMPa"], "maximumDisplacementMm": summary["maximumDisplacementMm"], "forceBalanceRelative": summary["verticalReactionBalanceRelative"]}, indent=2)) # Mirror decisive P4 scalars into the final workflow log.
          PY
