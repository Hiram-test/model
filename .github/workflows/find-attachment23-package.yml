name: Find attachment 2-3 package
on:
  push:
    branches:
      - audit/release-inventory-20260803
    paths:
      - .github/workflows/find-attachment23-package.yml
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/release-inventory-20260803
      - name: Download package index and locate PDF
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/Hiram-test/model/releases/download/zhangjinggao-full-20260729/package-members.csv' -o package-members.csv
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          source = Path('package-members.csv')
          text = source.read_bytes().decode('utf-8-sig', errors='replace')
          rows = list(csv.DictReader(text.splitlines()))
          target_name = '附件2-3：猫道结构抗风性能试验报告.pdf'
          target_hash = 'd17d4061c5726c10b88cc80f3f292b16f0dbf3408e032a30840b1bcaad9173d3'
          matches = []
          for row in rows:
              joined = ' | '.join(str(value or '') for value in row.values())
              if target_name in joined or target_hash.lower() in joined.lower():
                  matches.append(row)
          result = {'headers': list(rows[0].keys()) if rows else [], 'matches': matches}
          Path('attachment23-package-matches.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          rm -f package-members.csv
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add attachment23-package-matches.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Locate attachment 2-3 archive package'
          git push origin HEAD:audit/release-inventory-20260803
