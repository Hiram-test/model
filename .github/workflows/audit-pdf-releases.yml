name: Audit PDF releases
on:
  push:
    branches:
      - audit/release-inventory-20260803
    paths:
      - .github/workflows/audit-pdf-releases.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/release-inventory-20260803
      - name: Query PDF release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page=1
          printf '[]' > all-releases.json
          while true; do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}" \
              > page.json
            count="$(jq 'length' page.json)"
            jq -s '.[0] + .[1]' all-releases.json page.json > merged.json
            mv merged.json all-releases.json
            if [ "${count}" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          jq '[.[] | {release_name: .name, tag_name: .tag_name, html_url: .html_url, published_at: .published_at, assets: [.assets[] | select((.name | ascii_downcase | endswith(".pdf")) or (.content_type == "application/pdf")) | {name: .name, size: .size, download_count: .download_count, browser_download_url: .browser_download_url}]} | select((.assets | length) > 0)]' all-releases.json > pdf-release-inventory.json
          rm -f all-releases.json page.json
      - name: Commit audit result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pdf-release-inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Audit PDF release assets'
          git push origin HEAD:audit/release-inventory-20260803
