      - name: Checkout immutable Track A analysis branch # Fetch the exact triggering snapshot.
        uses: actions/checkout@v4 # Use the maintained checkout action.
        with: # Make checkout behavior explicit.
          ref: ${{ github.sha }} # Bind the recovery to the immutable triggering commit.
          fetch-depth: 1 # Fetch only the required snapshot.
          persist-credentials: false # Keep repository contents read-only.
      - name: Reconstruct exact released C3 parent # Restore and verify the full parent deck.
        shell: bash # Execute deterministic Bash commands.
        run: | # Run one strict reconstruction script.
          set -euxo pipefail # Stop on command, variable, or pipeline errors.
          mkdir -p work/results work/artifacts # Create isolated working and evidence directories.
          cat "$C3_PARTS"/*.inp.gz.part* | gzip -dc > work/C3_parent.inp # Reconstruct the exact released full C3 input.
          printf '%s  %s\n' "$C3_SHA" work/C3_parent.inp | sha256sum -c - # Reject any parent identity drift.
      - name: Recover exact C3 nonlinear static mother from Actions history # Search prior full-size decks by structural hashes and static-step content.
        shell: bash # Execute the fully commented Python recovery program.
        env: # Provide the ephemeral read-only Actions token.
          GH_TOKEN: ${{ github.token }} # Authorize historical artifact reads.
          GH_REPOSITORY: ${{ github.repository }} # Bind the current owner/name repository identity.
        run: | # Emit and execute the deterministic recovery program.
          cat > work/recover_static_mother.py <<'PY' # Write the complete recovery source file.
          from __future__ import annotations  # Keep annotations deterministic on the runner Python version.
          from pathlib import Path  # Resolve downloaded archives and candidate files deterministically.
          import hashlib  # Build exact structural signatures for model-definition families.
          import io  # Hold downloaded ZIP archives before extraction.
          import json  # Parse GitHub metadata and publish the complete recovery audit.
          import os  # Read the ephemeral token and repository identity.
          import re  # Parse CalculiX keyword attributes and equation bodies.
          import shutil  # Preserve the selected static mother without rewriting its bytes.
          import tarfile  # Inspect nested tar archives when present in historical artifacts.
          import urllib.error  # Preserve bounded download failures as audit records.
          import urllib.request  # Call the GitHub REST API with read-only credentials.
          import zipfile  # Inspect Actions artifact ZIP archives and nested ZIP files.
          ROOT = Path('work')  # Bind the isolated workflow working directory.
          PARENT = ROOT / 'C3_parent.inp'  # Bind the exact released C3 modal parent.
          ARTIFACT_ROOT = ROOT / 'artifacts'  # Bind the historical artifact extraction root.
          RESULTS = ROOT / 'results'  # Bind the stable recovery evidence directory.
          TOKEN = os.environ['GH_TOKEN']  # Read the ephemeral workflow token.
          REPOSITORY = os.environ['GH_REPOSITORY']  # Read the owner/name repository identity.
          RUN_HINTS = ('c3', 'static', 'nlgeom', 'gravity', 'prestress', 'formfind', 'height', 'track', 'ucab3', 'ucor6')  # Define broad run-name hints without using frequencies.
          ARTIFACT_HINTS = ('c3', 'static', 'nlgeom', 'gravity', 'prestress', 'formfind', 'height', 'track', 'full', 'model', 'deck')  # Define broad artifact-name hints without using frequencies.
          def request_json(url: str) -> dict[str, object]:  # Fetch one GitHub REST JSON document.
              request = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})  # Build one authenticated read-only request.
              with urllib.request.urlopen(request, timeout=120) as response:  # Execute the bounded request.
                  return json.load(response)  # Decode and return the JSON response.
          def request_bytes(url: str) -> bytes:  # Download one historical Actions artifact archive.
              request = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})  # Build one authenticated archive request.
              with urllib.request.urlopen(request, timeout=600) as response:  # Follow redirects and download bounded bytes.
                  return response.read()  # Return the complete ZIP archive.
          def digest_rows(rows: list[str]) -> str:  # Hash one normalized ordered record family.
