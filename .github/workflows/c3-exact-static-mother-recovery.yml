          report = {'status': 'FOUND' if selection is not None else 'NOT_FOUND', 'selection_found': selection is not None, 'selection': selection, 'eligible_count': len(eligible), 'candidate_deck_count': len(audits), 'artifact_count_considered': len(artifact_records), 'workflow_run_count_considered': len(runs), 'parent_signature': parent, 'target_frequency_used': False, 'download_errors': download_errors, 'audits': audits}  # Build the complete structural recovery audit.
