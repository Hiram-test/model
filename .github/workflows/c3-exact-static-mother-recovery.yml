      - name: Upload exact nonlinear C3 static-mother recovery # Publish the full mother deck and structural audit.
        if: always() # Preserve both positive and negative recovery evidence.
        uses: actions/upload-artifact@v4 # Store the recovery package as an Actions artifact.
        with: # Configure a stable artifact name and bounded retention.
