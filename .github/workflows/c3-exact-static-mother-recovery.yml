# Recover an exact nonlinear C3 static mother by structural identity rather than by frequency or filename.
name: Recover exact nonlinear C3 static mother # Give the recovery workflow an explicit name.
on: # Define the deterministic trigger.
  push: # Run when this workflow definition is committed.
    branches: [agent/c3-tracka-direct-main13-20260831] # Restrict execution to the isolated Track A branch.
    paths: [".github/workflows/c3-exact-static-mother-recovery.yml"] # Avoid unrelated branch pushes.
permissions: # Declare the exact token permissions required by the recovery task.
  contents: read # Permit checkout of the immutable C3 parent fragments.
  actions: read # Permit read-only enumeration and download of prior Actions artifacts.
jobs: # Define the single recovery job.
  recover: # Enumerate prior evidence, verify structural identity, and retain the exact static mother.
    runs-on: ubuntu-24.04 # Use a current runner with standard Python and archive tools.
    timeout-minutes: 90 # Bound historical artifact enumeration and download.
    env: # Freeze the exact released C3 parent identity and source location.
      C3_PARTS: catwalk-fem/c0-c5-reproduction/release_parts/c3_ft14 # Locate the exact released C3 input fragments.
      C3_SHA: 667c504770b99d4a3c484a114e16bb7c048c883d3a004f3e10dd71536f33dc86 # Lock the exact C3 parent bytes.
