                  for raw in lines:  # Traverse every input record.
                      line = raw.strip()  # Normalize surrounding whitespace.
                      upper = line.upper()  # Normalize keyword matching.
                      if not line or line.startswith('**'):  # Ignore blank and comment rows.
                          continue  # Continue traversal.
                      if upper.startswith('*'):  # Handle one keyword record.
                          if upper.startswith('*STEP'):  # Detect the first analysis step.
                              before_step = False  # Close the structural-signature region.
                          active_node = before_step and (upper == '*NODE' or upper.startswith('*NODE,'))  # Select model-level node blocks only.
                          active_element = None  # Close any prior element block.
                          active_initial = before_step and upper.startswith('*INITIAL CONDITIONS')  # Select model-level initial-condition blocks.
                          if before_step and upper.startswith('*ELEMENT,'):  # Parse one model-level element header.
                              active_element = attributes(line).get('TYPE', '')  # Select the normalized element type.
                          if before_step and upper == '*EQUATION':  # Parse one model-level equation block.
                              declared_line = next(lines, '').strip()  # Read the declared sparse arity.
                              if not declared_line:  # Reject a truncated equation declaration.
                                  raise ValueError(f'Truncated EQUATION declaration in {path}')  # Surface the malformed candidate.
                              declared = int(declared_line.split(',')[0])  # Parse the declared term count.
                              fields: list[str] = []  # Accumulate continuation fields.
                              while len(fields) < 3 * declared:  # Consume the complete sparse equation body.
                                  body = next(lines, '').strip()  # Read one continuation row.
                                  if not body or body.startswith('*'):  # Reject a truncated or interrupted equation body.
                                      raise ValueError(f'Truncated EQUATION body in {path}')  # Surface the malformed candidate.
                                  fields.extend(field.strip() for field in body.split(',') if field.strip())  # Append nonempty sparse fields.
                              normalized_terms = []  # Accumulate normalized sparse terms.
                              for position in range(declared):  # Traverse each declared sparse term.
                                  node = int(fields[3 * position])  # Parse the node label.
                                  dof = int(fields[3 * position + 1])  # Parse the degree of freedom.
                                  coefficient = float(fields[3 * position + 2].replace('D', 'E').replace('d', 'e'))  # Parse the coefficient.
                                  normalized_terms.append((node, dof, round(coefficient, 12)))  # Preserve the normalized sparse term.
                              equation_rows.append(repr(tuple(sorted(normalized_terms))))  # Preserve an order-independent equation signature.
                              equation_count += 1  # Count one model-level equation.
                              active_node = False  # Close node state after direct equation consumption.
                              active_element = None  # Close element state after direct equation consumption.
                              active_initial = False  # Close initial-condition state after direct equation consumption.
                              continue  # Continue traversal after the equation block.
                          if not before_step and any(upper.startswith(prefix) for prefix in ('*STEP', '*STATIC', '*FREQUENCY', '*DLOAD', '*CLOAD', '*BOUNDARY', '*END STEP')):  # Select analysis-step and load keywords.
                              keyword_rows.append(upper)  # Preserve the normalized keyword.
                          continue  # Complete keyword handling.
                      if not before_step:  # Ignore step data for structural signatures.
                          continue  # Continue traversal.
                      if active_node:  # Parse one model-level node row.
                          fields = [field.strip() for field in line.split(',')]  # Split node label and coordinates.
                          if len(fields) >= 4:  # Require three coordinate values.
                              node_rows.append(f'{int(fields[0])},{float(fields[1]):.12g},{float(fields[2]):.12g},{float(fields[3]):.12g}')  # Normalize the coordinate row.
                              node_count += 1  # Count one node.
                      elif active_element is not None:  # Parse one model-level element row.
                          values = [int(field.strip()) for field in line.split(',') if field.strip()]  # Parse element and connectivity labels.
                          if values:  # Require one element label.
                              element_rows.append(f"{active_element}:{','.join(str(value) for value in values)}")  # Normalize type and connectivity.
                              element_counts[active_element] = element_counts.get(active_element, 0) + 1  # Increment the exact element-type count.
                      elif active_initial:  # Parse one model-level initial-condition row.
                          initial_rows.append(','.join(field.strip() for field in line.split(',')))  # Preserve normalized initial-condition data.
                          initial_count += 1  # Count one initial-condition row.
              has_nlgeom = any(keyword.startswith('*STEP') and 'NLGEOM' in keyword for keyword in keyword_rows)  # Detect geometrically nonlinear analysis.
              has_static = any(keyword.startswith('*STATIC') for keyword in keyword_rows)  # Detect a static equilibrium procedure.
              has_frequency = any(keyword.startswith('*FREQUENCY') for keyword in keyword_rows)  # Detect modal extraction.
              has_dload = any(keyword.startswith('*DLOAD') for keyword in keyword_rows)  # Detect distributed or gravity loading.
              has_perturbation = any(keyword.startswith('*STEP') and 'PERTURBATION' in keyword for keyword in keyword_rows)  # Detect perturbation extraction.
              return {'path': str(path), 'bytes': path.stat().st_size, 'node_count': node_count, 'node_hash': digest_rows(node_rows), 'element_count': len(element_rows), 'element_hash': digest_rows(element_rows), 'element_counts': element_counts, 'equation_count': equation_count, 'equation_hash': digest_rows(sorted(equation_rows)), 'initial_count': initial_count, 'initial_hash': digest_rows(initial_rows), 'has_nlgeom': has_nlgeom, 'has_static': has_static, 'has_frequency': has_frequency, 'has_dload': has_dload, 'has_perturbation': has_perturbation, 'keyword_rows': keyword_rows}  # Return the complete candidate signature.
          def extract_nested_archives(directory: Path) -> None:  # Expand bounded nested archives commonly stored inside Actions artifacts.
              for archive in list(directory.rglob('*')):  # Traverse the initially extracted artifact files.
                  if not archive.is_file():  # Ignore directories.
                      continue  # Continue traversal.
                  lower = archive.name.lower()  # Normalize the archive filename.
                  destination = archive.parent / f'{archive.name}.extracted'  # Resolve a stable nested extraction directory.
                  try:  # Isolate archive-specific extraction failures.
                      if lower.endswith('.zip') and archive.stat().st_size <= 800_000_000:  # Admit bounded nested ZIP archives.
                          destination.mkdir(parents=True, exist_ok=True)  # Create the nested extraction directory.
                          with zipfile.ZipFile(archive) as handle:  # Open the nested ZIP archive.
                              handle.extractall(destination)  # Extract every nested file.
                      elif (lower.endswith('.tar.gz') or lower.endswith('.tgz')) and archive.stat().st_size <= 800_000_000:  # Admit bounded nested gzip-compressed tar archives.
                          destination.mkdir(parents=True, exist_ok=True)  # Create the nested extraction directory.
                          with tarfile.open(archive, 'r:gz') as handle:  # Open the nested tar archive.
                              handle.extractall(destination)  # Extract every nested file.
                  except (zipfile.BadZipFile, tarfile.TarError, OSError):  # Ignore malformed or unsupported nested archives.
                      continue  # Continue to the next file.
          parent = model_signature(PARENT)  # Parse the exact released C3 parent once.
          runs: list[dict[str, object]] = []  # Accumulate recent workflow-run metadata.
          for page in range(1, 13):  # Read at most twelve hundred recent workflow runs.
              payload = request_json(f'https://api.github.com/repos/{REPOSITORY}/actions/runs?per_page=100&page={page}')  # Fetch one workflow-run page.
              page_runs = payload.get('workflow_runs', [])  # Select the run list.
              if not isinstance(page_runs, list) or not page_runs:  # Stop at the first empty page.
                  break  # Exit pagination.
              runs.extend(page_runs)  # Append the current page.
          artifact_records: list[dict[str, object]] = []  # Accumulate candidate artifact metadata with parent-run context.
          for run in runs:  # Traverse recent workflow runs.
              run_text = ' '.join((str(run.get('name', '')), str(run.get('display_title', '')), str(run.get('head_branch', '')))).lower()  # Form the normalized run descriptor.
              run_hint = any(hint in run_text for hint in RUN_HINTS)  # Detect broad C3/static relevance.
              if not run_hint:  # Skip clearly unrelated workflow runs before artifact enumeration.
                  continue  # Continue to the next run.
              run_id = int(run['id'])  # Select the numeric workflow-run identity.
              artifacts_payload = request_json(f'https://api.github.com/repos/{REPOSITORY}/actions/runs/{run_id}/artifacts?per_page=100')  # Fetch run artifacts.
              artifacts = artifacts_payload.get('artifacts', [])  # Select the artifact list.
              if not isinstance(artifacts, list):  # Ignore malformed metadata.
                  continue  # Continue to the next run.
              for artifact in artifacts:  # Traverse every run artifact.
                  if bool(artifact.get('expired', False)):  # Skip expired artifacts.
                      continue  # Continue to the next artifact.
                  size = int(artifact.get('size_in_bytes', 0))  # Select compressed artifact size.
                  if size <= 0 or size > 900_000_000:  # Bound individual downloads.
                      continue  # Continue to the next artifact.
                  artifact_name = str(artifact.get('name', '')).lower()  # Normalize the artifact name.
                  if not run_hint and not any(hint in artifact_name for hint in ARTIFACT_HINTS):  # Preserve only broadly relevant packages.
                      continue  # Continue to the next artifact.
                  artifact_records.append({'artifact': artifact, 'run': run})  # Preserve artifact and run context.
          audits: list[dict[str, object]] = []  # Accumulate complete candidate-deck audits.
          download_errors: list[dict[str, object]] = []  # Accumulate bounded artifact download failures.
          for position, record in enumerate(artifact_records[:360]):  # Bound recovery to the first 360 relevant artifacts.
              artifact = record['artifact']  # Select artifact metadata.
              artifact_id = int(artifact['id'])  # Select the numeric artifact identity.
              try:  # Preserve artifact-specific network failures without aborting the complete search.
                  archive = request_bytes(f'https://api.github.com/repos/{REPOSITORY}/actions/artifacts/{artifact_id}/zip')  # Download the artifact ZIP archive.
              except Exception as error:  # Catch bounded HTTP and network failures.
                  download_errors.append({'artifact_id': artifact_id, 'error': f'{type(error).__name__}: {error}'})  # Preserve the failed download record.
                  continue  # Continue to the next artifact.
              directory = ARTIFACT_ROOT / f'{position:03d}_{artifact_id}'  # Resolve a stable extraction directory.
              directory.mkdir(parents=True, exist_ok=True)  # Create the extraction directory.
              try:  # Extract only valid artifact ZIP archives.
                  with zipfile.ZipFile(io.BytesIO(archive)) as handle:  # Open the in-memory artifact archive.
                      handle.extractall(directory)  # Extract every evidence file.
              except zipfile.BadZipFile as error:  # Preserve malformed artifact archives.
                  download_errors.append({'artifact_id': artifact_id, 'error': f'BadZipFile: {error}'})  # Record the malformed archive.
                  continue  # Continue to the next artifact.
              extract_nested_archives(directory)  # Expand bounded nested archives inside the artifact.
              for path in directory.rglob('*.inp'):  # Traverse every extracted CalculiX input deck.
                  if not path.is_file():  # Ignore directories.
                      continue  # Continue traversal.
                  if path.stat().st_size < 20_000_000 or path.stat().st_size > 300_000_000:  # Require a full-size but bounded C3-scale deck.
                      continue  # Continue to the next input deck.
                  try:  # Convert malformed candidates into explicit audit records.
                      candidate = model_signature(path)  # Parse the candidate structural and step signature.
                  except Exception as error:  # Catch candidate-specific parser failures.
                      audits.append({'artifact_id': artifact_id, 'path': str(path), 'parse_error': f'{type(error).__name__}: {error}'})  # Preserve the bounded failure record.
                      continue  # Continue to the next input deck.
                  candidate['artifact_id'] = artifact_id  # Record the source artifact identity.
                  candidate['artifact_name'] = artifact.get('name')  # Record the source artifact name.
                  candidate['run_id'] = record['run'].get('id')  # Record the source workflow-run identity.
                  candidate['workflow_name'] = record['run'].get('name')  # Record the source workflow name.
                  candidate['display_title'] = record['run'].get('display_title')  # Record the source workflow title.
                  candidate['head_sha'] = record['run'].get('head_sha')  # Record the source commit identity.
                  candidate['node_match'] = candidate['node_count'] == parent['node_count'] and candidate['node_hash'] == parent['node_hash']  # Compare exact node labels and coordinates.
                  candidate['element_match'] = candidate['element_count'] == parent['element_count'] and candidate['element_hash'] == parent['element_hash']  # Compare exact element types and connectivity.
                  candidate['equation_match'] = candidate['equation_count'] == parent['equation_count'] and candidate['equation_hash'] == parent['equation_hash']  # Compare exact model-level equation multisets.
                  candidate['initial_match'] = candidate['initial_count'] == parent['initial_count'] and candidate['initial_hash'] == parent['initial_hash']  # Compare exact initial-condition rows.
                  candidate['exact_static_mother'] = bool(candidate['node_match'] and candidate['element_match'] and candidate['equation_match'] and candidate['initial_match'] and candidate['has_nlgeom'] and candidate['has_static'] and candidate['has_dload'])  # Identify an exact-physics nonlinear C3 static mother.
                  audits.append(candidate)  # Preserve the complete candidate audit.
          eligible = [candidate for candidate in audits if candidate.get('exact_static_mother')]  # Select exact-physics nonlinear static mothers.
          eligible.sort(key=lambda candidate: (not bool(candidate.get('has_frequency')), -int(candidate.get('bytes', 0)), int(candidate.get('artifact_id', 0)), str(candidate.get('path'))))  # Prefer a static-plus-modal deck and then the most complete immutable file.
          selection = eligible[0] if eligible else None  # Select the strongest exact static mother.
