name: Bootstrap formalized parameter update  # Name the temporary source-materialization workflow.
on:  # Declare the one-time branch trigger.
  push:  # Start after the bootstrap archive reaches GitHub.
    branches:  # Limit execution to the isolated implementation branch.
      - agent/formalized-parameter-update  # Never execute this bootstrap on the default branch.
    paths:  # Run only while temporary bootstrap inputs change.
      - ".bootstrap/formalized-parameter-update/**"  # Watch the split source archive.
      - ".github/workflows/bootstrap-formalized-parameter-update.yml"  # Watch this temporary workflow.
permissions:  # Grant only the permission needed to materialize the verified source.
  contents: write  # Permit the workflow to commit the unpacked prototype to its own branch.
jobs:  # Declare the one-time materialization job.
  materialize:  # Reassemble, verify, and commit the prototype.
    runs-on: ubuntu-24.04  # Use the repository's preferred runner image.
    timeout-minutes: 15  # Prevent the bootstrap from hanging indefinitely.
    steps:  # Execute the controlled materialization sequence.
      - name: Checkout bootstrap branch  # Retrieve the split archive and temporary workflow.
        uses: actions/checkout@v4  # Use the maintained checkout action.
        with:  # Configure checkout for a subsequent branch commit.
          fetch-depth: 0  # Retain branch history for a normal fast-forward commit.
      - name: Reassemble and verify source  # Materialize the exact locally tested source package.
        shell: bash  # Use strict Bash semantics for the bootstrap commands.
        run: |  # Execute a fail-loud source-materialization script.
          set -euxo pipefail  # Stop on every command, variable, or pipeline failure.
          cat .bootstrap/formalized-parameter-update/archive.part* | base64 --decode > /tmp/formalized-parameter-update.tar.xz  # Reassemble and decode the deterministic archive.
          test "$(sha256sum /tmp/formalized-parameter-update.tar.xz | awk '{print $1}')" = "21e9c0deeebe489a5caa35860fc611acd2c46ee4b3a4b2f1b4d49a6bc7c20e3c"  # Verify the archive against the local package digest.
          tar -xJf /tmp/formalized-parameter-update.tar.xz -C .  # Extract the repository-relative source tree.
          python -m pip install --upgrade pip  # Update the package installer before dependency resolution.
          python -m pip install -r research/formalized_parameter_update/requirements.txt  # Install the small deterministic numerical stack.
          python research/formalized_parameter_update/run_demo.py --output research/formalized_parameter_update/results/bootstrap  # Reproduce the accepted update receipt on GitHub infrastructure.
          python -m pytest -q research/formalized_parameter_update/tests  # Run acceptance, rejection, and fail-closed regression tests.
          rm -rf research/formalized_parameter_update/results  # Keep generated runtime evidence out of the source commit.
          rm -rf .bootstrap/formalized-parameter-update  # Remove temporary archive parts after successful verification.
          rm -f .github/workflows/bootstrap-formalized-parameter-update.yml  # Remove this one-time workflow from the final branch.
          git config user.name "github-actions[bot]"  # Attribute the materialization commit to the standard automation identity.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"  # Configure the standard automation email.
          git add --all  # Stage source additions and temporary-file removals together.
          git commit -m "Add formalized measured-error parameter updating prototype"  # Create one auditable source commit.
          git push origin HEAD:agent/formalized-parameter-update  # Fast-forward the isolated implementation branch.
