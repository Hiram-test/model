name: Zhaqing L2 completed-state prestress solve
on:
  push:
    branches:
      - agent/zhaqing-freecad-cad003
    paths:
      - '.github/workflows/zhaqing-calculix.yml'
      - 'automation/zhaqing_calculix/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  solve:
    name: Solve completed-state cable prestress on validated L2 topology
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact calibration commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Install CalculiX
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends software-properties-common && sudo add-apt-repository -y universe && sudo apt-get update && sudo apt-get install -y --no-install-recommends calculix-ccx
      - name: Download validated PR9 L2 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p baseline && gh run download 30068283053 --repo "$GITHUB_REPOSITORY" --name "verified-zhaqing-s4-static-shell-9531999012bd4a94bd937e59f74443c12bcb4b23" --dir baseline
      - name: Execute prestress inverse calibration
        id: calibration
        continue-on-error: true
        run: BASE="$(find baseline -type f -name 'LC01_G_DEAD.inp' -print -quit)" && test -s "$BASE" && python3 automation/zhaqing_calculix/prestress_l2_calibrate.py "$BASE" build/zhaqing-prestress
      - name: Upload complete nonlinear evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhaqing-l2-prestress-${{ github.sha }}
          path: build/zhaqing-prestress
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Publish calibration receipt back to branch
        if: always()
        run: |
          set -e
          mkdir -p automation/zhaqing_calculix/prestress_result
          cp build/zhaqing-prestress/calibration_summary.json automation/zhaqing_calculix/prestress_result/calibration_summary.json
          if test -s build/zhaqing-prestress/scale_0p00000000/solver.stdout.log; then cp build/zhaqing-prestress/scale_0p00000000/solver.stdout.log automation/zhaqing_calculix/prestress_result/scale0_solver.log; fi
          if test -s build/zhaqing-prestress/scale_1p00000000/solver.stdout.log; then cp build/zhaqing-prestress/scale_1p00000000/solver.stdout.log automation/zhaqing_calculix/prestress_result/scale1_solver.log; fi
          if test -s build/zhaqing-prestress/scale_1p00000000/model.inp; then cp build/zhaqing-prestress/scale_1p00000000/model.inp automation/zhaqing_calculix/prestress_result/scale1_model.inp; fi
          if test -s build/zhaqing-prestress/SELECTED_MODEL.inp; then cp build/zhaqing-prestress/SELECTED_MODEL.inp automation/zhaqing_calculix/prestress_result/SELECTED_MODEL.inp; fi
          if test -s build/zhaqing-prestress/SELECTED_MODEL.dat; then cp build/zhaqing-prestress/SELECTED_MODEL.dat automation/zhaqing_calculix/prestress_result/SELECTED_MODEL.dat; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add automation/zhaqing_calculix/prestress_result
          git diff --cached --quiet || git commit -m "publish Zhaqing prestress diagnostics"
          git push origin HEAD:agent/zhaqing-freecad-cad003
