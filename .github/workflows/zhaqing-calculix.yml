name: Zhaqing internal node 1040 mapping
on:
  push:
    branches:
      - agent/zhaqing-freecad-cad003
    paths:
      - '.github/workflows/zhaqing-calculix.yml'
      - 'automation/zhaqing_calculix/map_internal_1040.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mapping evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Map residual internal node
        run: python3 automation/zhaqing_calculix/map_internal_1040.py
      - name: Publish mapping result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add automation/zhaqing_calculix/nlgeom_node_map/node1040_neighborhood.json
          git diff --cached --quiet || git commit -m "publish Zhaqing node 1040 neighborhood"
          git push origin HEAD:agent/zhaqing-freecad-cad003
