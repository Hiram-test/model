name: Zhaqing prestressed perturbation verification # Verify stress-stiffness response without entering the known-failing NLGEOM Newton path.
on: # Reuse the already registered PR9 branch-push execution route.
  push: # Execute whenever this exact verification workflow changes.
    branches: # Restrict the numerical experiment to the temporary PR9 branch.
      - agent/zhaqing-freecad-cad003 # Keep repository main isolated from prestress qualification work.
    paths: # Trigger only on the perturbation verification workflow or generator.
      - '.github/workflows/zhaqing-calculix.yml' # Re-run whenever this exact solver sequence changes.
      - 'automation/zhaqing_calculix/perturbation_prestress_test.py' # Re-run whenever the perturbation deck generator changes.
  workflow_dispatch: # Retain an explicit manual audit rerun entry point.
permissions: # Grant only access needed to retrieve baseline/source evidence and publish the result.
  contents: write # Permit the job to commit the small result package back to the temporary branch.
  actions: read # Permit download of the immutable successful PR9 L2 baseline artifact.
jobs: # Define one deterministic zero-stress versus prestressed second-order static comparison.
  verify: # Generate, solve, compare, archive, and publish both perturbation states.
    runs-on: ubuntu-22.04 # Match the operating-system family used by the validated PR9 CalculiX run.
    timeout-minutes: 30 # Bound package installation and two whole-bridge linearized solves.
    steps: # Execute checkout, source recovery, solver installation, generation, solution, parsing, and publication.
      - name: Checkout exact verification commit # Materialize the precise PR9 branch revision under test.
        uses: actions/checkout@v4 # Use GitHub's standard checkout action.
        with: # Configure the checkout for deterministic evidence publication.
          fetch-depth: 1 # Fetch only the exact branch revision required by this run.
          persist-credentials: true # Retain workflow credentials solely for publishing the result back to this branch.
      - name: Recover audited native prestress modules # Export the previously audited force model and native initial-stress construction without duplicating mechanics code.
        run: | # Fetch the isolated native-prestress branch and materialize only its Python implementation.
          set -euxo pipefail # Fail immediately if the audited source branch or required modules cannot be recovered.
          git fetch --depth=1 origin agent/zhaqing-native-solve-only # Fetch the exact isolated branch containing the native initial-stress implementation.
          mkdir -p /tmp/zhaqing_native # Create a temporary import directory outside the checked-out experimental branch.
          git archive FETCH_HEAD automation/zhaqing_prestress | tar -x -C /tmp/zhaqing_native # Export the complete audited prestress module family while preserving package-relative filenames.
      - name: Install CalculiX # Install the same packaged solver family used by the successful PR9 baseline.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends software-properties-common && sudo add-apt-repository -y universe && sudo apt-get update && sudo apt-get install -y --no-install-recommends calculix-ccx # Install ccx and its sparse-solver dependencies from Ubuntu repositories.
      - name: Download validated PR9 L2 baseline # Recover the exact already-solved LC01 mother model from immutable Actions evidence.
        env: # Scope the GitHub token to same-repository artifact retrieval.
          GH_TOKEN: ${{ github.token }} # Authenticate GitHub CLI for the validated baseline artifact.
        run: mkdir -p baseline && gh run download 30068283053 --repo "$GITHUB_REPOSITORY" --name "verified-zhaqing-s4-static-shell-9531999012bd4a94bd937e59f74443c12bcb4b23" --dir baseline # Download the successful S4/B31/T3D2 L2 model package.
      - name: Generate zero-stress and prestressed perturbation decks # Build identical equal-area T3D2 cable topologies differing only in the supplied elementwise initial stress field.
        run: BASE="$(find baseline -type f -name 'LC01_G_DEAD.inp' -print -quit)" && test -s "$BASE" && python3 automation/zhaqing_calculix/perturbation_prestress_test.py "$BASE" /tmp/zhaqing_native/automation/zhaqing_prestress build/zhaqing-perturbation # Generate both second-order static comparison models from the immutable baseline.
      - name: Solve both second-order static states # Execute the zero-stress and force-found prestressed perturbation models under the same one-kilonewton midspan increment.
        run: | # Run both CalculiX cases and preserve native process statuses independently.
          set +e # Capture each solver status without terminating before the comparison can be parsed.
          cd build/zhaqing-perturbation # Enter the isolated comparison directory so result basenames remain deterministic.
          ccx -i ZQ_PERT_ZERO > ZQ_PERT_ZERO.stdout.log 2>&1 # Solve the zero-initial-stress second-order static control.
          echo $? > ZQ_PERT_ZERO.exit # Preserve the native zero-stress CalculiX process status.
          ccx -i ZQ_PERT_PRESTRESS > ZQ_PERT_PRESTRESS.stdout.log 2>&1 # Solve the force-found initial-stress second-order static bridge.
          echo $? > ZQ_PERT_PRESTRESS.exit # Preserve the native prestressed CalculiX process status.
          exit 0 # Continue to deterministic response comparison regardless of either raw process outcome.
      - name: Compare perturbation responses # Verify clean solver completion and a nonzero prestress-induced stiffness effect at bridge midspan.
        run: | # Parse both DAT files and emit one machine-readable qualification receipt.
          python3 - <<'PY' # Start the documented comparison parser.
          from pathlib import Path  # Resolve generated solver evidence paths portably.
          import json  # Serialize the final prestress perturbation verification receipt.
          import re  # Parse standard CalculiX nodal displacement-table rows.
          root = Path('build/zhaqing-perturbation')  # Resolve the isolated zero/prestress comparison directory.
          def parse_case(stem):  # Parse one perturbation job into its native exit status and final node-291 vertical response.
              exit_code = int((root / f'{stem}.exit').read_text().strip()) if (root / f'{stem}.exit').exists() else 999  # Normalize the native solver status to an explicit integer fallback.
              log = (root / f'{stem}.stdout.log').read_text(errors='ignore') if (root / f'{stem}.stdout.log').exists() else ''  # Load the complete solver trace for explicit fatal-error screening.
              dat = root / f'{stem}.dat'  # Locate the standard requested text result file for this perturbation job.
              uz = None  # Initialize bridge midspan displacement until a valid output row is parsed.
              if dat.exists():  # Parse the response only when CalculiX emitted the requested DAT output.
                  active = False  # Track whether the current DAT records belong to a displacement table.
                  for line in dat.read_text(errors='ignore').splitlines():  # Scan every printed state so the final available perturbation response is retained.
                      if 'displacements (vx,vy,vz)' in line.lower():  # Detect the standard CalculiX displacement-table header.
                          active = True  # Enable numeric displacement-row parsing.
                          continue  # Advance directly to the first possible data row.
                      if active and line.strip().lower().startswith('forces ('):  # Detect the reaction-force table that terminates displacement output.
                          active = False  # Stop interpreting subsequent numeric rows as displacements.
                      if active:  # Parse numeric records only inside an active displacement table.
                          match = re.match(r'\s*(\d+)\s+([-+0-9.Ee]+)\s+([-+0-9.Ee]+)\s+([-+0-9.Ee]+)\s*$', line)  # Match node identifier and three global displacement components.
                          if match and int(match.group(1)) == 291:  # Select the validated bridge-deck centerline midspan node.
                              uz = float(match.group(4))  # Store its final global vertical incremental displacement in millimetres.
              clean = exit_code == 0 and '*ERROR' not in log.upper() and uz is not None  # Require native process success, no fatal CalculiX diagnostic, and an observable response.
              return {'solverExitCode': exit_code, 'clean': clean, 'midspanIncrementalU3Mm': uz}  # Return the load-bearing scalar evidence for this state.
          zero = parse_case('ZQ_PERT_ZERO')  # Parse the zero-initial-stress control response.
          prestressed = parse_case('ZQ_PERT_PRESTRESS')  # Parse the force-found prestressed second-order static response.
          ratio = None  # Initialize the prestressed-to-zero displacement ratio until both clean responses exist.
          stiffness_ratio = None  # Initialize the inverse displacement ratio representing effective incremental stiffness change.
          if zero['clean'] and prestressed['clean'] and abs(zero['midspanIncrementalU3Mm']) > 1.0e-15 and abs(prestressed['midspanIncrementalU3Mm']) > 1.0e-15:  # Compare stiffness only from two finite clean displacement responses.
              ratio = prestressed['midspanIncrementalU3Mm'] / zero['midspanIncrementalU3Mm']  # Measure the signed prestressed response relative to the identical zero-stress topology.
              stiffness_ratio = abs(zero['midspanIncrementalU3Mm'] / prestressed['midspanIncrementalU3Mm'])  # Convert equal-load displacement change into an effective stiffness ratio.
          stress_effect_detected = ratio is not None and abs(ratio - 1.0) > 1.0e-4  # Require a clearly nonzero response change to prove that the supplied initial stress enters the second-order stiffness.
          status = 'PASS' if zero['clean'] and prestressed['clean'] and stress_effect_detected else 'FAIL'  # Accept the bypass only when both jobs solve cleanly and prestress measurably changes tangent response.
          receipt = {'status': status, 'zeroStress': zero, 'prestressed': prestressed, 'prestressedToZeroDisplacementRatio': ratio, 'effectiveStiffnessRatio': stiffness_ratio, 'stressStiffnessEffectDetected': stress_effect_detected, 'analysis': 'STEP PERTURBATION + STATIC', 'testLoadN': -1000.0, 'testNode': 291, 'prestressScale': 1.0214524479201714, 'mainCableHorizontalForceTargetN': 716150.2048515677}  # Assemble the complete numerical verification record.
          (root / 'verification_summary.json').write_text(json.dumps(receipt, indent=2))  # Persist the machine-readable result beside raw CalculiX files.
          print(json.dumps(receipt, indent=2))  # Mirror the same result into the GitHub Actions log for redundant auditability.
          PY # End the documented inline parser.
      - name: Upload perturbation verification evidence # Preserve both generated INPs and their complete CalculiX results.
        if: always() # Archive evidence after either numerical success or failure.
        uses: actions/upload-artifact@v4 # Store the complete comparison directory as immutable Actions evidence.
        with: # Configure artifact identity and retention.
          name: zhaqing-prestress-perturbation-${{ github.sha }} # Bind the numerical evidence to the exact comparison implementation commit.
          path: build/zhaqing-perturbation # Upload both input decks, result files, logs, and verification receipt.
          if-no-files-found: error # Treat absence of numerical evidence as workflow infrastructure failure.
          retention-days: 30 # Retain the comparison package for final AFEM mother-model handoff.
          compression-level: 6 # Apply standard compression to mixed text and FRD result files.
      - name: Publish perturbation verification result # Make the decisive result directly readable from the temporary branch.
        if: always() # Publish any generated comparison evidence after solver execution.
        run: | # Copy the compact result and final candidate INP to a stable temporary path.
          set -e # Stop publication if the generated comparison receipt is unexpectedly missing.
          mkdir -p automation/zhaqing_calculix/perturbation_result # Create the stable perturbation result directory on the temporary branch.
          cp build/zhaqing-perturbation/verification_summary.json automation/zhaqing_calculix/perturbation_result/verification_summary.json # Publish the machine-readable stress-stiffness verification receipt.
          cp build/zhaqing-perturbation/ZQ_PERT_PRESTRESS.inp automation/zhaqing_calculix/perturbation_result/ZQ_PERT_PRESTRESS.inp # Publish the exact prestressed second-order static candidate model.
          cp build/zhaqing-perturbation/ZQ_PERT_ZERO.inp automation/zhaqing_calculix/perturbation_result/ZQ_PERT_ZERO.inp # Publish the topology-identical zero-stress control model.
          cp build/zhaqing-perturbation/ZQ_PERT_PRESTRESS.stdout.log automation/zhaqing_calculix/perturbation_result/ZQ_PERT_PRESTRESS.stdout.log # Publish the prestressed solver trace for independent inspection.
          git config user.name github-actions # Identify the automated numerical evidence publisher explicitly.
          git config user.email github-actions@github.com # Use GitHub Actions' conventional non-personal commit identity.
          git add automation/zhaqing_calculix/perturbation_result # Stage only the final perturbation verification evidence.
          git diff --cached --quiet || git commit -m "publish Zhaqing prestressed perturbation result" # Create one result commit only when numerical evidence changed.
          git push origin HEAD:agent/zhaqing-freecad-cad003 # Publish the decisive result atomically back to the same temporary branch.
