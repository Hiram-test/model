name: Zhaqing NLGEOM internal-node mapping # Map the mixed-MPC common node back to the validated source element topology.
on: # Reuse the reliable PR9 branch-push execution route.
  push: # Execute this mapping job when its workflow definition changes.
    branches: # Restrict diagnostic work to the temporary PR9 branch.
      - agent/zhaqing-freecad-cad003 # Keep the repository main branch outside the numerical diagnosis.
    paths: # Trigger only on this exact temporary mapping workflow.
      - '.github/workflows/zhaqing-calculix.yml' # Re-run when the mapping procedure changes.
  workflow_dispatch: # Retain an explicit rerun entry point for audit.
permissions: # Grant only access required to retrieve the baseline and publish mapping evidence.
  contents: write # Permit publication of the small node-to-element mapping report back to the temporary branch.
  actions: read # Permit retrieval of the immutable validated PR9 L2 baseline artifact.
jobs: # Define one deterministic mapping job.
  map-node: # Reproduce the first failed nonlinear expansion and inspect its automatically generated .12d map.
    runs-on: ubuntu-22.04 # Match the CalculiX version family used in all preceding bridge runs.
    timeout-minutes: 20 # Bound the single control solve and mapping extraction.
    steps: # Execute checkout, solver installation, baseline retrieval, mapping solve, and report publication.
      - name: Checkout mapping commit # Materialize the exact temporary branch state.
        uses: actions/checkout@v4 # Use GitHub's standard checkout action.
        with: # Retain credentials only for publishing the mapping evidence.
          fetch-depth: 1 # Fetch only the current deterministic branch commit.
          persist-credentials: true # Permit one small evidence commit after the solve.
      - name: Install CalculiX # Install the same packaged solver used by the prior successful and diagnostic runs.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends software-properties-common && sudo add-apt-repository -y universe && sudo apt-get update && sudo apt-get install -y --no-install-recommends calculix-ccx # Install ccx and its sparse-solver dependencies.
      - name: Download validated L2 baseline # Recover the exact already-solved PR9 mother model.
        env: # Scope the GitHub token to artifact access.
          GH_TOKEN: ${{ github.token }} # Authenticate same-repository artifact retrieval.
        run: mkdir -p baseline && gh run download 30068283053 --repo "$GITHUB_REPOSITORY" --name "verified-zhaqing-s4-static-shell-9531999012bd4a94bd937e59f74443c12bcb4b23" --dir baseline # Download the immutable LC01 baseline package.
      - name: Reproduce pure NLGEOM expansion and extract node 1258 map # Generate the no-prestress control and read CalculiX's source-to-expanded topology file.
        run: | # Execute the single mapping solve and extraction in one isolated directory.
          set +e # Allow the known nonlinear failure so the automatically generated .12d file can still be inspected.
          mkdir -p build/zhaqing-map # Create a clean mapping working directory.
          BASE="$(find baseline -type f -name 'LC01_G_DEAD.inp' -print -quit)" # Locate the immutable validated mother input deck.
          test -s "$BASE" || exit 90 # Refuse the mapping run when the baseline deck is missing.
          python3 automation/zhaqing_calculix/nlgeom_control_generate.py "$BASE" build/zhaqing-map/ZQ_MAP.inp || exit 91 # Generate the identical pure-NLGEOM topology control used to expose node 1258.
          cd build/zhaqing-map # Enter the isolated mapping directory.
          ccx -i ZQ_MAP > ZQ_MAP.stdout.log 2>&1 # Run CalculiX until the known first-increment failure while retaining the expanded topology evidence.
          test -s ZQ_MAP.12d || exit 92 # Require the official CalculiX 1D/2D source-to-3D expansion map.
          grep -n -B 8 -A 8 -w '1258' ZQ_MAP.12d > node1258_map.txt || true # Extract every source element topology block whose generated representation contains internal node 1258.
          grep -n -B 8 -A 8 -w '1040' ZQ_MAP.12d > node1040_map.txt || true # Extract every topology block containing the repeated maximum-residual internal node 1040.
          grep -n -B 8 -A 8 -w '1007' ZQ_MAP.12d > node1007_map.txt || true # Extract the alternate repeated maximum-residual internal node 1007 for cross-checking.
          cp ZQ_MAP.12d topology_map_full.12d # Preserve the complete official expansion map as fallback if one node lies in a neighboring block.
          exit 0 # Continue to publication after mapping extraction regardless of expected nonlinear solve status.
      - name: Publish internal-node mapping # Commit the small mapping excerpts and full .12d evidence to a stable temporary path.
        if: always() # Publish any mapping evidence generated before a numerical failure.
        run: | # Copy mapping evidence and commit it atomically to the temporary branch.
          set -e # Stop publication if the required .12d mapping file was not generated.
          mkdir -p automation/zhaqing_calculix/nlgeom_node_map # Create the stable internal-node mapping directory.
          cp build/zhaqing-map/node1258_map.txt automation/zhaqing_calculix/nlgeom_node_map/node1258_map.txt # Publish the mixed-MPC common-node mapping excerpt.
          cp build/zhaqing-map/node1040_map.txt automation/zhaqing_calculix/nlgeom_node_map/node1040_map.txt # Publish the primary residual-node mapping excerpt.
          cp build/zhaqing-map/node1007_map.txt automation/zhaqing_calculix/nlgeom_node_map/node1007_map.txt # Publish the alternate residual-node mapping excerpt.
          cp build/zhaqing-map/topology_map_full.12d automation/zhaqing_calculix/nlgeom_node_map/topology_map_full.12d # Publish the complete source-to-expanded topology map for independent verification.
          git config user.name github-actions # Identify the automated numerical evidence publisher.
          git config user.email github-actions@github.com # Use GitHub Actions' conventional non-personal identity.
          git add automation/zhaqing_calculix/nlgeom_node_map # Stage only the newly generated mapping evidence.
          git diff --cached --quiet || git commit -m "publish Zhaqing NLGEOM internal-node map" # Create a mapping commit only when evidence changed.
          git push origin HEAD:agent/zhaqing-freecad-cad003 # Publish the mapping evidence back to the same temporary PR9 branch.
