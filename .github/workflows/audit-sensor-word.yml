name: Audit sensor Word files
on:
  push:
    branches:
      - audit/release-inventory-20260803
    paths:
      - .github/workflows/audit-sensor-word.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download zhangjinggao-full-20260729 --pattern archive-manifest.csv --pattern package-members.csv --clobber
          cat > /tmp/filter.py <<'PY'
          import csv
          import json
          keywords = ('传感器', '参数', '测点', '设备', '仪器', '监测', '采集')
          word_ext = ('.doc', '.docx')
          exact = []
          broad = []
          with open('archive-manifest.csv', 'r', encoding='utf-8-sig', newline='') as handle:
              for row in csv.DictReader(handle):
                  path = (row.get('RelativePath') or '').strip()
                  if not path.lower().endswith(word_ext):
                      continue
                  if '传感器' in path and '参数' in path:
                      exact.append(dict(row))
                  elif any(term in path for term in keywords):
                      broad.append(dict(row))
          selected = {item.get('RelativePath') for item in exact + broad}
          members = []
          with open('package-members.csv', 'r', encoding='utf-8-sig', newline='') as handle:
              for row in csv.DictReader(handle):
                  if row.get('RelativePath') in selected:
                      members.append(dict(row))
          with open('sensor-word-release-matches.json', 'w', encoding='utf-8') as handle:
              json.dump({'exact_matches': exact, 'broad_candidates': broad, 'package_matches': members}, handle, ensure_ascii=False, indent=2)
          PY
          python /tmp/filter.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sensor-word-release-matches.json
          git commit -m 'Audit sensor parameter Word files in release'
          git push
