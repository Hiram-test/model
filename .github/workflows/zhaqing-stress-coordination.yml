name: Zhaqing canonical P0-P4 numerical qualification # Run the only authoritative equilibrium, detailed-response, VTK, and evidence Gate for PR9.
on: # Expose one branch-triggered qualification route plus explicit audited reruns.
  push: # Recalculate whenever any source on the existing PR9 branch changes.
    branches: # Restrict automatic execution to the PR9 implementation branch.
      - agent/zhaqing-freecad-cad003 # Keep incomplete engineering-release work isolated from the default branch.
  workflow_dispatch: # Allow an explicit rerun of the exact committed implementation without editing files.
permissions: # Grant only read access required for checkout and immutable baseline retrieval.
  contents: read # Read the tested commit and source files without repository mutation authority.
  actions: read # Read the frozen successful baseline run and artifact metadata.
concurrency: # Prevent stale numerical runs from racing a newer PR9 implementation.
  group: zhaqing-canonical-${{ github.ref }} # Serialize this qualification by tested branch or explicit ref.
  cancel-in-progress: true # Cancel an obsolete run as soon as a newer commit starts qualification.
env: # Freeze baseline identities, artifact roots, locale, time zone, and numerical thread controls.
  BASELINE_RUN_ID: '30068283053' # Select the immutable verified static-shell baseline run.
  BASELINE_ARTIFACT: verified-zhaqing-s4-static-shell-9531999012bd4a94bd937e59f74443c12bcb4b23 # Select the exact baseline artifact name bound to its source commit.
  BASELINE_ARTIFACT_ID: '8587036796' # Freeze the GitHub service identity of the selected immutable baseline artifact.
  BASELINE_ARTIFACT_DIGEST: sha256:fadcd8ec455c90a429f69001f2ba98b04c7840c64d5d37f5f3cd90c766745a20 # Freeze the service-computed ZIP artifact digest.
  BASELINE_INPUT_SHA256: 1a6578cacf02fa2f32b6922f3385aa55220b0f0bd4025c9d334ab80e21f4a50d # Freeze the exact LC01 mother-deck bytes.
  SOURCE_CONTRACT_SHA256: 4f3128df6885e504ec413dac19a452048fd2035fe2eafd69148d42036972b692 # Freeze the complete source-contract bytes.
  PACKAGE: build/zhaqing-stress-coordination-package # Keep the self-contained artifact and detached verifier under one upload root.
  OUT: build/zhaqing-stress-coordination-package/artifact # Keep the canonical manifest root separate from its independent verifier receipt.
  BASELINE_DOWNLOAD: build/zhaqing-stress-coordination-baseline # Isolate downloaded immutable baseline bytes from generated evidence.
  TZ: UTC # Remove local-time ambiguity from command and provenance timestamps.
  LANG: C.UTF-8 # Freeze process text handling for solver, parser, and evidence commands.
  LC_ALL: C.UTF-8 # Apply the same deterministic locale to every subprocess.
  OMP_NUM_THREADS: '1' # Avoid nondeterministic OpenMP reduction ordering.
  OPENBLAS_NUM_THREADS: '1' # Avoid host-dependent BLAS thread scheduling.
  MKL_NUM_THREADS: '1' # Freeze MKL thread count if a transitive runtime exposes it.
  NUMEXPR_NUM_THREADS: '1' # Freeze NumExpr thread count if present on the hosted image.
  PYTHONDONTWRITEBYTECODE: '1' # Prevent untracked bytecode from contaminating source or artifact inventories.
jobs: # Define one canonical fail-closed numerical-qualification job.
  canonical-numerical-qualification: # Run P0 through P4, independent validators, and complete provenance in one evidence chain.
    runs-on: ubuntu-22.04 # Match the operating-system family used by the frozen verified baseline.
    timeout-minutes: 60 # Bound solver installation, full response, validation, and evidence packaging.
    steps: # Execute source capture, baseline recovery, solve, independent checks, upload, and final enforcement.
      - name: Checkout exact PR9 implementation # Materialize the tested revision with its parent for added-line comment auditing.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Pin checkout v4.2.2 to immutable action bytes.
        with: # Configure a shallow but parent-complete read-only checkout.
          fetch-depth: 2 # Fetch HEAD and its first parent for deterministic diff-based comment verification.
          persist-credentials: false # Prevent calculation scripts from obtaining repository-write credentials.
      - name: Stage exact calculation sources and preflight contracts # Archive checkout bytes before generating or running any numerical model.
        run: | # Create deterministic roots, stage sources, compile entry points, and enforce per-added-line comments.
          set -euo pipefail # Fail on every shell error, unset variable, or failed pipeline.
          test -z "$(git status --porcelain --untracked-files=no)" # Require a clean tracked checkout before calculation.
          mkdir -p "$OUT/calculation" "$OUT/evidence/baseline" "$OUT/logs" "$OUT/provenance/commands" "$OUT/provenance/generated-sources" "$OUT/provenance/sources" # Create the complete canonical evidence directory contract.
          cp --parents .github/workflows/zhaqing-stress-coordination.yml automation/zhaqing_calculix/stress_coordination_pipeline.part* automation/zhaqing_calculix/stress_coordination_condensed_adapter.part* automation/zhaqing_calculix/stress_coordination_acceptance_contract.py automation/zhaqing_calculix/stress_coordination_evidence.py automation/zhaqing_calculix/validate_stress_coordination_vtk.py automation/zhaqing_calculix/test_validate_stress_coordination_vtk.py automation/zhaqing_prestress/balanced_transfer_prestress.py bridge-fem-skill-suite/schemas/gate_ledger.schema.json "$OUT/provenance/sources" # Preserve exact workflow, calculation, validator, charter, parser, and ledger-schema checkout bytes.
          cat automation/zhaqing_calculix/stress_coordination_pipeline.part* > "$OUT/provenance/generated-sources/stress_coordination_pipeline.py" # Reconstruct the exact ordered P1/P2 calculation module.
          cat automation/zhaqing_calculix/stress_coordination_condensed_adapter.part* > "$OUT/provenance/generated-sources/stress_coordination_condensed_adapter.py" # Reconstruct the exact ordered P3/P4 tangent-condensation adapter.
          git rev-parse HEAD > "$OUT/provenance/source-commit.txt" # Bind all generated evidence to the exact tested commit.
          git diff --check HEAD^ HEAD > "$OUT/logs/git-diff-check.txt" # Reject whitespace-corrupted additions before numerical execution.
          python3 -B -m py_compile "$OUT/provenance/generated-sources/stress_coordination_pipeline.py" "$OUT/provenance/generated-sources/stress_coordination_condensed_adapter.py" automation/zhaqing_calculix/stress_coordination_acceptance_contract.py automation/zhaqing_calculix/stress_coordination_evidence.py automation/zhaqing_calculix/validate_stress_coordination_vtk.py automation/zhaqing_calculix/test_validate_stress_coordination_vtk.py # Compile every canonical Python entry point from exact staged or checkout bytes.
          python3 -B "$OUT/provenance/generated-sources/stress_coordination_pipeline.py" --help > "$OUT/logs/pipeline-help.txt" # Exercise the reconstructed P1/P2 import and CLI boundary.
          python3 -B "$OUT/provenance/generated-sources/stress_coordination_condensed_adapter.py" --help > "$OUT/logs/adapter-help.txt" # Exercise the reconstructed canonical P3/P4 import and CLI boundary.
          python3 -B automation/zhaqing_calculix/validate_stress_coordination_vtk.py --help > "$OUT/logs/validator-help.txt" # Exercise the strict validator CLI contract.
          python3 -B automation/zhaqing_calculix/test_validate_stress_coordination_vtk.py > "$OUT/logs/validator-regression.txt" 2>&1 # Require all strict VTK adversarial regression cases to pass.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py comment-gate --cwd "$PWD" --parent HEAD^ --child HEAD --output "$OUT/provenance/added-line-comment-gate.json" .github/workflows/zhaqing-stress-coordination.yml automation/zhaqing_calculix/stress_coordination_pipeline.part00 automation/zhaqing_calculix/stress_coordination_pipeline.part01 automation/zhaqing_calculix/stress_coordination_pipeline.part02a automation/zhaqing_calculix/stress_coordination_pipeline.part02b automation/zhaqing_calculix/stress_coordination_pipeline.part03 automation/zhaqing_calculix/stress_coordination_pipeline.part04 automation/zhaqing_calculix/stress_coordination_condensed_adapter.part00 automation/zhaqing_calculix/stress_coordination_condensed_adapter.part01 automation/zhaqing_calculix/stress_coordination_condensed_adapter.part02 automation/zhaqing_calculix/stress_coordination_condensed_adapter.part03 automation/zhaqing_calculix/stress_coordination_acceptance_contract.py automation/zhaqing_calculix/stress_coordination_evidence.py automation/zhaqing_calculix/validate_stress_coordination_vtk.py automation/zhaqing_calculix/test_validate_stress_coordination_vtk.py # Enforce the user's explicit comment requirement on every nonblank added source line.
          python3 -B automation/zhaqing_calculix/stress_coordination_acceptance_contract.py "$OUT/evidence/acceptance-contract.json" # Publish the frozen baseline, topology, wind boundary, and numerical thresholds before qualification.
      - name: Install and fingerprint the exact solver package # Install CalculiX 2.17-3 and bind the executable plus linked libraries to exact bytes.
        run: | # Install from the Ubuntu 22.04 repository and generate a complete runtime receipt.
          set -euo pipefail # Fail closed if package installation or identity verification fails.
          sudo apt-get update # Refresh hosted-runner package metadata before solver installation.
          sudo apt-get install -y --no-install-recommends software-properties-common # Install the repository-management utility required for universe.
          sudo add-apt-repository -y universe # Enable the Ubuntu repository containing the frozen CalculiX package version.
          sudo apt-get update # Refresh metadata after enabling the solver repository.
          sudo apt-get install -y --no-install-recommends calculix-ccx=2.17-3 # Install exactly the package version used by the verified baseline family.
          test "$(dpkg-query -W -f='${Version}' calculix-ccx)" = '2.17-3' # Reject package-version drift before model generation.
          CCX_PATH="$(command -v ccx)" # Resolve the exact solver executable used by every subsequent command.
          test -x "$CCX_PATH" # Require an executable native solver path.
          printf 'CCX_PATH=%s\n' "$CCX_PATH" >> "$GITHUB_ENV" # Publish the verified path to later workflow steps.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py toolchain --ccx "$CCX_PATH" --output "$OUT/provenance/toolchain.json" # Record runner, OS, Python, package, solver, and dynamic-library digests.
      - name: Recover and verify the immutable baseline # Download only the exact successful run artifact and prove all fixed source identities.
        env: # Scope the workflow token solely to same-repository Actions reads.
          GH_TOKEN: ${{ github.token }} # Authenticate immutable run and artifact metadata retrieval.
        run: | # Select one artifact, download it, assert fixed hashes, and archive exact baseline evidence.
          set -euo pipefail # Fail closed on missing, duplicate, expired, or mismatched baseline evidence.
          mkdir -p "$BASELINE_DOWNLOAD" # Create the isolated download root outside the canonical manifest tree.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID/artifacts?per_page=100" > "$BASELINE_DOWNLOAD/artifacts.json" # Read service-computed artifact ids and digests for the frozen run.
          jq -e --arg name "$BASELINE_ARTIFACT" --arg id "$BASELINE_ARTIFACT_ID" --arg digest "$BASELINE_ARTIFACT_DIGEST" '[.artifacts[] | select(.name == $name and (.id | tostring) == $id and .digest == $digest and .expired == false)] | if length == 1 then .[0] else error("expected exactly one live frozen baseline artifact") end' "$BASELINE_DOWNLOAD/artifacts.json" > "$OUT/provenance/baseline-artifact.json" # Bind the selected package to its frozen GitHub artifact id and digest before download.
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASELINE_ARTIFACT" --dir "$BASELINE_DOWNLOAD/content" # Download only the selected immutable artifact.
          BASE="$(find "$BASELINE_DOWNLOAD/content" -type f -path '*/package/flat/LC01_G_DEAD.inp' -print -quit)" # Locate the exact frozen LC01 input inside the artifact package.
          REFERENCE_DAT="$(find "$BASELINE_DOWNLOAD/content" -type f -path '*/package/flat/LC01_G_DEAD.dat' -print -quit)" # Locate the exact frozen LC01 response used by independent L2 comparison.
          CONTRACT="$(find "$BASELINE_DOWNLOAD/content" -type f -name 'source_frozen_model_contract.json' -print -quit)" # Locate the frozen CAD/FEM source contract.
          REFERENCE_SUMMARY="$(find "$BASELINE_DOWNLOAD/content" -type f -name 'static_shell_analysis_summary.json' -print -quit)" # Locate the frozen baseline result summary for review provenance.
          test -s "$BASE" && test -s "$REFERENCE_DAT" && test -s "$CONTRACT" && test -s "$REFERENCE_SUMMARY" # Require every numerical and source baseline input before proceeding.
          test "$(sha256sum "$BASE" | cut -d' ' -f1)" = "$BASELINE_INPUT_SHA256" # Require the exact mother-deck bytes frozen by the acceptance charter.
          test "$(sha256sum "$CONTRACT" | cut -d' ' -f1)" = "$SOURCE_CONTRACT_SHA256" # Require the complete source-contract bytes without semantic substitution.
          cp "$BASE" "$OUT/evidence/baseline/LC01_G_DEAD.inp" # Archive the exact baseline input under its canonical role path.
          cp "$REFERENCE_DAT" "$OUT/evidence/baseline/LC01_G_DEAD.dat" # Archive the exact baseline solver response under its canonical role path.
          cp "$CONTRACT" "$OUT/evidence/baseline/source_frozen_model_contract.json" # Archive the complete source contract rather than only its digest.
          cp "$REFERENCE_SUMMARY" "$OUT/evidence/baseline/static_shell_analysis_summary.json" # Archive the baseline result summary for independent review.
          printf 'BASE=%s\nREFERENCE_DAT=%s\nCONTRACT=%s\n' "$(realpath "$BASE")" "$(realpath "$REFERENCE_DAT")" "$(realpath "$CONTRACT")" >> "$GITHUB_ENV" # Publish exact verified source paths to subsequent steps.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py run-recorded --id p0-balanced-parser --cwd "$PWD" --stdout "$OUT/logs/p0-balanced-parser.stdout.log" --stderr "$OUT/logs/p0-balanced-parser.stderr.log" --receipt "$OUT/provenance/commands/p0-balanced-parser.json" -- python3 -B automation/zhaqing_prestress/balanced_transfer_prestress.py "$BASE" # Exercise the corrected P0 parser against the real frozen model.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py run-recorded --id source-contract-digest --cwd "$PWD" --stdout "$OUT/logs/source-contract-digest.stdout.log" --stderr "$OUT/logs/source-contract-digest.stderr.log" --receipt "$OUT/provenance/commands/source-contract-digest.json" -- python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py semantic-digest --contract "$CONTRACT" --output "$OUT/provenance/source-contract-digest.json" # Produce explicit-pointer semantic classification while retaining full SHA authority.
      - name: Execute canonical P1-P4 response # Build v3 equilibrium, tangent condensation, retained solve, analytic recovery, and primary VTK evidence.
        run: | # Preserve native adapter status while continuing to independent validation and artifact upload.
          set +e # Allow the workflow to package diagnostics after a genuine numerical Gate failure.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py run-recorded --id canonical-p1-p4 --cwd "$PWD" --stdout "$OUT/logs/canonical-p1-p4.stdout.log" --stderr "$OUT/logs/canonical-p1-p4.stderr.log" --receipt "$OUT/provenance/commands/canonical-p1-p4.json" -- python3 -B "$OUT/provenance/generated-sources/stress_coordination_condensed_adapter.py" --module "$OUT/provenance/generated-sources/stress_coordination_pipeline.py" --base "$BASE" --output "$OUT/calculation" --ccx "$CCX_PATH" # Execute the only authoritative full numerical response path.
          status=$? # Preserve the native canonical numerical Gate status.
          set -e # Restore fail-fast behavior after status capture.
          printf '%s\n' "$status" > "$OUT/provenance/adapter-exit-code.txt" # Bind downstream qualification to the adapter's real exit code.
          exit 0 # Continue to independent checks and immutable diagnostic upload.
      - name: Build independent VTK L2 ledger and canonical Gate receipts # Evaluate producer outputs through separate parsers and explicit release boundaries.
        if: always() # Attempt every independent receipt even when the producer correctly fails closed.
        run: | # Record each command and its native status without letting an early rejection hide later diagnostics.
          set +e # Collect all independent failure reasons before final enforcement.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py run-recorded --id strict-vtk-validation --cwd "$PWD" --stdout "$OUT/logs/strict-vtk-validation.stdout.log" --stderr "$OUT/logs/strict-vtk-validation.stderr.log" --receipt "$OUT/provenance/commands/strict-vtk-validation.json" -- python3 -B automation/zhaqing_calculix/validate_stress_coordination_vtk.py --vtk "$OUT/calculation/stress-coordinated.vtk" --summary "$OUT/calculation/summary.json" --baseline "$BASE" --equilibrium "$OUT/calculation/equilibrium_state.json" --dat "$OUT/calculation/canonical-response.dat" --wind-exclusion "$OUT/calculation/wind-exclusion.json" --receipt "$OUT/evidence/vtk-validation.json" # Require exact 783-node and 1070-element canonical response semantics through EOF.
          printf '%s\n' "$?" > "$OUT/provenance/validator-exit-code.txt" # Preserve the independent VTK Gate process status.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py run-recorded --id independent-l2-cross-check --cwd "$PWD" --stdout "$OUT/logs/independent-l2-cross-check.stdout.log" --stderr "$OUT/logs/independent-l2-cross-check.stderr.log" --receipt "$OUT/provenance/commands/independent-l2-cross-check.json" -- python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py l2 --reference-inp "$BASE" --reference-dat "$REFERENCE_DAT" --candidate-inp "$OUT/calculation/ZQ_STRESS_COORDINATED.inp" --candidate-dat "$OUT/calculation/ZQ_STRESS_COORDINATED.dat" --output "$OUT/evidence/l2-comparison.json" # Compare raw retained response trends and bending-preserving stress envelopes independently.
          printf '%s\n' "$?" > "$OUT/provenance/l2-exit-code.txt" # Preserve the independent L2 evidence process status.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py run-recorded --id g3-g6-ledger --cwd "$PWD" --stdout "$OUT/logs/g3-g6-ledger.stdout.log" --stderr "$OUT/logs/g3-g6-ledger.stderr.log" --receipt "$OUT/provenance/commands/g3-g6-ledger.json" -- python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py ledger --contract "$CONTRACT" --schema bridge-fem-skill-suite/schemas/gate_ledger.schema.json --output "$OUT/evidence/g3-g6-ledger.json" # Preserve all unresolved formal engineering evidence as a schema-bound auditable BLOCKED ledger.
          printf '%s\n' "$?" > "$OUT/provenance/ledger-exit-code.txt" # Preserve the ledger generation process status.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py run-recorded --id canonical-gate --cwd "$PWD" --stdout "$OUT/logs/canonical-gate.stdout.log" --stderr "$OUT/logs/canonical-gate.stderr.log" --receipt "$OUT/provenance/commands/canonical-gate.json" -- python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py gate --equilibrium "$OUT/calculation/equilibrium_state.json" --summary "$OUT/calculation/summary.json" --vtk-receipt "$OUT/evidence/vtk-validation.json" --l2-receipt "$OUT/evidence/l2-comparison.json" --ledger "$OUT/evidence/g3-g6-ledger.json" --output "$OUT/evidence/canonical-gate.json" # Derive numerical PASS separately from truthful engineering BLOCKED status.
          printf '%s\n' "$?" > "$OUT/provenance/canonical-gate-exit-code.txt" # Preserve the decisive dual-status Gate process result.
          set -e # Restore fail-fast shell behavior after collecting every independent receipt.
          exit 0 # Continue to manifest construction and diagnostic upload regardless of current qualification result.
      - name: Seal and independently verify complete provenance # Hash every prior evidence file and verify exact inventory plus cross-artifact identities.
        if: always() # Attempt manifest closure on both successful and rejected numerical packages.
        run: | # Generate the non-self-referential manifest and keep the verifier receipt outside its inventory root.
          set +e # Preserve manifest or verifier rejection for final enforcement and upload.
          python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py manifest --root "$OUT" --output "$OUT/provenance/manifest.json" # Enumerate exact source, toolchain, commands, baseline, solver, receipts, logs, and visualization bytes.
          manifest_status=$? # Preserve manifest construction status outside its own inventory.
          if test "$manifest_status" -eq 0; then python3 -B automation/zhaqing_calculix/stress_coordination_evidence.py verify-manifest --root "$OUT" --manifest "$OUT/provenance/manifest.json" --repository "$PWD" --output "$PACKAGE/provenance-verification.json"; verifier_status=$?; else verifier_status=99; fi # Verify exact coverage, roles, checkout source equality, digests, and dual-status boundary only after manifest creation.
          printf '%s\n' "$manifest_status" > "$PACKAGE/manifest-exit-code.txt" # Preserve manifest construction status outside the sealed root.
          printf '%s\n' "$verifier_status" > "$PACKAGE/verifier-exit-code.txt" # Preserve independent verifier status outside the sealed root.
          set -e # Restore fail-fast behavior before artifact publication.
          exit 0 # Always continue to immutable evidence upload.
      - name: Upload canonical qualification package # Preserve the sealed artifact root and detached independent verifier for every outcome.
        if: always() # Upload diagnostics before the final job status is enforced.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # Pin upload-artifact v4.6.2 to immutable action bytes.
        with: # Configure exact artifact identity, complete hidden-source inclusion, and bounded retention.
          name: zhaqing-canonical-p0-p4-${{ github.sha }} # Bind the package name to the tested source commit.
          path: build/zhaqing-stress-coordination-package # Upload the manifest root and its independent verifier together.
          if-no-files-found: error # Treat a missing evidence package as workflow infrastructure failure.
          include-hidden-files: true # Include the archived .github workflow source listed by the provenance manifest.
          retention-days: 30 # Retain the complete review package for independent engineering audit.
          compression-level: 6 # Apply standard compression to mixed solver and text evidence.
      - name: Enforce canonical numerical qualification # Make job success follow every native Gate and the sealed dual-status receipt.
        if: always() # Enforce numerical status even after an earlier controlled failure or upload attempt.
        run: | # Require all producer, validator, cross-check, manifest, and verifier statuses to pass together.
          set -euo pipefail # Fail immediately on any missing or rejected decisive receipt.
          for stage in adapter validator l2 ledger canonical-gate; do test "$(cat "$OUT/provenance/${stage}-exit-code.txt")" = '0'; done # Require every recorded numerical and independent evidence command to succeed.
          test "$(cat "$PACKAGE/manifest-exit-code.txt")" = '0' # Require complete provenance manifest construction.
          test "$(cat "$PACKAGE/verifier-exit-code.txt")" = '0' # Require independent exact-inventory and cross-digest verification.
          python3 -B -c 'import json,sys; gate=json.load(open(sys.argv[1],encoding="utf-8")); verified=json.load(open(sys.argv[2],encoding="utf-8")); assert gate["numericalQualificationStatus"] == "PASS", gate; assert gate["engineeringReleaseStatus"] == "BLOCKED", gate; assert verified["status"] == "PASS", verified' "$OUT/evidence/canonical-gate.json" "$PACKAGE/provenance-verification.json" # Accept numerical qualification only while explicitly retaining the G3-G6 engineering-release block.
