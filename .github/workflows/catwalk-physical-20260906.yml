name: Catwalk physical-joint computation # Execute only newly written source-based reconstruction.
on: # Start a calculation only after an explicit run request or entrypoint change.
  push: # Keep numerical execution isolated from unrelated repository work.
    branches: [calc/catwalk-physical-joints-20260906] # Use the physical-joint reconstruction branch.
    paths: [catwalk-physical-20260906/solve_physical.py, catwalk-physical-20260906/REQUEST, .github/workflows/catwalk-physical-20260906.yml] # Allow supporting code to be completed before its invocation.
concurrency: # Avoid concurrent result writers in this scientific work directory.
  group: catwalk-physical-20260906 # Serialize only this independent computation.
  cancel-in-progress: false # Never cancel a running native calculation for a source edit.
permissions: # Use the existing repository authorization for original sources and result preservation.
  actions: read # Read original PDF acquisition artifacts only.
  contents: write # Save actual numerical evidence to the calculation branch.
jobs: # Execute real solver processes and preserve complete diagnostics.
  compute: # Source-state reconstruction followed by full physical calculations.
    runs-on: ubuntu-22.04 # Use a compatible native ABI.
    timeout-minutes: 90 # Permit static equilibration and complete eigensolution.
    env: # Limit thread oversubscription and retain standard source authorization.
      GH_TOKEN: ${{ github.token }} # Use the repository-scoped runtime credential without displaying it.
      OMP_NUM_THREADS: 2 # Keep native resource use controlled.
      OPENBLAS_NUM_THREADS: 2 # Keep independent sparse calculations reproducible.
    steps: # Preserve source identity, native outputs, and execution failures.
      - uses: actions/checkout@v4 # Read the exact source revision that requested this run.
        with: # Avoid substituting later source edits while a run is queued.
          ref: ${{ github.sha }} # Bind numerical inputs to the actual triggering commit.
          fetch-depth: 1 # Avoid executing historical code.
      - name: Install numerical dependencies # Install libraries only, not engineering models.
        run: python3 -m pip install numpy scipy matplotlib requests pymupdf # Obtain native parsing and independent numerical support.
      - name: Extend native memory backing # Retain the same physical equations when preprocessing exceeds resident RAM.
        run: | # Add temporary disk-backed memory on this disposable calculation runner.
          free -m # Record actual physical memory and existing swap before the native calculation.
          df -h /mnt # Record available disk space for the temporary swap file and complete numerical outputs.
          sudo fallocate -l 16G /mnt/catwalk-native.swap # Reserve backing storage without changing solver formulas or physical constraints.
          sudo chmod 600 /mnt/catwalk-native.swap # Restrict this temporary runner-local memory file to its owner.
          sudo mkswap /mnt/catwalk-native.swap # Format only the newly allocated temporary file as swap.
          sudo swapon /mnt/catwalk-native.swap # Permit the operating system to page native allocations instead of terminating the runner.
          free -m # Preserve the actual augmented memory configuration in the execution record.
      - name: Recover originals and native runtime # Use immutable engineering MCT and original report PDFs.
        run: python3 catwalk-physical-20260906/source_audit.py # Preserve exact original bytes and solver provenance.
      - name: Execute work state and spatial model # Perform actual native and independent computations.
        run: python3 catwalk-physical-20260906/solve_physical.py # No success placeholder is substituted for missing solver code.
      - name: Preserve readable evidence # Commit actual source audits and native diagnostics, including ignored solver extensions.
        if: always() # Retain both successful and unsuccessful calculation evidence.
        run: | # Keep the original run identity and never force-push scientific history.
          git config user.name github-actions[bot] # Attribute result preservation to the executing runner.
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com # Use the standard bot identity.
          git add -f catwalk-physical-20260906/evidence catwalk-physical-20260906/unit_string # Preserve native logs regardless of repository-wide ignore patterns.
          if test -d catwalk-physical-20260906/results; then find catwalk-physical-20260906/results -type f -size -5M -print0 | xargs -0 -r git add -f; fi # Preserve concise evidence without failing on spooles.out or native log extensions.
          git diff --cached --quiet || git commit -m "Record actual physical-joint computation from run $GITHUB_RUN_ID" # Commit only genuinely produced files.
          git pull --rebase origin calc/catwalk-physical-joints-20260906 # Retain independently committed source changes.
          git push origin HEAD:calc/catwalk-physical-joints-20260906 # Save evidence in the authorized repository without overwriting other branches.
      - name: Archive complete native files # Keep large inputs, FRD fields, exact sources and logs together.
        if: always() # Preserve reproducibility evidence even on native solver failure.
        uses: actions/upload-artifact@v4 # Transfer the full run folder through the artifact service.
        with: # Bind the artifact to this immutable run.
          name: catwalk-physical-${{ github.run_id }} # Keep independent attempts distinguishable.
          path: catwalk-physical-20260906 # Include original sources and every newly generated native file.
          retention-days: 30 # Retain the complete native evidence for verification.
