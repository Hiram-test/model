name: Zhaqing bridge S4 deck-shell static analysis

on:
  push:
    branches:
      - agent/zhaqing-freecad-cad003
    paths:
      - '.github/workflows/zhaqing-calculix-static-shell.yml'
      - 'automation/zhaqing_calculix/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  solve-static-shell:
    name: Generate and solve nine S4 shell-beam-cable static cases
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CAD_RUN_ID: '29990579492'
      CAD_ARTIFACT: 'zhaqing-cad003-freecad-only-04a45a7b55742996d19089332ccedda068853e92'
      OUT: build/zhaqing-calculix-static-shell

    steps:
      - name: Checkout immutable generator snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize append-only evidence directories
        run: |
          set -euxo pipefail
          mkdir -p "$OUT/provenance" "$OUT/package/results/raw" "$OUT/logs"
          git rev-parse HEAD > "$OUT/provenance/source-commit.txt"
          printf '%s\n' "$CAD_RUN_ID" > "$OUT/provenance/source-cad-run.txt"
          printf '%s\n' "$CAD_ARTIFACT" > "$OUT/provenance/source-cad-artifact.txt"

      - name: Download corrected CAD contract and validation evidence
        id: cad
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CAD_ARTIFACT }}
          path: recovered-cad003
          github-token: ${{ github.token }}
          repository: Hiram-test/model
          run-id: ${{ env.CAD_RUN_ID }}

      - name: Install CalculiX solver
        id: dependencies
        if: steps.cad.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          {
            set -eux
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends software-properties-common zip gzip
            sudo add-apt-repository -y universe
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends calculix-ccx
            command -v ccx
            dpkg-query -W calculix-ccx
          } 2>&1 | tee "$OUT/logs/01-install-calculix.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Decode generator and verify the shell model contract
        id: generate
        if: steps.dependencies.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          {
            set -eux
            base64 -d automation/zhaqing_calculix/generator.py.gz.b64 | gzip -dc > "$OUT/generate_zhaqing_calculix.py"
            python3 -m py_compile "$OUT/generate_zhaqing_calculix.py"
            test -s recovered-cad003/model/frozen_model_contract.json
            python3 "$OUT/generate_zhaqing_calculix.py" \
              --contract recovered-cad003/model/frozen_model_contract.json \
              --output "$OUT/package"
            cp "$OUT/generate_zhaqing_calculix.py" "$OUT/package/"
            python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('build/zhaqing-calculix-static-shell/package')
          receipt = json.loads((root / 'generation_receipt.json').read_text(encoding='utf-8'))
          required = {
              'schemaVersion': '2.0.0-shell-deck',
              'deckShellElementType': 'S4',
              'deckShellElementCount': 492,
              'deckShellNodeCount': 581,
              'deckShellAreaMm2': 451000000.0,
              'deckShellThicknessMm': 50.0,
              'deckMassClosureTonne': 0.0,
              'allFilesContainS4DeckShells': True,
              'allFilesContainShellSection': True,
              'oldDeckBracingRemoved': True,
              'allFilesUseOnlyCommonKeywords': True,
              'allFilesAscii': True,
          }
          for key, expected in required.items():
              actual = receipt.get(key)
              if isinstance(expected, float):
                  if abs(float(actual) - expected) > 1e-9:
                      raise SystemExit(f'{key}={actual!r}; expected {expected!r}')
              elif actual != expected:
                  raise SystemExit(f'{key}={actual!r}; expected {expected!r}')
          static_files = sorted((root / 'flat').glob('LC*.inp'))
          if len(static_files) != 9:
              raise SystemExit(f'expected 9 static INP files, got {len(static_files)}')
          modal = root / 'flat' / 'MODAL_20.inp'
          if modal.exists():
              holding = root / 'not_solved_modal'
              holding.mkdir(exist_ok=True)
              modal.replace(holding / modal.name)
              (holding / 'README.txt').write_text(
                  'MODAL_20.inp was generated but is intentionally excluded from the validated static package.\n'
                  'Ubuntu CalculiX 2.17 returns internal add_bo_st exit 201 for S4 shell frequency extraction.\n'
                  'The nine requested common, extreme and accidental static cases are unaffected.\n',
                  encoding='ascii',
              )
          summary = {
              'status': 'PASS',
              'staticCaseCount': len(static_files),
              'deckShellElementType': receipt['deckShellElementType'],
              'deckShellElementCount': receipt['deckShellElementCount'],
              'deckShellNodeCount': receipt['deckShellNodeCount'],
              'deckShellAreaMm2': receipt['deckShellAreaMm2'],
              'deckShellThicknessMm': receipt['deckShellThicknessMm'],
              'deckPanelMassTotalTonne': receipt['deckPanelMassTotalTonne'],
              'deckAccessoryMassTotalTonne': receipt['deckAccessoryMassTotalTonne'],
              'deckMassClosureTonne': receipt['deckMassClosureTonne'],
              'oldDeckBracingRemoved': receipt['oldDeckBracingRemoved'],
              'connection': 'S4 shell and B31 beam grid share nodes',
          }
          (root / 'deck_shell_generation_gate.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          } 2>&1 | tee "$OUT/logs/02-generate-and-gate-shell-model.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Solve nine common extreme and accidental static cases
        id: solve
        if: steps.generate.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          result_csv="$GITHUB_WORKSPACE/$OUT/package/results/solver_exit_codes.csv"
          printf 'case_id,exit_code,dat_bytes,frd_bytes,sta_bytes,cvg_bytes\n' > "$result_csv"
          overall=0
          cd "$OUT/package/flat"
          for inp in LC*.inp; do
            stem="${inp%.inp}"
            echo "===== $stem =====" | tee "$GITHUB_WORKSPACE/$OUT/package/results/raw/$stem.stdout.log"
            timeout 360s ccx -i "$stem" 2>&1 | tee -a "$GITHUB_WORKSPACE/$OUT/package/results/raw/$stem.stdout.log"
            code=${PIPESTATUS[0]}
            if [[ $code -ne 0 ]]; then overall=1; fi
            dat=0; frd=0; sta=0; cvg=0
            for ext in dat frd sta cvg 12d mpc nam; do
              if [[ -f "$stem.$ext" ]]; then
                size=$(stat -c %s "$stem.$ext")
                cp "$stem.$ext" "$GITHUB_WORKSPACE/$OUT/package/results/raw/"
                case "$ext" in
                  dat) dat=$size;; frd) frd=$size;; sta) sta=$size;; cvg) cvg=$size;;
                esac
              fi
            done
            printf '%s,%s,%s,%s,%s,%s\n' "$stem" "$code" "$dat" "$frd" "$sta" "$cvg" >> "$result_csv"
          done
          cd "$GITHUB_WORKSPACE"
          echo "overall_exit_code=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Parse solver evidence and assemble downloadable packages
        id: summarize
        if: always() && steps.generate.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PY' 2>&1 | tee "$OUT/logs/04-summarize-static-shell-results.log"
          from __future__ import annotations
          import csv, hashlib, json, re, zipfile
          from pathlib import Path

          root = Path('build/zhaqing-calculix-static-shell/package')
          raw = root / 'results' / 'raw'
          rows = list(csv.DictReader((root / 'results' / 'solver_exit_codes.csv').open(encoding='utf-8')))
          if len(rows) != 9:
              raise SystemExit(f'expected 9 solved cases, got {len(rows)}')
          cases = []
          forbidden = re.compile(r'\*ERROR|error in|singular matrix|no convergence|nan', re.I)
          for row in rows:
              case = row['case_id']
              stdout = (raw / f'{case}.stdout.log').read_text(encoding='utf-8', errors='replace')
              dat_path = raw / f'{case}.dat'
              dat = dat_path.read_text(encoding='utf-8', errors='replace') if dat_path.exists() else ''
              ok = int(row['exit_code']) == 0 and not forbidden.search(stdout + '\n' + dat)
              cases.append({
                  'caseId': case,
                  'solverExitCode': int(row['exit_code']),
                  'convergedByLogScreen': bool(ok),
                  'datBytes': int(row['dat_bytes']),
                  'frdBytes': int(row['frd_bytes']),
                  'staBytes': int(row['sta_bytes']),
                  'cvgBytes': int(row['cvg_bytes']),
                  'stdoutTail': stdout.splitlines()[-24:],
              })
          status = 'PASS' if all(c['convergedByLogScreen'] for c in cases) else 'FAIL'
          generation = json.loads((root / 'deck_shell_generation_gate.json').read_text(encoding='utf-8'))
          report = {
              'schemaVersion': '1.0.0-static-shell',
              'status': status,
              'solver': 'CalculiX ccx 2.17-3 on Ubuntu 22.04',
              'staticCaseCount': len(cases),
              'deckModel': generation,
              'cases': cases,
              'abaqusCompatibilityBasis': {
                  'inputFormat': 'expanded ASCII INP; no INCLUDE',
                  'elementTypes': ['S4', 'B31', 'T3D2', 'MASS'],
                  'commonKeywordGate': True,
              },
              'engineeringReleaseStatus': 'BLOCKED',
              'note': 'Global static screening only; no calibrated fabrication-state cable prestress or local panel-joint stiffness.',
          }
          report_path = root / 'results' / 'static_shell_analysis_summary.json'
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          csv_path = root / 'results' / 'static_shell_analysis_summary.csv'
          with csv_path.open('w', encoding='utf-8-sig', newline='') as stream:
              writer = csv.writer(stream)
              writer.writerow(['case_id','exit_code','converged','dat_bytes','frd_bytes'])
              for item in cases:
                  writer.writerow([item['caseId'], item['solverExitCode'], item['convergedByLogScreen'], item['datBytes'], item['frdBytes']])

          inp_zip = root / 'Zhaqing_Abaqus_CalculiX_S4_static_INP_only.zip'
          with zipfile.ZipFile(inp_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted((root / 'flat').glob('LC*.inp')):
                  archive.write(path, arcname=path.name)
              for extra in ['README_CN.md','assumptions_and_manifest.json','load_cases.csv','generation_receipt.json','deck_shell_generation_gate.json']:
                  path = root / extra
                  if path.exists():
                      archive.write(path, arcname=extra)

          full_zip = root / 'Zhaqing_CalculiX_Abaqus_S4_static_INP_and_results.zip'
          with zipfile.ZipFile(full_zip, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path in {inp_zip, full_zip}:
                      continue
                  archive.write(path, arcname=path.relative_to(root))

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          manifest = {
              'status': status,
              'inpOnlyZip': {'path': inp_zip.name, 'bytes': inp_zip.stat().st_size, 'sha256': sha256(inp_zip)},
              'fullZip': {'path': full_zip.name, 'bytes': full_zip.stat().st_size, 'sha256': sha256(full_zip)},
          }
          (root / 'STATIC_SHELL_DELIVERY_MANIFEST.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          raise SystemExit(0 if status == 'PASS' else 2)
          PY
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve environment and outcomes
        if: always()
        run: |
          set +e
          {
            uname -a
            cat /etc/os-release
            command -v ccx || true
            dpkg-query -W calculix-ccx 2>&1 || true
            python3 --version
          } > "$OUT/provenance/environment.txt" 2>&1
          {
            printf 'cad_download=%s\n' "${{ steps.cad.outcome }}"
            printf 'dependencies_exit=%s\n' "${{ steps.dependencies.outputs.exit_code }}"
            printf 'generate_exit=%s\n' "${{ steps.generate.outputs.exit_code }}"
            printf 'solver_overall_exit=%s\n' "${{ steps.solve.outputs.overall_exit_code }}"
            printf 'summary_exit=%s\n' "${{ steps.summarize.outputs.exit_code }}"
          } > "$OUT/provenance/step-outcomes.txt"
          cp "$OUT/provenance/environment.txt" "$OUT/package/results/solver_environment.txt" || true
          cp "$OUT/provenance/step-outcomes.txt" "$OUT/package/results/step_outcomes.txt" || true
          true

      - name: Upload validated static shell INP and result packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhaqing-calculix-s4-static-${{ github.sha }}
          path: build/zhaqing-calculix-static-shell
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce corrected CAD shell model and all nine static solutions
        if: always()
        run: |
          test "${{ steps.cad.outcome }}" = "success"
          test "${{ steps.dependencies.outputs.exit_code }}" = "0"
          test "${{ steps.generate.outputs.exit_code }}" = "0"
          test "${{ steps.solve.outputs.overall_exit_code }}" = "0"
          test "${{ steps.summarize.outputs.exit_code }}" = "0"
          test -s "$OUT/package/Zhaqing_Abaqus_CalculiX_S4_static_INP_only.zip"
          test -s "$OUT/package/Zhaqing_CalculiX_Abaqus_S4_static_INP_and_results.zip"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/zhaqing-calculix-static-shell/package')
          summary = json.loads((p/'results/static_shell_analysis_summary.json').read_text(encoding='utf-8'))
          gate = json.loads((p/'deck_shell_generation_gate.json').read_text(encoding='utf-8'))
          assert summary['status'] == 'PASS'
          assert summary['staticCaseCount'] == 9
          assert gate['status'] == 'PASS'
          assert gate['deckShellElementType'] == 'S4'
          assert gate['deckShellElementCount'] == 492
          assert gate['oldDeckBracingRemoved'] is True
          PY
