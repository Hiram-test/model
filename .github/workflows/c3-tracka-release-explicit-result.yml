# Publish the complete recovered explicit high-master Track A model and native solution as one immutable release package.
name: Release complete explicit C3 TrackA evidence # Give the release workflow an explicit name.
on: # Define the deterministic trigger.
  push: # Run when this release workflow is committed.
    branches: [agent/c3-tracka-direct-main13-20260831] # Restrict execution to the isolated Track A branch.
    paths: [".github/workflows/c3-tracka-release-explicit-result.yml"] # Avoid unrelated branch pushes.
permissions: # Declare the exact token permissions required by the release task.
  contents: write # Permit creation of the immutable GitHub release and tag.
  actions: read # Permit read-only retrieval of prior calculation artifacts.
jobs: # Define the single release job.
  release: # Retrieve, package, hash, and publish the complete evidence set.
    runs-on: ubuntu-24.04 # Use a current runner with GitHub CLI and standard archive tools.
    timeout-minutes: 45 # Bound polling, packaging, and release upload.
    env: # Freeze artifact names and release identity.
      RECOVERY_ARTIFACT_NAME: C3-TrackA-explicit-height-recovery # Select the full explicit-model recovery package.
      TRACKING_ARTIFACT_NAME: C3-TrackA-explicit-model-tracking # Select the global one-to-one tracking package.
      RELEASE_TAG: c3-tracka-explicit-forward-20260831 # Define the stable release tag for this historical-workflow reconstruction.
    steps: # Execute the complete release chain.
      - name: Checkout isolated Track A branch # Fetch the exact triggering branch state.
        uses: actions/checkout@v4 # Use the maintained checkout action.
        with: # Make checkout behavior explicit.
          ref: ${{ github.sha }} # Bind the release to the immutable triggering commit.
          fetch-depth: 1 # Fetch only the required branch snapshot.
          persist-credentials: false # Keep the checked-out worktree read-only.
      - name: Wait for and download complete calculation artifacts # Retrieve both prerequisite evidence packages.
        shell: bash # Execute the line-commented Python downloader.
        env: # Provide the ephemeral GitHub token to the downloader.
          GH_TOKEN: ${{ github.token }} # Authorize read-only Actions artifact access.
          GH_REPOSITORY: ${{ github.repository }} # Bind the current repository identity.
        run: | # Emit and execute the deterministic artifact downloader.
          cat > download_complete_evidence.py <<'PY' # Write the complete downloader source file.
          from __future__ import annotations  # Keep annotations deterministic on the runner Python version.
          from pathlib import Path  # Resolve archive and extraction paths deterministically.
          import io  # Hold downloaded ZIP bytes before extraction.
          import json  # Parse GitHub REST metadata and publish provenance.
          import os  # Read the ephemeral token and frozen artifact names.
          import time  # Poll prior calculations at bounded intervals.
          import urllib.request  # Call the GitHub REST API without extra dependencies.
          import zipfile  # Extract Actions artifact archives.
          TOKEN = os.environ['GH_TOKEN']  # Read the ephemeral workflow token.
          REPOSITORY = os.environ['GH_REPOSITORY']  # Read the owner/name repository identity.
          NAMES = (os.environ['RECOVERY_ARTIFACT_NAME'], os.environ['TRACKING_ARTIFACT_NAME'])  # Freeze prerequisite artifact names.
          ROOT = Path('complete_evidence')  # Bind the complete evidence extraction root.
          ROOT.mkdir(parents=True, exist_ok=True)  # Create the extraction root.
          def request_json(url: str) -> dict[str, object]:  # Fetch one GitHub REST JSON document.
              request = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})  # Build the authenticated read-only request.
              with urllib.request.urlopen(request, timeout=120) as response:  # Execute the bounded request.
                  return json.load(response)  # Decode and return the JSON response.
          def request_bytes(url: str) -> bytes:  # Download one Actions artifact ZIP archive.
              request = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})  # Build the authenticated archive request.
              with urllib.request.urlopen(request, timeout=300) as response:  # Follow redirects and download bounded bytes.
                  return response.read()  # Return the complete ZIP archive.
          selected: dict[str, dict[str, object]] = {}  # Accumulate the newest nonexpired prerequisite artifacts.
          for attempt in range(180):  # Poll for at most thirty minutes.
              for name in NAMES:  # Check each prerequisite independently.
                  if name in selected:  # Preserve an already selected immutable artifact.
                      continue  # Continue to the next prerequisite.
                  payload = request_json(f'https://api.github.com/repos/{REPOSITORY}/actions/artifacts?name={name}&per_page=100')  # List matching artifacts.
                  artifacts = payload.get('artifacts', [])  # Select the artifact array.
                  valid = [artifact for artifact in artifacts if not artifact.get('expired', False)] if isinstance(artifacts, list) else []  # Retain nonexpired artifacts only.
                  if valid:  # Select the newest available artifact when present.
                      selected[name] = max(valid, key=lambda artifact: str(artifact.get('created_at', '')))  # Freeze the latest matching package.
              if len(selected) == len(NAMES):  # Stop after both prerequisite packages are available.
                  break  # Exit the bounded polling loop.
              time.sleep(10)  # Wait ten seconds before the next read-only poll.
          if len(selected) != len(NAMES):  # Reject publication without the complete calculation evidence set.
              raise SystemExit(f'Prerequisite artifacts unavailable: {selected.keys()}')  # Surface the missing technical prerequisite without judging model quality.
          for name, artifact in selected.items():  # Download each selected prerequisite package.
              archive = request_bytes(f"https://api.github.com/repos/{REPOSITORY}/actions/artifacts/{int(artifact['id'])}/zip")  # Download the immutable ZIP archive.
              destination = ROOT / name  # Resolve the stable extraction directory.
              destination.mkdir(parents=True, exist_ok=True)  # Create the extraction directory.
              with zipfile.ZipFile(io.BytesIO(archive)) as handle:  # Open the in-memory archive.
                  handle.extractall(destination)  # Extract every evidence file.
          provenance = {'selected': selected, 'source_commit': os.environ.get('GITHUB_SHA'), 'target_frequency_used_for_model_construction': False, 'previous_differential_spring_model_included': False}  # Build the complete artifact provenance record.
          (ROOT / 'ARTIFACT_PROVENANCE.json').write_text(json.dumps(provenance, ensure_ascii=False, indent=2), encoding='utf-8')  # Publish artifact identities and modeling boundaries.
          PY
          python3 download_complete_evidence.py # Execute the deterministic artifact downloader.
      - name: Assemble one complete reproducibility package # Select the entity model native outputs and tracking evidence without rewriting them.
        shell: bash # Execute deterministic packaging commands.
        run: | # Build the immutable release directory and archive.
          set -euxo pipefail # Stop on command, variable, or pipeline errors.
          mkdir -p release_package/model release_package/native release_package/tracking release_package/audit # Create stable package subdirectories.
          model=$(find complete_evidence -type f -name '*.inp' -size +20M -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-) # Select the largest full-size explicit C3 input deck.
          dat=$(find complete_evidence -type f -name '*.dat' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-) # Select the largest native DAT output.
          frd=$(find complete_evidence -type f -name '*.frd' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-) # Select the largest native FRD output.
          test -n "$model" # Require the recovered full-size entity input.
          test -n "$dat" # Require the native frequency output.
          test -n "$frd" # Require the native mode-shape output.
          cp "$model" release_package/model/C3_TrackA_explicit_high_master.inp # Preserve the explicit full C3 input bytes.
          cp "$dat" release_package/native/C3_TrackA_explicit_high_master.dat # Preserve the native CalculiX frequency output bytes.
          cp "$frd" release_package/native/C3_TrackA_explicit_high_master.frd # Preserve the native CalculiX mode-shape output bytes.
          find complete_evidence -type f \( -name 'job.stdout.txt' -o -name '*.cvg' -o -name '*.sta' \) -exec cp {} release_package/native/ \; # Preserve available native solver logs and status files.
          find complete_evidence -type f \( -name 'TRACK_A_MODE_TRACKING.json' -o -name 'TRACK_A_MODE_TRACKING.md' -o -name 'all40_global_one_to_one_tracking.csv' -o -name 'mac_matrix.csv' \) -exec cp {} release_package/tracking/ \; # Preserve global one-to-one tracking evidence.
          find complete_evidence -type f \( -name 'RECOVERY_AUDIT.json' -o -name 'RECOVERY_AUDIT.md' -o -name 'ARTIFACT_PROVENANCE.json' \) -exec cp {} release_package/audit/ \; # Preserve structural recovery and source provenance.
          printf 'This package records a target-blind old-ANSYS/APDL-style forward reconstruction on the complete C3 entity model.\nNo SPRING1 or SPRING2 surrogate from the rejected diagnostic branch is included.\nMode labels are assigned by global one-to-one MAC on common observation DOFs; the natural first-fourteen solver order is retained separately.\n' > release_package/README.txt # Record the package interpretation and evidence boundary.
          find release_package -type f -print0 | sort -z | xargs -0 sha256sum > release_package/SHA256SUMS.txt # Hash every exact package file.
          tar -C release_package -czf C3_TrackA_explicit_forward_complete.tar.gz . # Create one compressed complete reproducibility archive.
          sha256sum C3_TrackA_explicit_forward_complete.tar.gz > C3_TrackA_explicit_forward_complete.tar.gz.sha256 # Hash the final archive.
      - name: Publish or update the immutable Track A release # Upload the complete archive and compact evidence files.
        shell: bash # Execute deterministic GitHub CLI commands.
        env: # Provide the release token to GitHub CLI.
          GH_TOKEN: ${{ github.token }} # Authorize release creation and asset upload.
        run: | # Create the stable release or replace assets from the same reconstruction.
          set -euxo pipefail # Stop on command, variable, or pipeline errors.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release upload "$RELEASE_TAG" C3_TrackA_explicit_forward_complete.tar.gz C3_TrackA_explicit_forward_complete.tar.gz.sha256 release_package/tracking/TRACK_A_MODE_TRACKING.json release_package/tracking/TRACK_A_MODE_TRACKING.md release_package/tracking/all40_global_one_to_one_tracking.csv release_package/audit/RECOVERY_AUDIT.json release_package/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"; else gh release create "$RELEASE_TAG" C3_TrackA_explicit_forward_complete.tar.gz C3_TrackA_explicit_forward_complete.tar.gz.sha256 release_package/tracking/TRACK_A_MODE_TRACKING.json release_package/tracking/TRACK_A_MODE_TRACKING.md release_package/tracking/all40_global_one_to_one_tracking.csv release_package/audit/RECOVERY_AUDIT.json release_package/SHA256SUMS.txt --title 'C3 Track A 显式高位 master 正向复现证据' --notes-file release_package/README.txt --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"; fi # Create once or replace assets without changing modeling content.
