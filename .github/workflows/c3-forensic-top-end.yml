# Test tower/downpull ROTX added to the gate-top cleanup case. Hypothesis only; not undisclosed human APDL.
name: C3 forensic gate-top plus tower-end matrix
# Trigger only when this preregistered diagnostic workflow changes.
on:
  # Start from a branch push.
  push:
    # Restrict execution to the exact binary-evidence branch.
    branches:
      # Use the branch rooted at the frozen C3 state.
      - agent/c3-forensic-binary-20260831
    # Ignore unrelated repository changes.
    paths:
      # Admit only this workflow definition.
      - .github/workflows/c3-forensic-top-end.yml
# Keep the diagnostic read-only because all daughters are uploaded as artifacts.
permissions:
  # Permit checkout of the immutable repository snapshot.
  contents: read
# Define the discrete end-master ROTX scope matrix. Not human APDL.
jobs:
  # Build and solve one complete C3 daughter per natural topology scope.
  solve:
    # Use the validated C3 runner generation.
    runs-on: ubuntu-24.04
    # Bound every complete sparse eigensolve.
    timeout-minutes: 90
    # Freeze exact source identities and deterministic runtime controls.
    env:
      # Locate the exact parser-safe C3 parent fragments.
      C3_PARTS: catwalk-fem/c0-c5-reproduction/release_parts/c3_ft14
      # Locate the validated custom solver fragments.
      CCX_PARTS: catwalk-fem/c0-c5-reproduction/release_parts/ccx_ucor6_ucab3
      # Locate the exact binary target-blind builder.
      BUILDER_GZ: catwalk-fem/c0-c5-reproduction/forensic_wrong_model/final_inverse/build_human_error_variants.py.gz
      # Bind the exact C3 parent bytes.
      C3_SHA256: 667c504770b99d4a3c484a114e16bb7c048c883d3a004f3e10dd71536f33dc86
      # Bind the stamped builder source (human_apdl=false). Completed 14-case matrix at deaa326 used 651e1fd9.
      BUILDER_SHA256: e64269d7d3d9636ef6a6df895652c092cca8f85909c401c00a54d954cd2a3218
      # Bind the stamped binary builder stream. Completed 14-case matrix at deaa326 used 18c7ed76.
      BUILDER_GZ_SHA256: a91306948c8148598cf551136e8cc3cfbd6fb6dd788cc5f9782f549ff135b0de
      # Bind the validated custom CalculiX executable.
      CCX_SHA256: b498dad80b0415d53ab112409adc85b8a1fd19eb7846dc31e778f4c83b437a0e
      # Keep sparse factorization deterministic and memory bounded.
      OMP_NUM_THREADS: "1"
    # Preserve all symmetric and asymmetric diagnostic cases independently.
    strategy:
      # Do not cancel remaining cases after one failure.
      fail-fast: false
      # Run the four complete-model probes concurrently.
      max-parallel: 4
      # Enumerate the topology scopes before any attachment target frequency is read.
      matrix:
        # Use explicit rows so the parent gate-top operation and end-node scope are auditable.
        include:
          # Isolate the four active tower/downpull master ROTX constraints without gate-top cleanup.
          - case: END4_ONLY
            # Generate the unchanged forty-root C3 parent before adding the end constraints.
            parent_case: BASE40
            # Select all four active tower/downpull masters.
            end_scope: END4
          # Add the four active tower/downpull masters to the strongest gate-top cleanup candidate.
          - case: TOP_PLUS_END4
            # Generate the all-gate-top ROTX cleanup daughter first.
            parent_case: ROT_ALL_GATE_TOP
            # Select all four active tower/downpull masters.
            end_scope: END4
          # Test the left tower/downpull pair to expose any unintended asymmetry.
          - case: TOP_PLUS_LEFT2
            # Generate the all-gate-top ROTX cleanup daughter first.
            parent_case: ROT_ALL_GATE_TOP
            # Select the two active left-side tower/downpull masters.
            end_scope: LEFT2
          # Test the right tower/downpull pair as the geometric mirror control.
          - case: TOP_PLUS_RIGHT2
            # Generate the all-gate-top ROTX cleanup daughter first.
            parent_case: ROT_ALL_GATE_TOP
            # Select the two active right-side tower/downpull masters.
            end_scope: RIGHT2
    # Execute exact reconstruction, generation, discrete end-master insertion, solution, and collection.
    steps:
      # Check out exactly the commit that triggered the diagnostic matrix.
      - name: Checkout immutable binary evidence snapshot
        # Use GitHub's maintained checkout action.
        uses: actions/checkout@v4
        # Pin the immutable trigger state and discard write credentials.
        with:
          # Use the exact workflow commit.
          ref: ${{ github.sha }}
          # Fetch one repository snapshot only.
          fetch-depth: 1
          # Disable retained write credentials.
          persist-credentials: false
      # Reconstruct and verify the exact parent, builder, and solver.
      - name: Reconstruct verified parent builder and solver
        # Execute strict Bash commands.
        shell: bash
        # Decode every immutable repository stream.
        run: |
          # Stop on every error, unset variable, or failed pipeline component.
          set -euxo pipefail
          # Create isolated working and evidence directories.
          mkdir -p run results
          # Reconstruct the exact validated C3 parent input.
          cat "$C3_PARTS"/*.inp.gz.part* | gzip -dc > run/source.inp
          # Reject any parent differing by one byte from the validated identity.
          printf '%s  %s\n' "$C3_SHA256" run/source.inp | sha256sum -c - | tee results/parent-check.txt
          # Reject any archived builder differing from the validated gzip identity.
          printf '%s  %s\n' "$BUILDER_GZ_SHA256" "$BUILDER_GZ" | sha256sum -c - | tee results/builder-gzip-check.txt
          # Decompress the exact line-commented target-blind builder.
          gzip -dc "$BUILDER_GZ" > run/build_human_error_variants.py
          # Reject any source differing from the validated Python identity.
          printf '%s  %s\n' "$BUILDER_SHA256" run/build_human_error_variants.py | sha256sum -c - | tee results/builder-source-check.txt
          # Reject a syntactically invalid reconstructed builder.
          python3 -m py_compile run/build_human_error_variants.py 2>&1 | tee results/builder-compile.txt
          # Reconstruct the validated custom CalculiX executable.
          cat "$CCX_PARTS"/part*.b64 | base64 -d | gzip -dc > run/ccx
          # Mark the reconstructed solver executable.
          chmod +x run/ccx
          # Reject any solver differing from the validated executable identity.
          printf '%s  %s\n' "$CCX_SHA256" run/ccx | sha256sum -c - | tee results/solver-check.txt
      # Install the native runtime used by the validated C3 calculation.
      - name: Install validated solver runtime
        # Execute package installation under Bash.
        shell: bash
        # Install BLAS, LAPACK, and the GNU Fortran runtime.
        run: sudo apt-get update && sudo apt-get install -y liblapack3 libblas3 libgfortran5
      # Generate the preregistered full-C3 parent daughter and add a natural end-master scope.
      - name: Build gate-top and end-master daughter
        # Execute strict Bash generation commands.
        shell: bash
        # Preserve every construction identity and inserted node label.
        run: |
          # Stop on every generation or invariant failure.
          set -euxo pipefail
          # Generate the target-blind forty-root parent case without attachment frequencies.
          python3 run/build_human_error_variants.py --source run/source.inp --output run/pre_end.inp --case "${{ matrix.parent_case }}" --roots 40 | tee results/build-parent.log
          # Select the natural active end-master labels from the preregistered topology scope.
          case "${{ matrix.end_scope }}" in
            # Select all four active tower/downpull masters.
            END4) END_NODES="79454 79456 79458 79460" ;;
            # Select the two active left tower/downpull masters.
            LEFT2) END_NODES="79454 79456" ;;
            # Select the two active right tower/downpull masters.
            RIGHT2) END_NODES="79458 79460" ;;
            # Reject any unregistered scope.
            *) exit 64 ;;
          esac
          # Record the exact natural end-master scope before modifying the daughter.
          printf 'case=%s\nparent_case=%s\nend_scope=%s\nend_nodes=%s\ntarget_frequencies_read=false\nfrequency_reproduced=false\nhuman_apdl=false\nnot_attach_ta1=true\nnot_undisclosed_human_apdl=true\n' "${{ matrix.case }}" "${{ matrix.parent_case }}" "${{ matrix.end_scope }}" "$END_NODES" > results/end-scope.txt
          # Insert one additional ROTX cleanup block immediately before the modal step.
          awk -v nodes="$END_NODES" -v case_name="${{ matrix.case }}" '
            # Split the preregistered space-delimited end-node scope before reading the input.
            BEGIN { count = split(nodes, selected, " "); inserted = 0 }
            # Insert the end-master ROTX cleanup exactly once before the first step.
            /^\*STEP/ && inserted == 0 {
              # Document the discrete extension. Hypothesis only; not recovered human APDL.
              print "** FORWARD PROBE: ACTIVE TOWER/DOWNPULL MASTER ROTX CLEANUP; CASE=" case_name "; frequency_reproduced=false"
              # Start one explicit boundary block.
              print "*BOUNDARY"
              # Emit one global longitudinal-rotation constraint per selected active end master.
              for (idx = 1; idx <= count; idx++) print selected[idx] ", 4, 4, 0."
              # Prevent duplicate insertion at later steps.
              inserted = 1
            }
            # Preserve every original parent-daughter line byte-for-byte apart from newline normalization.
            { print }
            # Reject a parent daughter without a modal step.
            END { if (inserted != 1) exit 65 }
          ' run/pre_end.inp > run/job.inp
          # Preserve the generated parent-daughter and final daughter identities.
          sha256sum run/pre_end.inp run/job.inp > results/daughter-sha256.txt
          # Preserve the target-blind parent construction receipt.
          cp run/pre_end.inp.receipt.json results/
      # Solve forty modes on the complete physical daughter.
      - name: Solve forty full-C3 modes
        # Preserve the native solver status through tee.
        shell: bash
        # Execute the validated custom kernel.
        run: |
          # Propagate every pipeline failure.
          set -o pipefail
          # Enter the isolated CalculiX working directory.
          cd run
          # Execute the complete sparse eigensolve and preserve resource statistics.
          /usr/bin/time -v ./ccx job 2>&1 | tee job.stdout.txt
          # Preserve the native solver exit status.
          echo "${PIPESTATUS[0]}" > job.exit
          # Return the native status to GitHub Actions.
          exit "$(cat job.exit)"
      # Collect complete evidence for every successful or failed case.
      - name: Collect gate-top and end-master evidence
        # Execute after every prior outcome.
        if: always()
        # Use strict Bash with explicit tolerance for files absent after a failure.
        shell: bash
        # Stage all reproducibility and native solver records.
        run: |
          # Stop on unexpected collection errors.
          set -euxo pipefail
          # Preserve the complete intermediate and final C3 inputs when generated.
          cp -a run/pre_end.inp run/job.inp results/ 2>/dev/null || true
          # Preserve the parent construction receipt when generated.
          cp -a run/pre_end.inp.receipt.json results/ 2>/dev/null || true
          # Preserve native modal, shape, convergence, status, log, and exit files.
          cp -a run/job.dat run/job.frd run/job.cvg run/job.sta run/job.stdout.txt run/job.exit results/ 2>/dev/null || true
          # Extract the complete eigenvalue-output block for rapid inspection.
          awk '/E I G E N V A L U E   O U T P U T/{take=1} take{print}' run/job.dat > results/modal-table.txt 2>/dev/null || true
          # Bind every collected artifact to an exact digest.
          sha256sum results/* > results/SHA256SUMS.txt 2>/dev/null || true
      # Upload one independent evidence package per natural scope.
      - name: Upload gate-top and end-master case evidence
        # Upload after every outcome.
        if: always()
        # Use GitHub's maintained artifact uploader.
        uses: actions/upload-artifact@v4
        # Preserve the complete evidence directory.
        with:
          # Encode the case and run identifier in the artifact name.
          name: c3-top-end-${{ matrix.case }}-${{ github.run_id }}
          # Upload all staged evidence.
          path: results/
          # Reject an empty package.
          if-no-files-found: error
          # Retain the forensic evidence for ninety days.
          retention-days: 90
          # Compress the large ASCII daughter efficiently.
          compression-level: 9
