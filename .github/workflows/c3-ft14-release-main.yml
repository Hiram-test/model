name: Publish C3 FT14 deck release once # Publish the exact C3 deck from the dedicated feature branch.
on: # Trigger only when this one-shot workflow is committed to the default branch.
  push: # Use a default-branch push so GitHub registers and executes the workflow.
    branches: [main] # Restrict execution to the repository default branch.
    paths: [".github/workflows/c3-ft14-release-main.yml"] # Ignore every unrelated main-branch change.
permissions: # Grant only the repository permission required for a release.
  contents: write # Permit tag, release, and asset creation.
jobs: # Define one bounded publication job.
  publish: # Reconstruct, verify, and release the exact deck.
    runs-on: ubuntu-22.04 # Pull a clean GitHub-hosted runner.
    timeout-minutes: 15 # Bound checkout, reconstruction, and upload time.
    env: # Freeze release identifiers and paths.
      TAG: c3-ft14-parser-safe-667c5047 # Use the content-addressed release tag.
      PARTS: catwalk-fem/c0-c5-reproduction/release_parts/c3_ft14 # Select the seven committed gzip parts.
      CCX_PARTS: catwalk-fem/c0-c5-reproduction/release_parts/ccx_ucor6_ucab3 # Select the frozen FT14 solver package.
      DECK: release/C3-UB-FT14-PARSER-SAFE_m14_667c504770b99d4a.inp # Restore the exact requested filename.
      CCX: release/ccx-2.23-UCOR6-UCAB3-FT14-linux-x86_64 # Name the exact custom executable explicitly.
      EXPECTED_SHA256: 667c504770b99d4a3c484a114e16bb7c048c883d3a004f3e10dd71536f33dc86 # Freeze the authoritative deck identity.
      EXPECTED_CCX_SHA256: b498dad80b0415d53ab112409adc85b8a1fd19eb7846dc31e778f4c83b437a0e # Freeze the executable used by the completed FT14 run.
    steps: # Execute checkout, reconstruction, verification, artifact retention, and publication.
      - name: Checkout C3 release parts # Pull the exact feature-branch package.
        uses: actions/checkout@v4 # Use the maintained checkout action.
        with: # Pin the source branch explicitly.
          ref: feat/catwalk-c0-c5-physical-reproduction # Read the branch containing all seven parts.
          fetch-depth: 1 # Fetch only its current head.
          persist-credentials: false # Keep the numerical package checkout read-only.
      - name: Reconstruct and verify exact deck # Join ordered parts and reject identity drift.
        shell: bash # Use strict Bash pipeline semantics.
        run: set -euxo pipefail; mkdir -p release; cat "$PARTS"/*.inp.gz.part* | gzip -dc > "$DECK"; printf '%s  %s\n' "$EXPECTED_SHA256" "$DECK" | sha256sum -c -; sha256sum "$DECK" > "$DECK.sha256"; test "$(stat -c %s "$DECK")" = 26839638 # Recreate and verify all 26,839,638 bytes.
      - name: Reconstruct custom CalculiX ccx # Restore the exact UCOR6 plus UCAB3 eigen-shift executable used for FT14.
        shell: bash # Decode, decompress, and verify the immutable custom solver.
        run: set -euxo pipefail; cat "$CCX_PARTS"/part*.b64 | base64 -d | gzip -dc > "$CCX"; chmod +x "$CCX"; printf '%s  %s\n' "$EXPECTED_CCX_SHA256" "$CCX" | sha256sum -c -; sha256sum "$CCX" > "$CCX.sha256"; ldd "$CCX" > release/ccx-runtime-dependencies.txt
      - name: Upload runner artifact # Retain the reconstructed input for immediate downstream use.
        uses: actions/upload-artifact@v4 # Upload the exact input and checksum.
        with: # Bind the artifact contract.
          name: C3-UB-FT14-PARSER-SAFE-m14-667c5047 # Use a stable searchable artifact name.
          path: release/ # Include the original input and SHA sidecar.
          if-no-files-found: error # Reject missing output.
          retention-days: 90 # Keep the runner artifact for downstream solves.
          compression-level: 6 # Compress the large text asset during transfer.
      - name: Create GitHub Release # Publish the original input filename and checksum sidecar.
        env: # Expose only the workflow-scoped repository token.
          GH_TOKEN: ${{ github.token }} # Authenticate same-repository release publication.
        shell: bash # Use GitHub CLI for release creation.
        run: gh release delete-asset "$TAG" ccx-linux-x86_64 --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true; gh release delete-asset "$TAG" ccx-linux-x86_64.sha256 --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true; gh release delete-asset "$TAG" ccx-version.txt --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true; if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release upload "$TAG" "$DECK" "$DECK.sha256" "$CCX" "$CCX.sha256" release/ccx-runtime-dependencies.txt --clobber --repo "$GITHUB_REPOSITORY"; else gh release create "$TAG" "$DECK" "$DECK.sha256" "$CCX" "$CCX.sha256" release/ccx-runtime-dependencies.txt --target feat/catwalk-c0-c5-physical-reproduction --title "C3 FT14 parser-safe CalculiX deck" --notes "Exact C3 FT14 deck plus the bound CalculiX 2.23 UCOR6+UCAB3 custom solver with symmetric shift -0.001. Deck SHA-256 667c504770b99d4a3c484a114e16bb7c048c883d3a004f3e10dd71536f33dc86; solver SHA-256 b498dad80b0415d53ab112409adc85b8a1fd19eb7846dc31e778f4c83b437a0e." --repo "$GITHUB_REPOSITORY"; fi # Remove the misleading stock binary and publish the exact FT14 solver.
