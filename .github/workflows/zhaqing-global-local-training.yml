          path: results/full_training_20261026/training/ # Preserve its source and data identities.
      - run: python automation/zhaqing_global_local/campaign/run.py evaluate # Report all channel errors, worst histories and constant-initial-state comparisons.
      - uses: actions/upload-artifact@v4 # Publish complete numerical predictions and actual independent error tables.
        if: always() # Preserve test failures rather than declaring training alone sufficient.
        with: # Keep held-out evaluation artifacts independent from optimization.
          name: global-independent-test # This is a test execution result, not automatic engineering acceptance.
          path: results/full_training_20261026/independent_test/ # Retain complete cold-rollout outputs and scope.
          if-no-files-found: error # Missing test evidence is a failed publication.
          compression-level: 0 # Do not recompress numeric HDF5 output.
          retention-days: 30 # Preserve results for review and scientific comparison.
  status: # Publish a concise truthful summary even when a native or training job fails.
    needs: [prepare, validation, global-reference, local-reference, assemble, train-4, train-8, train-12, train-16, train-20, train-24, train-28, train-32, train-36, train-40, train-44, train-48, train-52, train-56, train-60, train-64, train-68, train-72, train-76, train-80, train-84, train-88, train-92, train-96, train-100, train-104, train-108, train-112, train-116, train-120, train-124, train-128, train-132, train-136, train-140, train-144, train-148, train-152, train-156, train-160, train-164, train-168, train-172, train-176, train-180, train-184, train-188, train-192, train-196, train-200, train-204, train-208, train-212, train-216, train-220, train-224, train-228, train-232, train-236, train-240, train-244, train-248, train-252, train-256, train-260, train-264, train-268, train-272, train-276, train-280, train-284, train-288, train-292, train-296, train-300, independent-test] # Observe every required stage explicitly.
    if: always() # Failed native references must remain visible at workflow level.
    runs-on: ubuntu-24.04 # This final job only writes the workflow's own status summary.
    steps: # Never turn a missing local training pipeline into a complete result.
      - name: Record actual stage outcomes # Keep numerical completion distinct from prediction accuracy.
        env: # Pass validated GitHub job outcomes as data rather than executable expressions.
          MODE: ${{ needs.prepare.outputs.mode }} # Report whether this run prepares references or executes learning.
          VALIDATION: ${{ needs.validation.result }} # Report implementation checks separately from bridge reference generation.
          GLOBAL_NATIVE: ${{ needs.global-reference.result }} # State whether all ten detailed native histories completed.
          LOCAL_NATIVE: ${{ needs.local-reference.result }} # State the all-wire native attempt's actual job result.
          TRAINING: ${{ needs.train-300.result }} # A successful final stage enforces actual 300 completed epochs.
          TEST: ${{ needs.independent-test.result }} # Record independent test execution separately.
        run: | # Append only this workflow's own inspectable status, never a person-directed message.
          printf 'Execution mode: %s\n\n' "$MODE" >> "$GITHUB_STEP_SUMMARY" # State whether optimization was requested in this run.
          printf 'Implementation/interface validation: %s\n\n' "$VALIDATION" >> "$GITHUB_STEP_SUMMARY" # Report actual software assertions without implying any training progress.
          printf 'Global native histories: %s\n\n' "$GLOBAL_NATIVE" >> "$GITHUB_STEP_SUMMARY" # Report actual global reference status.
          printf 'Explicit 283-wire native attempt: %s\n\n' "$LOCAL_NATIVE" >> "$GITHUB_STEP_SUMMARY" # Report actual local reference status.
          printf 'Global 300-epoch training: %s\n\n' "$TRAINING" >> "$GITHUB_STEP_SUMMARY" # Do not infer optimization progress from queued jobs.
          printf 'Independent global test execution: %s\n\n' "$TEST" >> "$GITHUB_STEP_SUMMARY" # Testing execution does not certify engineering accuracy.
          printf 'Local operator training remains blocked until complete contact-cycle qualification and independent local histories exist.\n' >> "$GITHUB_STEP_SUMMARY" # Preserve the genuine unfinished local-learning requirement.

