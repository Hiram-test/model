name: Zhaqing validation and gated full training # Distinguish implementation checks from native references and optimization.
on: # Trigger only authorized repository work.
  push: # Start on committed changes rather than an ephemeral chat process.
    branches: [codex/complex-fullfield-v2-20261025] # Preserve the existing development branch.
    paths: # Avoid launching expensive jobs for unrelated repository edits.
      - 'automation/zhaqing_global_local/**' # Include source, frozen configuration and input assets.
      - '.github/workflows/zhaqing-global-local-training.yml' # Include changes to this actual execution pipeline.
      - '.github/workflows/zhaqing-train-segment.yml' # Include the concrete full-history continuation runner.
  workflow_dispatch: # Permit a deliberate rerun of the same published experiment.
permissions: # Keep the numerical workflow read-only with respect to the repository.
  contents: read # Checkout source without authorizing commits or releases.
  actions: read # Download this run's immutable intermediate artifacts.
concurrency: # Preserve active long jobs when another source revision is pushed.
  group: zhaqing-full-training-${{ github.ref }} # Serialize complete campaigns on the same branch.
  cancel-in-progress: false # Do not discard previously completed finite-element work.
env: # Bound native and neural runtime resource use consistently.
  OMP_NUM_THREADS: '2' # Limit OpenMP teams inside each hosted runner.
  OPENBLAS_NUM_THREADS: '2' # Avoid nested dense-library oversubscription.
  MKL_NUM_THREADS: '2' # Keep CPU neural operations within their documented budget.
  MPIR_CVAR_CH3_NETWORK_IFACE: lo # Give OpenSees an available local MPI interface.
  MPICH_INTERFACE_HOSTNAME: 127.0.0.1 # Avoid hosted network-interface ambiguity.
  PYTHONUNBUFFERED: '1' # Flush actual progress records immediately.
jobs: # Keep native reference generation, data admission and learning as separate gates.
  prepare: # Read execution routing without changing the scientific experiment.
    runs-on: ubuntu-24.04 # Use a lightweight read-only routing job.
    outputs: # Expose only validated local experiment routing values.
      mode: ${{ steps.route.outputs.mode }} # Separate native reference preparation from later full training.
      reference_run_id: ${{ steps.route.outputs.reference_run_id }} # Reuse one concrete native workflow instead of regenerating its histories.
    steps: # Read the checked-in launch configuration at the triggering revision.
      - uses: actions/checkout@v4 # Fetch the immutable experiment source.
        with: # Keep all jobs read-only.
          persist-credentials: false # No repository write credentials are needed.
      - id: route # Publish validated run-selection data.
        run: python3 automation/zhaqing_global_local/campaign/run.py launch # Validate software-only routing and reject training without a concrete reference workflow ID.
  validation: # Run bounded source and interface checks while physical references remain unqualified.
    needs: prepare # Require the explicitly selected software-validation mode.
    if: needs.prepare.outputs.mode == 'validation' # Do not start native FEM or real-bridge optimization in this mode.
    runs-on: ubuntu-24.04 # Measure the actual hosted environment without assuming its resources.
    timeout-minutes: 30 # Bound dependency installation and eight inexpensive implementation suites.
    steps: # Preserve test logs and the dated unresolved physical blockers separately.
      - uses: actions/checkout@v4 # Fetch the exact triggering source and authenticated baseline input asset.
        with: # Keep implementation checks read-only on GitHub.
          persist-credentials: false # No repository writes are performed by these tests.
      - uses: actions/setup-python@v5 # Select the same interpreter ABI used by native and learning stages.
        with: # Keep numerical interface compatibility explicit.
          python-version: '3.12' # Match the locally exercised implementation.
      - run: python -m pip install --no-cache-dir numpy==2.3.5 scipy==1.17.0 h5py==3.16.0 PyYAML==6.0.3 # Install mathematical, exact-storage and workflow-parser dependencies.
      - run: python -m pip install --no-cache-dir torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu # Exercise the actual CPU integral-operator implementation on analytic unit fixtures only.
      - name: Verify implementation and report physical blockers # Passing this job does not mean bridge training or reference qualification.
        run: python automation/zhaqing_global_local/campaign/run.py validate # Run the actual bounded suites and write source identities, resources and dated blockers.
      - uses: actions/upload-artifact@v4 # Preserve every actual suite log and the explicit no-training report.
        if: always() # Keep failing assertions and partial validation evidence visible.
        with: # Use a name that cannot be mistaken for trained weights or native field data.
          name: implementation-validation-not-bridge-training # State the exact limited scientific scope.
          path: "results/full_training_20261026/implementation_validation/\nresults/full_training_20261026/stage_failures/" # Include completed reports and orchestration failures without unrelated native fields.
          if-no-files-found: error # Missing validation evidence is a publication failure.
          retention-days: 30 # Retain reproducible test and unresolved-blocker evidence.
  global-reference: # Generate each complete independent detailed bridge history.
    needs: prepare # Require a valid published launch contract.
    if: needs.prepare.outputs.mode == 'references' # Do not repeat expensive FEM when continuing an existing training campaign.
    runs-on: ubuntu-24.04 # Public repository standard runners provide 16 GB RAM.
    timeout-minutes: 360 # Leave artifact publication outside the bounded native subprocess.
    strategy: # Preserve every failed case without cancelling independent cases.
      fail-fast: false # One nonconverged history does not erase other native evidence.
      max-parallel: 10 # Run all predefined independent histories concurrently when capacity permits.
      matrix: # Freeze six training, two validation and two test realizations.
        case-id: [train_wind_01, train_wind_02, train_wind_03, train_wind_04, train_wind_05, train_wind_06, validation_wind_01, validation_wind_02, test_wind_01, test_wind_02] # Never split windows from one realization across partitions.
    steps: # Execute genuine model solving before any learned approximation.
      - uses: actions/checkout@v4 # Fetch the exact triggering source revision.
        with: # Keep workflow credentials out of solver subprocesses.
          persist-credentials: false # Numerical jobs cannot push changes to the repository.
      - uses: actions/setup-python@v5 # Select one explicit interpreter family.
        with: # Preserve ABI consistency across native producer and training jobs.
          python-version: '3.12' # Match the locally verified numerical runtime.
      - run: bash automation/zhaqing_global_local/campaign/runner_space.sh # Free only unrelated tools on ephemeral hosted runners.
      - run: python -m pip install --no-cache-dir numpy==2.3.5 scipy==1.17.0 h5py==3.16.0 openseespy==3.8.0.0 # Install declared native and exact-field storage dependencies.
      - name: Solve all 3200 physical steps on the detailed full mesh # This is actual nonlinear FEM label generation.
        run: python automation/zhaqing_global_local/campaign/run.py global-case --case-id ${{ matrix.case-id }} # Reject incomplete, nonconverged or old-equivalent-deck histories.
      - name: Preserve complete native fields and failures # Keep every result even when later adaptation fails.
        if: always() # Native failures remain available instead of disappearing with the runner.
        uses: actions/upload-artifact@v4 # Store actual raw mesh, fields, inputs and numerical logs.
        with: # Isolate each independent native realization.
          name: global-native-${{ matrix.case-id }} # Match the provenance name in each standalone training case.
          path: results/full_training_20261026/global/${{ matrix.case-id }}/ # Preserve the complete native case directory.
          if-no-files-found: error # Missing evidence is a failed publication.
          compression-level: 0 # HDF5 is already losslessly compressed.
          retention-days: 30 # Keep the expensive native histories inspectable after this conversation.
      - run: python -m pip install --no-cache-dir torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu # Install only the CPU tensor dependency needed by the checked data adapter.
      - name: Export complete portable supervised fields # Keep all target nodes and time steps while storing audit channels separately.
        run: python automation/zhaqing_global_local/campaign/run.py adapt-case --case-id ${{ matrix.case-id }} # Require actual complete native hashes and frozen partitions.
      - uses: actions/upload-artifact@v4 # Publish only the independently portable per-history learning contract.
        with: # Preserve exact full-field values and source evidence.
          name: global-dataset-${{ matrix.case-id }} # Keep the case identity visible across hosted jobs.
          path: results/full_training_20261026/datasets/${{ matrix.case-id }}/ # Include targets, controls, geometry, graph and small numerical proof.
          if-no-files-found: error # Do not declare a prepared case without actual arrays.
          compression-level: 0 # Avoid recompressing already compressed HDF5 data.
          retention-days: 30 # Keep complete supervised histories available for repeat training.
  local-reference: # Attempt the actual all-wire nonlinear cycle independently of global learning.
    needs: prepare # Require a valid published launch contract.
    if: needs.prepare.outputs.mode == 'references' # Keep local reference attempts separate from later global learning.
    runs-on: ubuntu-24.04 # Retain the full nx16 mesh on a 16 GB public hosted runner.
    timeout-minutes: 360 # Preserve time for complete native evidence publication.
    steps: # No surrogate local labels are manufactured when the native cycle fails.
      - uses: actions/checkout@v4 # Fetch the same source revision as the global cases.
        with: # Keep repository credentials out of native process environments.
          persist-credentials: false # Do not grant native jobs write access.
      - uses: actions/setup-python@v5 # Select the explicit numerical interpreter.
        with: # Preserve package compatibility.
          python-version: '3.12' # Match the source model's validated Python ABI.
      - run: bash automation/zhaqing_global_local/campaign/runner_space.sh # Free unrelated hosted tooling without touching source or result data.
      - run: sudo apt-get update && sudo apt-get install -y calculix-ccx # Record the actual Ubuntu native solver rather than claiming the old precision-patched identity.
      - run: python -m pip install --no-cache-dir numpy==2.3.5 # Install only the quadratic geometry construction dependency.
      - name: Solve the complete 283-wire four-stage cycle # Single-wire success cannot satisfy this stage.
        run: python automation/zhaqing_global_local/campaign/run.py local-case # Require genuine native terminal increments and preserve unqualified local-training status.
      - uses: actions/upload-artifact@v4 # Preserve full native input, mesh, completion audit and failure evidence.
        if: always() # A resource or convergence failure remains a result to inspect.
        with: # Keep local fatigue qualification separate from whole-bridge training.
          name: local-explicit-283-reference # This artifact is a reference attempt, not trained local weights.
          path: results/full_training_20261026/local/explicit_283_wires/ # Include all native fields actually produced.
          if-no-files-found: error # Report absence of native evidence explicitly.
          compression-level: 1 # Compress textual native solver files without changing their contents.
          retention-days: 30 # Preserve the expensive explicit-wire attempt.
  assemble: # Admit the complete frozen global reference population.
    needs: [prepare, global-reference] # Require the current native population or an explicitly selected prior run.
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.mode == 'training' || needs.global-reference.result == 'success') # A training launch may reuse existing complete references without rerunning FEM.
    runs-on: ubuntu-24.04 # Use the same public runner memory and ABI.
    timeout-minutes: 120 # Bound artifact transport and exact hash verification.
    steps: # Merge only manifests while preserving all full-field files unchanged.
      - uses: actions/checkout@v4 # Fetch the same immutable source revision.
        with: # Keep this data-only job read-only.
          persist-credentials: false # No external write privileges are needed.
      - uses: actions/setup-python@v5 # Use the same lightweight orchestration runtime.
        with: # Preserve deterministic JSON behavior.
          python-version: '3.12' # Match all native and training stages.
      - run: bash automation/zhaqing_global_local/campaign/runner_space.sh # Prepare enough space for the whole supervised population.
      - uses: actions/download-artifact@v4 # Download only supervised fields, not duplicate native audit histories.
        with: # Preserve one deterministic directory per named artifact.
          github-token: ${{ github.token }} # Read only artifacts from the explicitly selected reference workflow.
          run-id: ${{ needs.prepare.outputs.reference_run_id || github.run_id }} # Default to current native results in reference mode.
          pattern: global-dataset-* # Select the ten producer-generated portable learning cases.
          path: results/full_training_20261026/datasets/ # Keep their relative evidence links valid.
          merge-multiple: false # Preserve all independent case namespaces.
      - run: python automation/zhaqing_global_local/campaign/run.py assemble # Enforce all 6/2/2 identities, hashes, duration and detailed geometry before learning.
      - uses: actions/upload-artifact@v4 # Publish only the merged portable manifest and its exact completion receipt.
        with: # Avoid storing a second copy of all multi-gigabyte arrays.
          name: global-dataset-contract # This is the immutable training experiment data contract.
          path: "results/full_training_20261026/datasets/dataset_manifest.json\nresults/full_training_20261026/datasets/dataset_ready.json" # Include only the common manifest and admission receipt.
          if-no-files-found: error # Missing admission evidence blocks all training.
          retention-days: 30 # Preserve the exact population contract with its field archives.
  train-4: # Complete true epochs 1 through 4 of the same 300-epoch experiment.
    needs: [prepare, assemble] # Require the previous genuine data or checkpoint gate.
    if: needs.prepare.outputs.mode == 'training' # Reference preparation alone does not start optimization.
    uses: ./.github/workflows/zhaqing-train-segment.yml # Reuse the exact full-history continuation implementation.
    with: # Preserve concrete counters and immutable data routing.
      target-epoch: 4 # Require this actual completed-epoch boundary.
