# Run target-blind thirteen-passage old-ANSYS master-cleanup variants on the complete released C3 entity model.
name: C3 TrackA main13 command-path variants # Agent-constructed 13-passage ROTX path; human_apdl=false; frequency_reproduced=false.
# Start only when this isolated workflow definition is committed on the Track A branch.
on: # Define the deterministic trigger.
  push: # Run after the workflow file is pushed.
    branches: [agent/c3-tracka-direct-main13-20260831] # Restrict execution to the isolated Track A branch.
    paths: [".github/workflows/c3-tracka-main13-human-forward.yml"] # Avoid unrelated workflow starts.
# Keep repository access read-only because all outputs are retained as Actions artifacts.
permissions: # Declare minimum token permissions.
  contents: read # Permit checkout of the immutable triggering commit.
# Define the parallel full-C3 passage-master solves.
jobs: # Hold the target-blind variant matrix.
  solve: # Reconstruct C3, select thirteen passage stations, apply one command, solve forty modes, and retain evidence.
    runs-on: ubuntu-24.04 # Match the validated custom CalculiX environment.
    timeout-minutes: 90 # Bound every independent full-model modal extraction.
    continue-on-error: true # Preserve other cases when one deliberately broad endpoint constraint conflicts.
    env: # Freeze every source identity and runtime control.
      C3_PARTS: catwalk-fem/c0-c5-reproduction/release_parts/c3_ft14 # Locate the exact released C3 input fragments.
      CCX_PARTS: catwalk-fem/c0-c5-reproduction/release_parts/ccx_ucor6_ucab3 # Locate the validated UCOR6 plus UCAB3 solver fragments.
      PATCH_PARTS: catwalk-fem/c0-c5-reproduction/forensic_wrong_model/c3_entity_patcher # Locate the common-observation patcher fragments.
      MAIN13_PARTS: catwalk-fem/c0-c5-reproduction/forensic_wrong_model/human_forward # Locate the bounded thirteen-passage generator stream.
      C3_SHA: 667c504770b99d4a3c484a114e16bb7c048c883d3a004f3e10dd71536f33dc86 # Lock the exact released C3 physical parent identity.
      C3_OBS_SHA: 50250d6f545a8f73854e77c1b132b36c2674724c09c99baca4c682de410a0c11 # Lock the unchanged forty-mode common-observation deck.
      CCX_SHA: b498dad80b0415d53ab112409adc85b8a1fd19eb7846dc31e778f4c83b437a0e # Lock the validated custom solver identity.
      MAIN13_SHA: 3eb672a33c761a653ae9a2b7cf661bde9c71f0796b06a46eea1bee23ebac5e68 # Lock the decoded thirteen-passage generator identity.
      OMP_NUM_THREADS: "1" # Keep sparse eigensolutions deterministic and memory-bounded.
    strategy: # Execute all discrete passage and endpoint operations independently.
      fail-fast: false # Preserve the complete matrix when one variant fails.
      max-parallel: 7 # Run all seven target-blind variants concurrently.
      matrix: # Define only command-level old-ANSYS operations with no fitted coefficient.
        variant: # Enumerate passage scope and endpoint cleanup candidates.
          - E1_MAIN13_ALL4_RX # Fix RX on all four high independent masters at each of thirteen passage stations.
          - E1_MAIN13_INNER_RX # Fix RX only on the two inner high masters at each passage station.
          - E1_MAIN13_OUTER_RX # Fix RX only on the two outer high masters at each passage station.
          - E1_MAIN13_ALL4_RX_END_HIGH_RX # Add the same copied RX cleanup at four high endpoint masters.
          - E1_MAIN13_ALL4_RX_END_HIGH_UZ # Add accidental endpoint vertical coupling to fixed tower or down-pull masters.
          - E1_MAIN13_ALL4_RX_END_HIGH_UY_UZ # Add accidental endpoint lateral and vertical coupling.
          - E1_MAIN13_ALL4_RX_END_HIGH_UXYZ # Add accidental full endpoint translation coupling while retaining rotations.
    steps: # Execute reconstruction, generation, solution, and evidence retention.
      - name: Checkout immutable thirteen-passage branch # Fetch the exact triggering snapshot.
        uses: actions/checkout@v4 # Use the maintained checkout action.
        with: # Make checkout behavior explicit.
          ref: ${{ github.sha }} # Bind the run to the triggering commit.
          fetch-depth: 1 # Fetch only the immutable snapshot.
          persist-credentials: false # Keep the checked-out repository read-only.
      - name: Reconstruct exact C3 observation deck main13 generator and solver # Restore all content-addressed inputs.
        shell: bash # Execute deterministic Bash commands.
        run: | # Run one strict reconstruction script.
          set -euxo pipefail # Stop on command variable or pipeline errors.
          mkdir -p run results # Create isolated working and evidence directories.
          cat "$C3_PARTS"/*.inp.gz.part* | gzip -dc > run/source.inp # Reconstruct the exact released C3 physical parent deck.
          printf '%s  %s\n' "$C3_SHA" run/source.inp | sha256sum -c - # Reject any released-parent identity drift.
          cat "$PATCH_PARTS"/patch_c3_entity_forensic.py.gz.b64.part* | base64 -d | gzip -dc > run/patch_c3_entity_forensic.py # Reconstruct the common-observation patcher.
          python3 -m py_compile run/patch_c3_entity_forensic.py # Reject a syntactically invalid observation patcher.
          python3 run/patch_c3_entity_forensic.py --source run/source.inp --output run/C3_baseline40_observation.inp --shared-scale 0.0 --end-scale 0.0 --mass-scale 0.0 --mass-scope main13 --roots 40 # Preserve C3 matrices while requesting forty roots on the frozen fifty-node basis.
          printf '%s  %s\n' "$C3_OBS_SHA" run/C3_baseline40_observation.inp | sha256sum -c - # Reject any unchanged-physics analysis-deck drift.
          cat "$MAIN13_PARTS"/build_legacy_tracka_main13_v1.py.gz.b64.part* | base64 -d | gzip -dc > run/build_legacy_tracka_main13.py # Reconstruct the fully commented thirteen-passage generator from bounded parts.
          printf '%s  %s\n' "$MAIN13_SHA" run/build_legacy_tracka_main13.py | sha256sum -c - # Reject any generator identity drift.
          python3 -m py_compile run/build_legacy_tracka_main13.py # Reject a syntactically invalid thirteen-passage generator.
          cat "$CCX_PARTS"/part*.b64 | base64 -d | gzip -dc > run/ccx # Reconstruct the validated custom CalculiX executable.
          chmod +x run/ccx # Make the reconstructed solver executable.
          printf '%s  %s\n' "$CCX_SHA" run/ccx | sha256sum -c - # Reject any solver identity drift.
      - name: Install validated solver runtime # Supply the numerical libraries required by the exact binary.
        shell: bash # Use Bash for package installation.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq liblapack3 libblas3 libgfortran5 # Install only BLAS LAPACK and GNU Fortran runtime libraries.
      - name: Build one complete target-blind thirteen-passage C3 daughter # Apply one discrete passage-master command path.
        shell: bash # Execute the fully commented generator under strict Bash control.
        run: | # Generate one full-size C3 daughter without reading attachment frequencies.
          set -euxo pipefail # Stop on every structural-selection or write invariant failure.
          python3 run/build_legacy_tracka_main13.py --source run/C3_baseline40_observation.inp --output run/job.inp --variant "${{ matrix.variant }}" # Apply the selected old-ANSYS operation to exact independent masters.
          cp run/job.inp results/ # Retain the complete generated full-C3 input deck.
          cp run/job.inp.receipt.json results/ # Retain the machine-readable model-construction receipt.
          sha256sum run/job.inp > results/job.inp.sha256 # Record the exact daughter input identity.
      - name: Solve forty modes on the complete thirteen-passage C3 daughter # Run the validated custom CalculiX binary.
        shell: bash # Preserve the native solver exit status through tee.
        run: | # Execute the generated daughter deck directly.
          set -o pipefail # Return a failed solver status to Actions.
          cd run # Enter the isolated CalculiX working directory.
          /usr/bin/time -v ./ccx job 2>&1 | tee job.stdout.txt # Solve forty full-model modes and capture complete native output.
          echo "${PIPESTATUS[0]}" > job.exit # Preserve the actual CalculiX exit code.
          grep -q "Job finished" job.stdout.txt # Reject any incomplete or aborted solve.
          test "$(cat job.exit)" = "0" # Require a zero native exit status.
      - name: Collect complete thirteen-passage forward evidence # Stage all available input and native solver outputs.
        if: always() # Preserve diagnostics for successful and failed broad endpoint variants.
        shell: bash # Use strict Bash copy and digest commands.
        run: | # Copy every available native artifact.
          set -euxo pipefail # Stop on unexpected collection errors.
          cp -a run/job.dat run/job.frd run/job.sta run/job.cvg run/job.stdout.txt run/job.exit results/ 2>/dev/null || true # Retain native CalculiX outputs when present.
          awk '/E I G E N V A L U E   O U T P U T/{take=1} take{print}' run/job.dat > results/modal-table.txt 2>/dev/null || true # Extract the forty-mode table for rapid inspection.
          printf 'variant=%s\nparent_c3_sha=%s\ncommon_observation_sha=%s\nsource_commit=%s\ntarget_conditioned=false\nfull_c3=true\nlow_dimensional=false\nroots=40\nmain_passage_station_count=13\nhuman_apdl=false\nfrequency_reproduced=false\nnot_attach_ta1=true\nnot_undisclosed_human_apdl=true\nsource=agent_constructed_legacy_command_path\n' "${{ matrix.variant }}" "$C3_SHA" "$C3_OBS_SHA" "${{ github.sha }}" > results/case.txt # Agent command path only; not human APDL and not attach TA1.
          sha256sum results/* > results/SHA256SUMS.txt 2>/dev/null || true # Record exact identities for all staged artifacts.
      - name: Upload one complete thirteen-passage C3 package # Publish the daughter and native evidence independently.
        if: always() # Retain evidence even when one endpoint variant exposes an overconstraint.
        uses: actions/upload-artifact@v4 # Store the package as a downloadable Actions artifact.
        with: # Configure stable naming and strict presence checks.
          name: C3-TrackA-main13-cmd-${{ matrix.variant }} # Identify the exact passage and endpoint agent operation.
          path: results/ # Upload complete inputs receipts and native outputs.
          if-no-files-found: error # Reject an empty evidence package.
          retention-days: 30 # Keep each package available for independent reruns.
          compression-level: 9 # Compress large ASCII decks efficiently.
