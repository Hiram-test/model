name: Catwalk Modal Branch Clean V2 (boundary)
on:
  push:
    branches: [feat/catwalk-inverse-formfinding-mct]
    paths:
      - 'catwalk-fem/inverse-formfinding-mct/solve_modal_branch_clean.py'
      - 'catwalk-fem/inverse-formfinding-mct/solve_modal_branch_clean_v2.py'
      - 'catwalk-fem/inverse-formfinding-mct/compare_modal_branch_clean_v2.py'
      - '.github/workflows/catwalk-modal-branch-clean-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib
      - name: Clean previous branch-clean results
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2
      - name: Recompute inverse state matrices eigenpairs and physical branches
        shell: bash
        run: |
          set -euxo pipefail
          python catwalk-fem/inverse-formfinding-mct/solve_modal_branch_clean_v2.py | tee modal_branch_clean_v2.log
      - name: Compare only after target-free freeze
        shell: bash
        run: |
          set -euxo pipefail
          python catwalk-fem/inverse-formfinding-mct/compare_modal_branch_clean_v2.py | tee comparison_branch_clean_v2.log
      - name: Verify complete recalculation outputs
        shell: bash
        run: |
          set -euxo pipefail
          test -s catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/frozen_results_branch_clean_v2.json
          test -s catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/raw_branch_modes.csv
          test -s catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/classified_14_modes_branch_clean.csv
          test -s catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/selected_mode_shapes.json
          test -s catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/comparison_after_freeze_branch_clean_v2.csv
          test -s catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/comparison_metrics_branch_clean_v2.json
          test -s catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/unstressed_lengths.json
          printf '%s\n' "$GITHUB_SHA" > catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/GITHUB_COMMIT.txt
          sha256sum catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/* > catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/SHA256SUMS_FINAL.txt
      - name: Preserve calculation protocol
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2
          cp -f modal_branch_clean_v2.log catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/solver.log || true
          cp -f comparison_branch_clean_v2.log catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/comparison.log || true
          cp -f catwalk-fem/inverse-formfinding-mct/case.txt catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/case.txt
          cp -f catwalk-fem/inverse-formfinding-mct/INVERSE_FORMFINDING.bound.md catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/BOUND.md
          printf '%s\n' \
            'frequency_reproduced=false' \
            'not_attach_ta1=true' \
            'not_ccx_job_finished=true' \
            'not_recovered_iniforce=true' \
            'inverse_force_verified=false' \
            'inverse_force_recomputed=true' \
            'mct_geometry_used=true' \
            'all_matrices_reassembled=true' \
            'all_eigenpairs_recomputed=true' \
            'fixed_harmonic_order_used_for_selection=false' \
            'harmonic_order_is_descriptor_only=true' \
            'floor_gantry_acoustic_branch_filter=true' \
            'target_frequency_used_in_solve=false' \
            'target_frequency_used_in_classification=false' \
            'comparison_after_freeze=true' \
            'ts2_n1_relabel_not_attach=true' \
            > catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/CASE_BOUND.txt
      - name: Upload complete recalculation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catwalk-modal-branch-clean-v2-boundary
          path: catwalk-fem/inverse-formfinding-mct/modal_results_branch_clean_v2/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
