# Recover the already-computed explicit high-master Track A run from repository Actions evidence.
name: Recover explicit C3 TrackA height run # Recovery-only; human_apdl=false; frequency_reproduced=false; 0.09956064 is not attach TA1.
on: # Define the deterministic workflow trigger.
  push: # Run when this workflow definition is committed.
    branches: [agent/c3-tracka-direct-main13-20260831] # Restrict execution to the isolated Track A branch.
    paths: [".github/workflows/c3-tracka-recover-explicit-height.yml"] # Avoid unrelated branch pushes.
permissions: # Declare the minimum repository permissions.
  contents: read # Permit checkout of immutable source fragments.
  actions: read # Permit enumeration and download of prior Actions artifacts.
jobs: # Define the single recovery job.
  recover: # Search, audit, select, and package the explicit Track run.
    runs-on: ubuntu-24.04 # Use the same runner generation as the validated C3 calculations.
    timeout-minutes: 90 # Bound artifact enumeration and recovery.
    env: # Freeze source identities and recovery-only fingerprints.
      C3_PARTS: catwalk-fem/c0-c5-reproduction/release_parts/c3_ft14 # Locate the exact released C3 parent fragments.
      C3_SHA: 667c504770b99d4a3c484a114e16bb7c048c883d3a004f3e10dd71536f33dc86 # Lock the exact C3 parent identity.
      RECOVERY_FREQ_1: "0.09956064" # Prior-run fingerprint only; NOT attach TA1 0.0996; frequency_reproduced=false.
      RECOVERY_FREQ_2: "0.1111595" # Identify the prior explicit full-height calculation without using attachment targets.
      RECOVERY_FREQ_3: "0.1636203" # Identify the prior explicit full-height calculation without using attachment targets.
    steps: # Execute the complete recovery chain.
      - name: Checkout immutable analysis branch # Fetch the exact triggering snapshot.
        uses: actions/checkout@v4 # Use the maintained checkout action.
        with: # Make checkout behavior explicit.
          ref: ${{ github.sha }} # Bind the run to the triggering commit.
          fetch-depth: 1 # Fetch only the immutable snapshot.
          persist-credentials: false # Keep repository contents read-only.
      - name: Reconstruct exact C3 parent # Restore and verify the released C3 deck.
        shell: bash # Execute deterministic Bash commands.
        run: | # Run strict reconstruction commands.
          set -euxo pipefail # Stop on command, variable, or pipeline errors.
          mkdir -p work/results work/downloads # Create isolated work and evidence directories.
          cat "$C3_PARTS"/*.inp.gz.part* | gzip -dc > work/C3_parent.inp # Reconstruct the exact full C3 parent deck.
          printf '%s  %s\n' "$C3_SHA" work/C3_parent.inp | sha256sum -c - # Reject any parent identity drift.
      - name: Enumerate and recover explicit Track A artifacts # Search prior workflow artifacts by structure rather than filename alone.
        shell: bash # Execute the line-commented recovery program.
        env: # Provide the Actions token only to the recovery process.
          GH_TOKEN: ${{ github.token }} # Authorize read-only Actions API requests.
          GH_REPOSITORY: ${{ github.repository }} # Bind the current repository identity.
        run: | # Emit and execute the deterministic recovery program.
          cat > work/recover.py <<'PY' # Write the complete recovery program.
          from __future__ import annotations  # Keep annotations deterministic on the runner Python version.
          from pathlib import Path  # Resolve repository and artifact paths without cwd assumptions.
          import io  # Hold downloaded ZIP archives in memory before extraction.
          import json  # Read GitHub metadata and write the machine-readable audit.
          import math  # Evaluate finite normalized frequency distances.
          import os  # Read the read-only GitHub token and frozen recovery fingerprints.
          import re  # Parse CalculiX keywords, equation bodies, and numeric output.
          import shutil  # Publish the selected candidate and native evidence.
          import urllib.request  # Call the GitHub REST API using the workflow token.
          import zipfile  # Inspect prior Actions artifact archives.
          ROOT = Path('work')  # Bind the isolated workflow working directory.
          DOWNLOADS = ROOT / 'downloads'  # Bind the artifact extraction root.
          RESULTS = ROOT / 'results'  # Bind the stable evidence output directory.
          PARENT = ROOT / 'C3_parent.inp'  # Bind the exact released C3 parent deck.
          TOKEN = os.environ['GH_TOKEN']  # Read the ephemeral read-only Actions token.
          REPOSITORY = os.environ['GH_REPOSITORY']  # Read the owner/name repository identity.
          SIGNATURE = tuple(float(os.environ[name]) for name in ('RECOVERY_FREQ_1', 'RECOVERY_FREQ_2', 'RECOVERY_FREQ_3'))  # Read prior forward-run frequencies used only for artifact recovery.
          KEYWORDS = ('track', 'height', 'h05', 'h0', 'h1', 'lever', 'mpc', 'master', 'c3', 'entity')  # Define broad artifact-name hints without assuming one historical name.
          def request_json(url: str) -> dict[str, object]:  # Fetch one GitHub REST JSON document.
              request = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})  # Build the authenticated read-only request.
              with urllib.request.urlopen(request, timeout=120) as response:  # Execute the bounded request.
                  return json.load(response)  # Decode and return the JSON document.
          def request_bytes(url: str) -> bytes:  # Download one Actions artifact archive.
              request = urllib.request.Request(url, headers={'Authorization': f'Bearer {TOKEN}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})  # Build the authenticated artifact request.
              with urllib.request.urlopen(request, timeout=300) as response:  # Follow the GitHub redirect and download bounded bytes.
                  return response.read()  # Return the complete ZIP archive bytes.
          def parse_model(path: Path) -> dict[str, object]:  # Parse node, element, spring, mass, and equation signatures from one CalculiX deck.
              nodes: set[int] = set()  # Collect explicitly defined node labels.
              elements: dict[int, tuple[str, tuple[int, ...]]] = {}  # Collect element types and connectivity.
              equations: list[list[tuple[int, int, float]]] = []  # Collect standard generated equation terms.
              lines = path.read_text(encoding='ascii', errors='ignore').splitlines()  # Decode the complete deck once.
              node_state = False  # Track a NODE block.
              element_type: str | None = None  # Track an ELEMENT block.
              index = 0  # Initialize line traversal.
              while index < len(lines):  # Traverse every model line.
                  line = lines[index].strip()  # Normalize surrounding whitespace.
                  upper = line.upper()  # Normalize keyword matching.
                  if not line or line.startswith('**'):  # Ignore blank and comment records.
                      index += 1  # Advance to the next record.
                      continue  # Continue traversal.
                  if upper.startswith('*'):  # Handle one keyword record.
                      node_state = upper == '*NODE' or upper.startswith('*NODE,')  # Select node-definition blocks only.
                      element_type = None  # Close a prior element block.
                      if upper.startswith('*ELEMENT,'):  # Parse an element header.
                          match = re.search(r'TYPE\s*=\s*([^,\s]+)', upper)  # Extract the element type.
                          element_type = match.group(1) if match else ''  # Preserve the normalized element type.
                      if upper == '*EQUATION' and index + 2 < len(lines):  # Parse one standard single-row equation block.
                          try:  # Convert malformed equation data into an empty lightweight signature.
                              count = int(lines[index + 1].strip().split(',')[0])  # Parse the declared term count.
                              fields = [field.strip() for field in lines[index + 2].split(',') if field.strip()]  # Parse the equation body fields.
                              terms = [(int(fields[3 * position]), int(fields[3 * position + 1]), float(fields[3 * position + 2])) for position in range(count)]  # Parse node, DOF, and coefficient triples.
                          except (ValueError, IndexError):  # Handle multiline or malformed equation cards conservatively.
                              terms = []  # Preserve an unparsed equation placeholder.
                          equations.append(terms)  # Store the equation signature.
                          index += 3  # Advance past the complete equation block.
                          node_state = False  # Close node state.
                          element_type = None  # Close element state.
                          continue  # Continue traversal after the equation.
                      index += 1  # Advance past the keyword.
                      continue  # Continue traversal.
                  if node_state:  # Parse one node row.
                      try:  # Parse the node label defensively.
                          nodes.add(int(line.split(',', 1)[0].strip()))  # Preserve the node label.
                      except ValueError:  # Ignore malformed node rows.
                          pass  # Keep recovery scanning non-destructive.
                  elif element_type is not None:  # Parse one element connectivity row.
                      try:  # Parse all integer fields defensively.
                          values = [int(field.strip()) for field in line.split(',') if field.strip()]  # Convert the element row.
                      except ValueError:  # Ignore malformed connectivity rows.
                          values = []  # Clear malformed data.
                      if values:  # Require an element label.
                          elements[values[0]] = (element_type, tuple(values[1:]))  # Preserve type and connectivity.
                  index += 1  # Advance to the next model line.
              nonunit = sum(bool(terms) and any(abs(abs(coefficient) - 1.0) > 1.0e-10 for _, _, coefficient in terms) for terms in equations)  # Count equations containing genuine lever coefficients.
              long_equations = sum(len(terms) >= 3 for terms in equations)  # Count multi-term rigid-kinematic equations.
              return {'nodes': nodes, 'elements': elements, 'equations': equations, 'nonunit': nonunit, 'long_equations': long_equations, 'text_upper': '\n'.join(lines).upper()}  # Return the compact model signature.
          def collect_frequency_values(directory: Path) -> list[float]:  # Collect plausible modal frequencies from native text outputs.
              values: list[float] = []  # Initialize the frequency-like value pool.
              for path in directory.rglob('*'):  # Traverse every extracted artifact file.
                  if not path.is_file() or path.suffix.lower() not in {'.dat', '.csv', '.json', '.txt', '.md', '.log'}:  # Restrict scanning to textual evidence.
                      continue  # Skip unrelated files.
                  if path.stat().st_size > 100_000_000:  # Bound recovery text scanning.
                      continue  # Skip oversized nonessential text files.
                  text = path.read_text(encoding='utf-8', errors='ignore')  # Decode recoverable text.
                  for token in re.findall(r'[-+]?(?:\d+\.\d*|\.\d+|\d+)(?:[EeDd][-+]?\d+)?', text):  # Extract numeric tokens.
                      try:  # Convert each token defensively.
                          value = float(token.replace('D', 'E').replace('d', 'e'))  # Parse Fortran-style exponents.
                      except ValueError:  # Ignore malformed numeric fragments.
                          continue  # Continue scanning.
                      if 0.02 <= value <= 0.5 and math.isfinite(value):  # Retain plausible catwalk modal frequencies.
                          values.append(value)  # Append the plausible value.
              return values  # Return all pooled values.
          parent = parse_model(PARENT)  # Parse the exact C3 parent once.
          runs: list[dict[str, object]] = []  # Accumulate recent workflow-run metadata.
          for page in range(1, 11):  # Read at most one thousand recent workflow runs.
              payload = request_json(f'https://api.github.com/repos/{REPOSITORY}/actions/runs?per_page=100&page={page}')  # Fetch one workflow-run page.
              page_runs = payload.get('workflow_runs', [])  # Select the run list.
              if not isinstance(page_runs, list) or not page_runs:  # Stop at the first empty page.
                  break  # Exit pagination.
              runs.extend(page_runs)  # Append the current page.
          artifact_records: list[dict[str, object]] = []  # Accumulate artifact metadata with parent run context.
          for run in runs:  # Traverse recent workflow runs.
              run_id = int(run['id'])  # Select the numeric run identity.
              artifacts_payload = request_json(f'https://api.github.com/repos/{REPOSITORY}/actions/runs/{run_id}/artifacts?per_page=100')  # Fetch run artifacts.
              artifacts = artifacts_payload.get('artifacts', [])  # Select the artifact list.
              if not isinstance(artifacts, list):  # Ignore malformed metadata.
                  continue  # Continue to the next run.
              for artifact in artifacts:  # Traverse each run artifact.
                  name = str(artifact.get('name', ''))  # Select the artifact name.
                  hint = any(keyword in name.lower() for keyword in KEYWORDS) or any(keyword in str(run.get('name', '')).lower() for keyword in KEYWORDS) or any(keyword in str(run.get('display_title', '')).lower() for keyword in KEYWORDS)  # Detect broad Track/C3 relevance.
                  if not hint:  # Avoid downloading unrelated repository artifacts.
                      continue  # Continue to the next artifact.
                  if bool(artifact.get('expired', False)):  # Skip expired artifacts.
                      continue  # Continue to the next artifact.
                  size = int(artifact.get('size_in_bytes', 0))  # Select compressed artifact size.
                  if size <= 0 or size > 800_000_000:  # Bound individual archive downloads.
                      continue  # Continue to the next artifact.
                  artifact_records.append({'artifact': artifact, 'run': run})  # Preserve artifact and run context.
          candidates: list[dict[str, object]] = []  # Accumulate explicit-model candidates.
          for position, record in enumerate(artifact_records[:240]):  # Bound recovery to the first 240 relevant artifacts.
              artifact = record['artifact']  # Select artifact metadata.
              artifact_id = int(artifact['id'])  # Select the numeric artifact identity.
              archive = request_bytes(f'https://api.github.com/repos/{REPOSITORY}/actions/artifacts/{artifact_id}/zip')  # Download the artifact archive.
              directory = DOWNLOADS / f'{position:03d}_{artifact_id}'  # Create a stable extraction directory.
              directory.mkdir(parents=True, exist_ok=True)  # Ensure the extraction directory exists.
              try:  # Extract only valid ZIP archives.
                  with zipfile.ZipFile(io.BytesIO(archive)) as handle:  # Open the in-memory archive.
                      handle.extractall(directory)  # Extract all evidence files.
              except zipfile.BadZipFile:  # Ignore malformed archives without stopping the search.
                  continue  # Continue to the next artifact.
              values = collect_frequency_values(directory)  # Collect native frequency-like values.
              nearest = [min(values, key=lambda value: abs(value - target)) if values else float('nan') for target in SIGNATURE]  # Select values nearest the prior explicit-run signature.
              frequency_error = sum(abs(value - target) / target for value, target in zip(nearest, SIGNATURE)) if values else 999.0  # Measure recovery-only signature error.
              for input_path in sorted(directory.rglob('*.inp'), key=lambda path: path.stat().st_size, reverse=True)[:12]:  # Audit a bounded set of largest complete input decks.
                  if input_path.stat().st_size < 20_000_000:  # Require a full-size C3 daughter rather than a scalar or reduced model.
                      continue  # Skip undersized input decks.
                  candidate = parse_model(input_path)  # Parse the candidate model signature.
                  new_nodes = candidate['nodes'] - parent['nodes']  # Identify candidate-added nodes.
                  new_element_ids = set(candidate['elements']) - set(parent['elements'])  # Identify candidate-added elements.
                  new_types: dict[str, int] = {}  # Initialize added element-type counts.
                  for element in new_element_ids:  # Traverse added element labels.
                      element_type = candidate['elements'][element][0]  # Select the added element type.
                      new_types[element_type] = new_types.get(element_type, 0) + 1  # Increment the added type count.
                  new_equations = len(candidate['equations']) - len(parent['equations'])  # Measure added equation cards.
                  new_nonunit = candidate['nonunit'] - parent['nonunit']  # Measure added lever-coefficient equations.
                  new_long = candidate['long_equations'] - parent['long_equations']  # Measure added multi-term equations.
                  spring_added = sum(count for element_type, count in new_types.items() if element_type.startswith('SPRING'))  # Count added spring elements.
                  axial_added = sum(count for element_type, count in new_types.items() if element_type in {'T3D2', 'UCAB3'})  # Count added LINK-type elements.
                  mass_added = sum(count for element_type, count in new_types.items() if element_type.startswith('MASS'))  # Count added MASS elements.
                  inverse_markers = [marker for marker in ('TARGET_CONDITIONED', 'FORENSIC_FIT', 'BACK_TUNED=TRUE', 'INVERSE_REACHABILITY') if marker in candidate['text_upper']]  # Detect target-conditioned provenance.
                  explicit = spring_added == 0 and 15 <= len(new_nodes) <= 80 and axial_added > 0 and new_equations > 0 and (new_nonunit > 0 or new_long > 0) and not inverse_markers  # Require a full explicit no-spring high-master daughter.
                  if not explicit:  # Reject non-Track surrogate structures.
                      continue  # Continue to the next input deck.
                  structure_distance = abs(len(new_nodes) - 30) / 30.0 + abs(axial_added - 15) / 15.0 + abs(new_equations - 90) / 90.0 + abs(mass_added - 26) / 26.0  # Measure distance from the documented Track A cardinalities.
                  candidates.append({'artifact_id': artifact_id, 'artifact_name': artifact.get('name'), 'run_id': record['run'].get('id'), 'workflow_name': record['run'].get('name'), 'display_title': record['run'].get('display_title'), 'head_sha': record['run'].get('head_sha'), 'input_path': str(input_path), 'directory': str(directory), 'nearest_signature_hz': nearest, 'frequency_error': frequency_error, 'new_node_count': len(new_nodes), 'new_element_types': new_types, 'new_equation_count': new_equations, 'new_nonunit_equations': new_nonunit, 'new_long_equations': new_long, 'mass_added': mass_added, 'structure_distance': structure_distance})  # Preserve the explicit candidate record.
          candidates.sort(key=lambda record: (float(record['structure_distance']), float(record['frequency_error']), int(record['artifact_id'])))  # Prefer documented Track cardinalities before recovery-frequency proximity.
          selection = candidates[0] if candidates else None  # Select the strongest explicit Track artifact.
          RESULTS.mkdir(parents=True, exist_ok=True)  # Ensure the evidence output directory exists.
          if selection is not None:  # Publish the complete selected run evidence.
              selected_directory = Path(str(selection['directory']))  # Bind the selected extraction directory.
              selected_input = Path(str(selection['input_path']))  # Bind the selected full C3 input deck.
              shutil.copy2(selected_input, RESULTS / 'C3_TrackA_explicit_high_master.inp')  # Preserve the exact selected model bytes.
              for path in selected_directory.rglob('*'):  # Traverse all selected artifact files.
                  if not path.is_file():  # Ignore directories.
                      continue  # Continue traversal.
                  if path.stat().st_size > 650_000_000:  # Bound copied evidence size.
                      continue  # Skip oversized nonessential files.
                  relative_name = '__'.join(path.relative_to(selected_directory).parts)  # Flatten nested artifact paths deterministically.
                  destination = RESULTS / relative_name  # Resolve the flattened evidence destination.
                  if destination.exists():  # Avoid accidental name collisions.
                      destination = RESULTS / f'{path.stem}_{len(list(RESULTS.iterdir()))}{path.suffix}'  # Create a deterministic collision-safe name.
                  shutil.copy2(path, destination)  # Preserve the selected native evidence.
          report = {'selection_found': selection is not None, 'selection': selection, 'candidate_count': len(candidates), 'artifact_count_considered': len(artifact_records), 'source_commit': os.environ.get('GITHUB_SHA'), 'recovery_frequencies_are_prior_forward_results_not_attachment_targets': True, 'candidates': candidates}  # Build the complete recovery audit.
          (RESULTS / 'RECOVERY_AUDIT.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')  # Publish the machine-readable recovery record.
          PY
          python work/recover.py # Execute the deterministic recovery program.
          sha256sum work/results/* > work/results/SHA256SUMS.txt 2>/dev/null || true # Record exact identities for all recovered evidence.
      - name: Stamp recovery evidence boundary # Record that fingerprint frequencies are not attach TA1.
        if: always() # Keep the bound even when artifact download fails.
        shell: bash # Write a small machine-readable bound.
        run: | # Persist the claim lock.
          mkdir -p work/results # Ensure the evidence directory exists after a failed recover.
          printf 'human_apdl=false\nfrequency_reproduced=false\nnot_attach_ta1=true\nnot_undisclosed_human_apdl=true\nsource=agent_constructed_legacy_command_path\nrecovery_freq_1=0.09956064\nrecovery_freq_1_is_not_attach_ta1=true\nrecovery_freqs_are_prior_run_fingerprints_only=true\n' > work/results/case.txt # Lock the evidence boundary.
      - name: Upload explicit Track A recovery evidence # Publish the selected model and native outputs.
        if: always() # Preserve a negative recovery audit as well as a successful selection.
        uses: actions/upload-artifact@v4 # Store the evidence as an Actions artifact.
        with: # Configure a stable artifact name and strict presence check.
          name: C3-TrackA-explicit-height-recovery # Identify the explicit no-spring height-model recovery.
          path: work/results/ # Upload the complete selected evidence and audit.
          if-no-files-found: error # Reject an empty evidence package.
          retention-days: 30 # Keep the recovery package available for independent review.
          compression-level: 9 # Compress large ASCII input decks efficiently.
