name: Zhaqing CAD-003 evidence and FreeCAD build

on:
  push:
    branches:
      - agent/zhaqing-freecad-cad003
    paths:
      - '.github/workflows/zhaqing-cad003.yml'
      - 'automation/zhaqing_cad003/**'
      - 'source-inputs/zhaqing-suspension-bridge/**'
      - 'bridge-fem-skill-suite/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/zhaqing-cad003.yml'
      - 'automation/zhaqing_cad003/**'
      - 'source-inputs/zhaqing-suspension-bridge/**'
      - 'bridge-fem-skill-suite/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhaqing-cad003-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-drawings:
    name: N02-N03 deterministic DWG scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - name: Checkout immutable source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install approved system converters
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libredwg-tools \
            fonts-noto-cjk \
            fontconfig
          fc-cache -f
          command -v dwg2dxf
          command -v dwgread

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/zhaqing_cad003/requirements-scan.txt

      - name: Install pinned Python dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r automation/zhaqing_cad003/requirements-scan.txt
          python -m pip freeze | sort > scan-python-freeze.txt
          {
            uname -a
            python --version
            dwg2dxf --version || true
            dwgread --version || true
            dpkg-query -W libredwg-tools || true
          } > scan-environment.txt 2>&1

      - name: Compile scanner before execution
        run: python -m py_compile automation/zhaqing_cad003/scan_drawings.py

      - name: Scan, convert, and render every source DWG
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/zhaqing-cad003/scan
          python automation/zhaqing_cad003/scan_drawings.py \
            --source-dir source-inputs/zhaqing-suspension-bridge/drawings \
            --output-dir build/zhaqing-cad003/scan \
            2>&1 | tee build/zhaqing-cad003/scan/runner.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve environment and source commit
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p build/zhaqing-cad003/scan/provenance
          cp scan-python-freeze.txt scan-environment.txt build/zhaqing-cad003/scan/provenance/
          git rev-parse HEAD > build/zhaqing-cad003/scan/provenance/source-commit.txt
          git status --short > build/zhaqing-cad003/scan/provenance/git-status.txt

      - name: Upload immutable scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhaqing-cad003-dwg-scan-${{ github.sha }}
          path: build/zhaqing-cad003/scan
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce scan result after evidence upload
        if: always()
        run: |
          test "${{ steps.scan.outputs.exit_code }}" = "0"
