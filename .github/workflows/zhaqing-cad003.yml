name: Zhaqing CAD-003 evidence and FreeCAD build

on:
  push:
    branches:
      - agent/zhaqing-freecad-cad003
    paths:
      - '.github/workflows/zhaqing-cad003.yml'
      - 'automation/zhaqing_cad003/**'
      - 'source-inputs/zhaqing-suspension-bridge/**'
      - 'bridge-fem-skill-suite/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/zhaqing-cad003.yml'
      - 'automation/zhaqing_cad003/**'
      - 'source-inputs/zhaqing-suspension-bridge/**'
      - 'bridge-fem-skill-suite/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhaqing-cad003-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-drawings:
    name: N02-N03 deterministic DWG scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      LIBREDWG_VERSION: '0.13.4'
      LIBREDWG_COMMIT: 'e3774bd4020fcfebb68150361db74b8b34d170fe'
    steps:
      - name: Checkout immutable source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize evidence directory before any fallible tool install
        run: |
          set -euxo pipefail
          mkdir -p build/zhaqing-cad003/scan/provenance
          git rev-parse HEAD > build/zhaqing-cad003/scan/provenance/source-commit.txt
          printf '%s\n' "${{ github.event_name }}" > build/zhaqing-cad003/scan/provenance/event-name.txt
          printf '%s\n' "${{ github.sha }}" > build/zhaqing-cad003/scan/provenance/event-sha.txt

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            bison flex gettext git ca-certificates \
            libpcre2-dev libxml2-dev \
            fonts-noto-cjk fontconfig
          fc-cache -f

      - name: Restore pinned LibreDWG build cache
        id: libredwg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zhaqing/libredwg/${{ env.LIBREDWG_COMMIT }}
          key: libredwg-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBREDWG_COMMIT }}

      - name: Build pinned LibreDWG converter from official source
        id: converter
        run: |
          set -euxo pipefail
          prefix="$HOME/.cache/zhaqing/libredwg/${LIBREDWG_COMMIT}"
          mkdir -p "$prefix"
          if [[ ! -x "$prefix/bin/dwg2dxf" || ! -x "$prefix/bin/dwgread" ]]; then
            rm -rf /tmp/libredwg
            git init /tmp/libredwg
            git -C /tmp/libredwg remote add origin https://github.com/LibreDWG/libredwg.git
            git -C /tmp/libredwg fetch --depth 1 origin "$LIBREDWG_COMMIT"
            git -C /tmp/libredwg checkout --detach FETCH_HEAD
            test "$(git -C /tmp/libredwg rev-parse HEAD)" = "$LIBREDWG_COMMIT"
            (
              cd /tmp/libredwg
              sh ./autogen.sh
              ./configure --disable-bindings --disable-docs --prefix="$prefix"
              make -j2
              make install
            ) 2>&1 | tee build/zhaqing-cad003/scan/provenance/libredwg-build.log
          else
            printf 'restored from Actions cache\n' | tee build/zhaqing-cad003/scan/provenance/libredwg-build.log
          fi
          printf '%s\n' "$LIBREDWG_COMMIT" > build/zhaqing-cad003/scan/provenance/libredwg-commit.txt
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$prefix/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          "$prefix/bin/dwg2dxf" --version
          "$prefix/bin/dwgread" --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: automation/zhaqing_cad003/requirements-scan.txt

      - name: Install pinned Python dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r automation/zhaqing_cad003/requirements-scan.txt
          python -m pip freeze | sort > build/zhaqing-cad003/scan/provenance/scan-python-freeze.txt
          {
            uname -a
            python --version
            dwg2dxf --version || true
            dwgread --version || true
          } > build/zhaqing-cad003/scan/provenance/scan-environment.txt 2>&1

      - name: Compile adapters before execution
        run: |
          set -euxo pipefail
          python -m py_compile automation/zhaqing_cad003/scan_drawings.py
          python -m py_compile automation/zhaqing_cad003/render_and_export_dxf.py

      - name: Scan and convert every source DWG
        id: scan
        continue-on-error: true
        run: |
          set -o pipefail
          python automation/zhaqing_cad003/scan_drawings.py \
            --source-dir source-inputs/zhaqing-suspension-bridge/drawings \
            --output-dir build/zhaqing-cad003/scan \
            2>&1 | tee build/zhaqing-cad003/scan/runner.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Export complete geometry and verified black-on-white renders
        id: geometry
        if: steps.scan.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set -o pipefail
          python automation/zhaqing_cad003/render_and_export_dxf.py \
            --scan-report build/zhaqing-cad003/scan/scan_report.json \
            --converted-dir build/zhaqing-cad003/scan/converted_dxf \
            --output-dir build/zhaqing-cad003/scan/n03_geometry \
            2>&1 | tee build/zhaqing-cad003/scan/n03-geometry-runner.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve final provenance even after prior failure
        if: always()
        run: |
          set +e
          mkdir -p build/zhaqing-cad003/scan/provenance
          git status --short > build/zhaqing-cad003/scan/provenance/git-status.txt
          git log -1 --format=fuller > build/zhaqing-cad003/scan/provenance/checkout-commit.txt
          command -v dwg2dxf > build/zhaqing-cad003/scan/provenance/dwg2dxf-path.txt 2>&1
          command -v dwgread > build/zhaqing-cad003/scan/provenance/dwgread-path.txt 2>&1
          printf 'converter_outcome=%s\n' "${{ steps.converter.outcome }}" > build/zhaqing-cad003/scan/provenance/step-outcomes.txt
          printf 'scan_outcome=%s\n' "${{ steps.scan.outcome }}" >> build/zhaqing-cad003/scan/provenance/step-outcomes.txt
          printf 'scan_exit_code=%s\n' "${{ steps.scan.outputs.exit_code }}" >> build/zhaqing-cad003/scan/provenance/step-outcomes.txt
          printf 'geometry_outcome=%s\n' "${{ steps.geometry.outcome }}" >> build/zhaqing-cad003/scan/provenance/step-outcomes.txt
          printf 'geometry_exit_code=%s\n' "${{ steps.geometry.outputs.exit_code }}" >> build/zhaqing-cad003/scan/provenance/step-outcomes.txt
          true

      - name: Upload immutable scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zhaqing-cad003-dwg-scan-${{ github.sha }}
          path: build/zhaqing-cad003/scan
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce scan result after evidence upload
        if: always()
        run: |
          test "${{ steps.converter.outcome }}" = "success"
          test "${{ steps.scan.outputs.exit_code }}" = "0"
          test "${{ steps.geometry.outputs.exit_code }}" = "0"
