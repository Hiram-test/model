name: Extract Catwalk Drawing v4 # Isolated evidence-recovery workflow for the flexible-section rebuild.
on: # Define automatic execution for this branch only.
  push: # Start once when this workflow is created or revised.
    branches: [feat/catwalk-clean-theory-v4-flexible-section] # Restrict execution to the v4 branch.
    paths:
      - ".github/workflows/extract-catwalk-drawing-v4.yml"
      - "catwalk-fem/clean-theory-14modes/V4_DRAWING.bound.md"
      - "catwalk-fem/clean-theory-14modes/v4_drawing.case.txt"
  workflow_dispatch: # Allow exact reruns without changing source files.
permissions: # Declare only the permission needed to download release assets.
  contents: read # Keep repository access read-only.
jobs: # Define the single extraction job.
  extract: # Recover only the archived catwalk drawing PDF.
    runs-on: ubuntu-24.04 # Use a current hosted Linux runner.
    timeout-minutes: 30 # Bound release download and extraction time.
    steps: # Execute the evidence-recovery chain.
      - name: Checkout # Record the exact branch state used for recovery.
        uses: actions/checkout@v4 # Use the maintained checkout action.
        with: # Configure a shallow read-only checkout.
          fetch-depth: 1 # Fetch only the triggering commit.
          persist-credentials: false # Prevent repository writes from the runner.
      - name: Install zstd # Ensure the archived tar.zst shard can be inspected.
        shell: bash # Use strict Bash semantics.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd # Install only the decompressor required by the archive format.
      - name: Locate archived drawing # Resolve the primary source copy from the published package index.
        shell: bash # Use strict Bash for GitHub CLI and Python parsing.
        env: # Expose the workflow-scoped token only to this step.
          GH_TOKEN: ${{ github.token }} # Authenticate release-asset download in the same repository.
        run: | # Execute the deterministic index lookup.
          set -euxo pipefail # Fail on missing index rows or ambiguous extraction.
          gh release download zhangjinggao-full-20260729 --repo "$GITHUB_REPOSITORY" --pattern package-members.csv --dir /tmp/archive-index # Download only the small published package index.
          python3 - <<'PY' # Parse the index without shell encoding assumptions.
          import csv  # Read the quoted package-members CSV safely.
          import json  # Write the selected shard and path for the next shell commands.
          from pathlib import Path  # Handle the downloaded index path deterministically.
          path = Path('/tmp/archive-index/package-members.csv')  # Point to the published package index.
          wanted = '01_设计资料与规范/00张靖皋长江大桥南航道桥猫道图纸1225.pdf'  # Freeze the primary archive path and exclude later copied development packages.
          matches = []  # Collect rows whose normalized path equals the primary drawing path.
          with path.open('r', encoding='utf-8-sig', newline='') as handle:  # Open the index with BOM-safe UTF-8 decoding.
              for row in csv.reader(handle):  # Traverse every published package-member row.
                  relative = row[2].replace('\\\\', '/').replace('\\', '/') if len(row) >= 3 else ''  # Normalize Windows separators before comparison.
                  if relative == wanted:  # Match only the primary design-data copy.
                      matches.append({'shard': row[0], 'relative': relative})  # Preserve the exact shard and primary path.
          if len(matches) != 1:  # Require one and only one primary archived source file.
              raise SystemExit(f'expected one primary catwalk drawing row, found {len(matches)}: {matches}')  # Reject ambiguous archive evidence.
          Path('/tmp/catwalk-drawing-location.json').write_text(json.dumps(matches[0], ensure_ascii=False, indent=2) + '\n', encoding='utf-8')  # Save the resolved archive location.
          print(json.dumps(matches[0], ensure_ascii=False))  # Emit the selected shard and path into the Actions log.
          PY
          SHARD=$(python3 -c "import json; print(json.load(open('/tmp/catwalk-drawing-location.json'))['shard'])") # Read the exact archive shard selected by the index.
          gh release download zhangjinggao-full-20260729 --repo "$GITHUB_REPOSITORY" --pattern "$SHARD" --dir /tmp/archive-shard # Download only that one archive shard.
          mkdir -p /tmp/extracted /tmp/delivery # Create isolated extraction and delivery directories.
          MATCH=$(tar --use-compress-program=unzstd -tf "/tmp/archive-shard/$SHARD" | grep '^01_设计资料与规范/00张靖皋长江大桥南航道桥猫道图纸1225.pdf$' | head -n 1) # Resolve only the primary tar member path.
          test -n "$MATCH" # Reject an archive that does not contain the indexed primary drawing.
          tar --use-compress-program=unzstd -xf "/tmp/archive-shard/$SHARD" -C /tmp/extracted "$MATCH" # Extract only the selected drawing member.
          cp "/tmp/extracted/$MATCH" /tmp/delivery/Old_Catwalk_Drawing_2025.pdf # Copy the drawing to a stable ASCII artifact name.
          cp /tmp/catwalk-drawing-location.json /tmp/delivery/archive_location.json # Preserve the index-derived provenance record.
          cp -f catwalk-fem/clean-theory-14modes/V4_DRAWING.bound.md /tmp/delivery/BOUND.md
          cp -f catwalk-fem/clean-theory-14modes/v4_drawing.case.txt /tmp/delivery/case.txt
          printf '%s\n' "${GITHUB_SHA}" > /tmp/delivery/GITHUB_COMMIT.txt
          (cd /tmp/delivery && sha256sum Old_Catwalk_Drawing_2025.pdf archive_location.json BOUND.md case.txt GITHUB_COMMIT.txt > SHA256SUMS.txt)
      - name: Stamp boundary evidence after success or extract reject
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/delivery
          cp -f catwalk-fem/clean-theory-14modes/V4_DRAWING.bound.md /tmp/delivery/BOUND.md
          cp -f catwalk-fem/clean-theory-14modes/v4_drawing.case.txt /tmp/delivery/case.txt
          printf '%s\n' "${GITHUB_SHA}" > /tmp/delivery/GITHUB_COMMIT.txt
          if [ ! -s /tmp/delivery/Old_Catwalk_Drawing_2025.pdf ]; then
            printf '%s\n' \
              'frequency_reproduced=false' \
              'not_attach_ta1=true' \
              'not_flexible_section_model=true' \
              'kind=archived_drawing_extract_failed' \
              > /tmp/delivery/EXTRACT_REJECT.txt
          fi
      - name: Upload recovered drawing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catwalk-drawing-2025-v4-boundary
          path: /tmp/delivery/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
