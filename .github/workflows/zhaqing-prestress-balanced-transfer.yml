name: Zhaqing balanced prestress load transfer # Validate an exactly balanced native-prestress initialization before transfer to verified permanent loads.
on: # Define branch, child-PR and manual execution triggers for the isolated diagnostic.
  push: # Run automatically when the dedicated research branch changes this diagnostic.
    branches: # Restrict automatic execution to the reversible prestress branch.
      - agent/zhaqing-prestress-isolation # Execute only the dedicated Zhaqing prestress branch.
    paths: # Trigger only this workflow and its direct source dependencies.
      - '.github/workflows/zhaqing-prestress-balanced-transfer.yml' # Re-run when this workflow changes.
      - 'automation/zhaqing_prestress/balanced_transfer_v2.py' # Re-run when the balanced-transfer diagnostic changes.
      - 'automation/zhaqing_prestress/prestress_isolation.py' # Re-run when the shared baseline parser or CalculiX runner changes.
      - 'automation/zhaqing_prestress/elementwise_prestress.py' # Re-run when mechanics-derived prestress targets change.
      - 'automation/zhaqing_prestress/initial_stress_prestress.py' # Re-run when global initial-stress tensor conversion changes.
  pull_request: # Run the same diagnostic on the child PR so its evidence is visible through PR workflow inspection.
    branches: # Restrict the comparison base to the original Zhaqing PR9 head branch.
      - agent/zhaqing-freecad-cad003 # Compare only the isolated prestress intervention against the frozen PR9 branch.
    paths: # Trigger the child-PR calculation only for this diagnostic and its direct dependencies.
      - '.github/workflows/zhaqing-prestress-balanced-transfer.yml' # Validate workflow changes inside the child PR.
      - 'automation/zhaqing_prestress/balanced_transfer_v2.py' # Validate balanced-transfer implementation changes inside the child PR.
      - 'automation/zhaqing_prestress/prestress_isolation.py' # Validate shared baseline-parser and solver-runner changes inside the child PR.
      - 'automation/zhaqing_prestress/elementwise_prestress.py' # Validate prestress-target changes inside the child PR.
      - 'automation/zhaqing_prestress/initial_stress_prestress.py' # Validate native-stress tensor conversion changes inside the child PR.
  workflow_dispatch: # Permit an explicit rerun without source mutation.
permissions: # Grant only read access required for source checkout and verified artifact recovery.
  contents: read # Allow checkout of the tested source revision.
  actions: read # Allow download of the successful verified PR9 L2 artifact.
jobs: # Define one deterministic balanced-transfer nonlinear diagnostic job.
  solve: # Generate, solve, audit and preserve the completed-state prestress diagnostic.
    runs-on: ubuntu-22.04 # Match the CalculiX-compatible Ubuntu family used by the original PR9 workflows.
    timeout-minutes: 45 # Bound the two-step nonlinear diagnostic and evidence packaging.
    env: # Freeze upstream evidence identifiers and local output location.
      BASELINE_RUN_ID: '30068283053' # Recover the successful verified PR9 L2 static-shell run.
      BASELINE_ARTIFACT: 'verified-zhaqing-s4-static-shell-9531999012bd4a94bd937e59f74443c12bcb4b23' # Pin the exact verified L2 artifact name.
      OUT: 'build/zhaqing-prestress-balanced-transfer' # Store every generated input, result and receipt under one evidence root.
    steps: # Execute recovery, solver installation, diagnostic and evidence upload sequentially.
      - name: Checkout tested source # Recover exactly the branch revision being validated.
        uses: actions/checkout@v4 # Use the maintained GitHub checkout action.
        with: # Freeze checkout behavior for reproducibility and least privilege.
          fetch-depth: 1 # Fetch only the tested revision.
          persist-credentials: false # Prevent numerical commands from inheriting repository write credentials.
      - name: Recover verified PR9 L2 baseline # Reuse the successful baseline without regenerating bridge topology, mesh or loads.
        uses: actions/download-artifact@v4 # Recover immutable upstream numerical evidence.
        with: # Pin the exact artifact, repository and workflow run.
          name: ${{ env.BASELINE_ARTIFACT }} # Select the frozen verified L2 artifact.
          path: recovered-baseline # Extract the upstream package into an isolated working directory.
          github-token: ${{ github.token }} # Authenticate the cross-run artifact read.
          repository: Hiram-test/model # Read from the same bridge-model repository.
          run-id: ${{ env.BASELINE_RUN_ID }} # Pin the successful baseline run identifier.
      - name: Install CalculiX # Install the same open-source solver family used by the original PR9 calculation.
        shell: bash # Use strict Bash semantics for package installation.
        run: | # Enable Ubuntu Universe, install ccx and verify the executable.
          set -euxo pipefail # Stop immediately on package or shell failures.
          sudo apt-get update # Refresh Ubuntu package metadata.
          sudo apt-get install -y --no-install-recommends software-properties-common # Install repository-management support.
          sudo add-apt-repository -y universe # Enable the repository containing calculix-ccx.
          sudo apt-get update # Refresh metadata after enabling Universe.
          sudo apt-get install -y --no-install-recommends calculix-ccx # Install CalculiX CrunchiX.
          command -v ccx # Require the solver executable on PATH.
      - name: Run balanced prestress transfer # Establish exact free-DOF prestress balance and then ramp to the unchanged verified permanent-load state.
        shell: bash # Execute syntax validation and nonlinear solution under strict Bash semantics.
        run: | # Locate the verified baseline and run the single scale-1.18 diagnostic.
          set -euxo pipefail # Fail on missing inputs, syntax errors or an unqualified nonlinear result.
          mkdir -p "$OUT" # Create the numerical evidence root before solver execution.
          base="$(find recovered-baseline -type f -path '*/flat/LC01_G_DEAD.inp' | head -1)" # Locate the exact verified PR9 L2 dead-load deck.
          test -s "$base" # Require a nonempty immutable baseline input.
          python3 -m py_compile automation/zhaqing_prestress/prestress_isolation.py automation/zhaqing_prestress/elementwise_prestress.py automation/zhaqing_prestress/initial_stress_prestress.py automation/zhaqing_prestress/balanced_transfer_v2.py # Reject Python syntax errors before launching CalculiX.
          python3 automation/zhaqing_prestress/balanced_transfer_v2.py --base "$base" --output "$OUT" --ccx "$(command -v ccx)" # Execute the balanced native-prestress initialization and transfer to verified permanent loads.
      - name: Preserve provenance # Record exact source and solver environment after success or failure.
        if: always() # Preserve provenance for rejected nonlinear diagnostics as well as successful ones.
        shell: bash # Use deterministic text diagnostics for environment evidence.
        run: | # Write source and solver records beside the numerical receipt.
          set +e # Continue metadata collection if an optional diagnostic is unavailable.
          mkdir -p "$OUT/provenance" # Ensure the provenance directory exists after every upstream outcome.
          git rev-parse HEAD > "$OUT/provenance/source-commit.txt" # Record the exact tested repository revision.
          uname -a > "$OUT/provenance/environment.txt" # Record runner kernel and architecture.
          dpkg-query -W calculix-ccx >> "$OUT/provenance/environment.txt" 2>&1 || true # Append the installed CalculiX package version when available.
      - name: Upload complete balanced-transfer evidence # Preserve the generated INP, solver outputs, logs and receipt before final workflow status.
        if: always() # Upload partial evidence even when the nonlinear gate rejects the diagnostic.
        uses: actions/upload-artifact@v4 # Store the complete numerical package in GitHub Actions artifact storage.
        with: # Name and retain the evidence deterministically.
          name: zhaqing-prestress-balanced-transfer-${{ github.sha }} # Bind the artifact to the exact tested source commit.
          path: build/zhaqing-prestress-balanced-transfer # Upload every generated numerical and provenance file.
          if-no-files-found: error # Treat missing numerical evidence as an explicit workflow error.
          retention-days: 30 # Retain the diagnostic for downstream AFEM integration and audit.
          compression-level: 6 # Use moderate compression for CalculiX field-result files.
